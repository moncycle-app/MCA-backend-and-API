openapi: 3.0.3

info:
  title: moncycle.app API
  version: "2.0"
  termsOfService: https://www.moncycle.app/ToS/term_of_service_fr.html
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
  description: |-
    This API stores **daily fertility observations** for one person, or for one couple sharing
    an account. It is the backend of the moncycle.app web app; mobile apps, scripts and research
    tools can use it too.

    Using the API means accepting the terms of service (`termsOfService` above). A server may publish its own:
    the address is `termsOfServiceUrl` in `GET /server_info`. A client that creates accounts must have the
    user accept them first (`POST /register` requires `termsAccepted: true`).

    Read sections 1 to 8 once, then use the rest as a reference. Domain words are explained in the glossary (section 11).

    ---

    ## 1. The one idea: one day = one observation

    An account owns a **timeline**: a list of calendar days. Each day holds what the user observed on that date.
    The calendar date is the identifier: there is no "entry id", no "chart" and no "cycle" resource.

    ```
    timeline of one account
    ┌──────────┬──────────┬──────────┬──────────┬──────────┬──────────┐
    │2026-03-08│2026-03-09│2026-03-10│2026-03-11│2026-03-12│2026-03-13│
    ├──────────┼──────────┼──────────┼──────────┼──────────┼──────────┤
    │          │          │ cycle    │          │ isPeak   │          │
    │ stamp    │ stamp    │ FirstDay │ stamp    │ = true   │ stamp    │
    │ = Green  │ = Green  │ = true   │ = Red    │          │ = White  │
    └──────────┴──────────┴──────────┴──────────┴──────────┴──────────┘
                           ^
                           └─ a new cycle starts here
    ```

    Each column is one day: the date is its identifier, and the rows are the fields of that day
    (see the `Day` schema). A field with nothing in it is empty.

    A cycle is **derived**, never stored. The cycle of a date starts at the closest day at or before it with
    `cycleFirstDay: true`; `cycleStartDate` and `cycleDay` are computed by the server on every read.
    To start a cycle, write a day with `cycleFirstDay: true`. To undo it, write that day again with `false`.

    ## 2. Rules for every response

    **Success** is wrapped in `data` (an object, or a bare array for a list). A few answers add a sibling `meta`
    that describes the answer (for instance what `POST /account` changed).

    ```json
    { "data": { "status": "oookkk" } }
    ```

    **Failure** is wrapped in `error`. Branch on `code` (stable); show or log `message` (never parse it);
    `details` is optional.

    ```json
    { "error": { "code": "invalid_credentials", "message": "Incorrect password or non-existent account." } }
    ```

    **The HTTP status is real.** Check it first, then the body.

    | Status | Meaning |
    |---|---|
    | `400` | The request is not valid (`validation_failed`, `invalid_json`), see below |
    | `401` | Not signed in (`unauthorized`) |
    | `403` | Refused: `read_only_token`, `cross_origin_refused`, `account_locked`... |
    | `409` | Conflict with the current state (`stale_write`, `duplicate_name`...) |
    | `413` | `file_too_large`: the body is over the server's limit (10 MB by default, an operator setting; `requestBodyMaxBytes` of `GET /server_info` tells it), on any endpoint |
    | `415` | `unsupported_media_type`: a body that is not sent as JSON. `multipart/form-data` and `application/x-www-form-urlencoded` are refused on every endpoint, before anything is read: the API takes no upload and no form |
    | `429` | Too many attempts from your IP address (`rate_limited`) |
    | `503` | `maintenance`: the operator stopped the server, nothing was done, try later. Only `GET /server_info` stays up. `schema_mismatch`: the database needs a migration |

    A method an endpoint does not take answers `405 method_not_allowed` with an `Allow` header. A `201` carries a
    `Location`. Every response (but `GET /health_check`) has an `X-Request-Id` header to quote when you report a
    problem; you may send your own (letters, digits and `._:-`, 64 characters at most).

    **Two endpoints answer a file** when they work (`GET /export/{format}`, `GET /all_of_my_data_plz`). Their errors
    use the usual envelope.

    ### Validation errors list every problem

    A request that is wrong in what it says (unknown field, wrong type, value out of range, impossible date) is
    refused with `400 validation_failed`, and `details.issues` lists **all** the problems:

    ```json
    {
      "error": {
        "code": "validation_failed",
        "message": "The request is not valid: 2 problems (see details.issues). First: Unknown field 'stampColour'. Did you mean 'stampColor'?",
        "details": {
          "issues": [
            { "field": "stampColour", "code": "unknown_field", "message": "Unknown field 'stampColour'. Did you mean 'stampColor'?" },
            { "field": "temperature", "code": "wrong_type", "message": "'temperature' must be a decimal number, got string." }
          ]
        }
      }
    }
    ```

    - `field` is a body field (`stampColor`, `freeMucusSensation[2]`), `query.from` or `path.date`.
    - `code` is a stable slug (`unknown_field`, `wrong_type`, `out_of_range`, `too_long`, `invalid_date`...; the list is the `ValidationIssue` schema).

    Nothing is silently ignored: a typo in a field name is an error. Two exceptions: the computed fields of a day
    are dropped when you send a day back, and a field set to `null` is the same as a field not sent.

    Other errors (`unauthorized`, `invalid_password`, `stale_write`, `not_found`, `totp_invalid`...) keep their own code and status.

    ### Compatibility

    This page describes **v2**, served under `/api/v2/` (every path below is relative to it). `appVersion` in
    `GET /server_info` is the version of the app, not of the contract.

    - Stays in v2: a new field in an answer, a new optional request field, a new endpoint, a new enum value, a new
      `code`. **A client must ignore the fields and enum values it does not know**, and treat an unknown `code` like
      any other error of the same status.
    - A breaking change is published as `/api/v3/`; v2 is not touched.

    ## 3. Authentication

    One credential: a **token**, obtained from `POST /token`. Send it in either of two ways; each works alone on every
    protected endpoint:

    ```
    Authorization: Bearer <token>          <- apps, scripts, mobile clients
    Cookie: MONCYCLEAPP_TOKEN=<token>      <- browsers (the server sets it when you ask)
    ```

    If both are sent, only the `Authorization` header is looked at.

    - **Lifetime.** A token made without `expiresInDays` is deleted after 40 days without use, or one year after
      its creation. With `expiresInDays` it dies on that day whatever its use. A dead token answers `401`: sign in
      again (there is no refresh). The cookie lasts 5 years, so it can outlive its token.
    - **Several tokens.** An account can hold many (one per device). `GET /token` lists them, `DELETE /token` ends the
      one you use, `DELETE /token/{prefix}` one other (`prefix` = its first 5 characters), `DELETE /token?others=true` all the others.
    - **Scope.** `readWrite`, or `readOnly` (reads, and ends its own session). There are no other roles.
    - **Bodies are JSON.** Send `Content-Type: application/json` with every `POST` (`POST /import` too: the body is
      the NFP file), else `415 unsupported_media_type`. A `GET` and a `DELETE` take no body.
    - **Browser writes.** A write from a page of a foreign origin is refused with `403 cross_origin_refused`. Allowed
      origins: the server's own, the web app's, and those the operator lists. A request with no `Origin` header (curl,
      scripts, mobile apps) is never refused for this.
    - The session cookie is `HttpOnly` and `SameSite=Strict` unless the operator changed it.

    ## 4. First run

    Start with `GET /server_info` (public): `appVersion`, `maintenanceMode`, `registrationEnabled`, and the `limits` to
    check forms with.

    ```bash
    curl -s http://localhost:8003/api/v2/server_info
    # -> 200 {"data":{"app":"moncycle.app","appVersion":"15","maintenanceMode":false,"registrationEnabled":true,"limits":{...},...}}
    ```

    Creating an account needs a captcha: `POST /captcha` gives a picture and a signed token; send the token back with
    what the human read.

    ```bash
    # 1. A challenge for this address: a picture (data URI) and a token.
    curl -s -X POST http://localhost:8003/api/v2/captcha \
      -H 'Content-Type: application/json' \
      -d '{"purpose":"register","email":"marie@example.org"}'
    # -> 200 {"data":{"image":"data:image/jpeg;base64,...","token":"1790000000.9f2c...","expiresAt":1790000000}}
    # ... a human reads the picture, for example "a7k2fm"

    # 2. Create the account.
    curl -s -X POST http://localhost:8003/api/v2/register \
      -H 'Content-Type: application/json' \
      -d '{"nickname":"MB","email":"marie@example.org","password":"a long passphrase","birthYear":1994,
           "method":"cervicalMucus","temperatureTracking":false,"termsAccepted":true,
           "captcha":"a7k2fm","captchaToken":"1790000000.9f2c..."}'
    # -> 202 {"data":{"sent":true}}
    ```

    The account cannot sign in until its address is proved: the mail holds a link whose page posts to
    `POST /verify_email` (`purpose: "accountCreation"`). Until then `POST /token` answers `403 email_not_verified`.

    Then sign in and keep the token:

    ```bash
    curl -s -X POST http://localhost:8003/api/v2/token \
      -H 'Content-Type: application/json' \
      -d '{"email":"marie@example.org","password":"a long passphrase","name":"my script"}'
    # -> 201 {"data":{"prefix":"abcde","token":"abc...256 chars...","userId":42,"totpUsed":false,"name":"my script","scope":"readWrite",...}}
    ```

    ## 5. Daily use

    ```bash
    TOKEN=abc...   # from POST /token
    AUTH="Authorization: Bearer $TOKEN"

    # Settings. Call at start-up and when the app comes back to the foreground.
    curl -s -H "$AUTH" http://localhost:8003/api/v2/account

    # The whole timeline the first time; then only what changed (section 8).
    curl -s -H "$AUTH" http://localhost:8003/api/v2/timeline_sync

    # Write a day: day 1 of a new cycle, red stamp. The date is in the address.
    curl -s -H "$AUTH" -H 'Content-Type: application/json' \
      -X POST http://localhost:8003/api/v2/day/2026-03-10 \
      -d '{"cycleFirstDay":true,"stampColor":"Red","freeMucusSensation":["dry"],"comment":"cramps in the morning"}'
    # -> 201 with the day as stored

    # Read a week (100 days at most per call)
    curl -s -H "$AUTH" 'http://localhost:8003/api/v2/day?from=2026-03-04&to=2026-03-10'
    ```

    ### Writing a day replaces the whole day

    `POST /day/{date}` writes the **complete** day. A field you leave out is cleared (empty or `false`).

    ```
    stored:   { stampColor: "Red", isPeak: true, comment: "cramps" }
    you send: { stampColor: "Green" }
    result:   { stampColor: "Green", isPeak: false, comment: "" }
    ```

    So: read the day, change what you want, send the whole day back. A day you read can be sent as it is, and the
    answer is the stored day, so you can refresh your copy without a `GET`. (`POST /account` is the opposite: only
    the fields sent change.)

    ## 6. Dates, times and null

    | Thing | Format | Example |
    |---|---|---|
    | Calendar date | `YYYY-MM-DD` | `2026-03-10` |
    | Time of day | `hh:mm:ss` | `06:45:00` |
    | Timestamp | RFC 3339 **with a zone**; answers are always UTC with `Z` | `2026-03-10T05:32:48Z` |

    A timestamp you send (`lastWriteClientUtc`, `since`) needs a zone: `Z` or an offset such as `+02:00` (converted to
    UTC). Fractional seconds are fine. Without a zone it is refused (`invalid_timestamp`). In a URL write the `+` as `%2B`.

    Two timestamps appear on days, descriptions and the account:

    - **`lastWriteClientUtc`**: your clock, which you send. If you leave it out, or it is too far in the past or future,
      the server's clock is used. On a day it decides which write is the latest (see "A write that arrives late" on `POST /day/{date}`).
    - **`lastWriteDb`**: the server's clock, read-only. `GET /timeline_sync` is based on it, so a wrong clock on your side cannot make you miss anything.

    `null` means "no value recorded", `[]` "no labels", `""` "no comment". Booleans are JSON booleans, never
    `"true"`. On a request, `null` is the same as not sent.

    ## 7. Two tracking methods

    An account uses one method, chosen at registration and changeable with `POST /account`. It decides which fields of
    a day make sense; the others are accepted but the app does not show them.

    | Method | How a day is recorded | Fields used |
    |---|---|---|
    | `cervicalMucus` | free text | `freeMucusSensation`, `freeMucusObservation`, `freeOther` |
    | `fertilityCare` | short standard codes | the six `codified*` fields |

    Both use `stampColor`, `stampBaby`, `isPeak`, `cycleFirstDay`, `sexUnion`, `temperature`, `comment`...
    `temperatureTracking` is a separate boolean (does the user also record basal body temperature), so there are four
    combinations.

    ### Cervical mucus labels are shared objects

    A label such as "dry" or "clear and stretchy" is a reusable **description** with an `id` and a `useCount`, not a
    string stored on the day. You rarely create one by hand: a new name inside `freeMucusSensation` or
    `freeMucusObservation` creates it when you write the day. The `/description` endpoints serve a "most used first"
    picklist and rename or delete a label everywhere at once.

    - A name is **lower case with no leading or trailing space**, and unique per account. Anything you send is
      trimmed and lower-cased (`"Dry "` becomes `dry`).
    - A name keeps the type it was created with. If "dry" is an `observation`, sending it in `freeMucusSensation`
      links that same label.
    - A label can have `type: "undefined"`. A day shows it in `freeOther`, and keeps it only if you send it back
      there. To classify it, `POST /description/{id}` with a `type`.

    ## 8. Keeping a local copy in sync

    `GET /timeline_sync?since=...` is for a client that keeps its own copy (phone, browser, script). Settings are not
    in it: read `GET /account` separately.

    | Key | What it holds |
    |---|---|
    | `syncTimestamp` | The server clock. **Keep it**: it is the `since` of your next call. |
    | `days` | Days written since `since`, and the days that follow them in their cycle. A cleared day comes back empty. |
    | `descriptions` | **Every** label of the account, with its `useCount`. |
    | `allCyclesFirstDay` | **Every** day flagged `cycleFirstDay`, newest first. |
    | `allObservationPausedDates` | **Every** day flagged `observationPaused`, newest first. |

    The loop:

    ```
    1. Send your own unsent days and labels (POST/DELETE).
         A day answered 409 stale_write was written later by someone else: drop yours.
    2. GET /account                         (send its ETag back to get a 304)
    3. GET /timeline_sync?since=<lastSync>  (first time: no parameter)
    4. Merge into your copy:
         - each returned day replaces yours; an empty day means "forget this day";
         - the returned labels and lists of cycles and pauses replace yours;
         - except a day you changed after step 1: keep yours, you are about to send it
    5. Save syncTimestamp as lastSync, after step 4.
    ```

    Good to know:

    - Take the cursor from `syncTimestamp` only, and hand it back unchanged.
    - The server re-sends the last 120 seconds, so **your merge must tolerate a day received twice** (replacing it is enough).
    - `DELETE /day/{date}` keeps the row: the day comes back empty in `days`. A deleted label is simply absent from
      `descriptions`. Renaming, retyping or deleting a label also returns the days that carry it.
    - Setting or clearing `cycleFirstDay` returns every following day up to the next first day, with their new
      `cycleStartDate` and `cycleDay`. You never compute a cycle yourself.
    - The answer is not paged (about 500 bytes a day); the first call is the whole timeline.

    ## 9. Login protection

    Failed logins are counted per account and forgotten after 60 minutes without a failure.

    | Recent failures | What happens |
    |---|---|
    | 0 – 2 | normal sign-in |
    | 3 or more | a captcha is required: `403 captcha_required` |
    | 15 or more | the account is locked: `403 account_locked` |

    There is also a limit of 30 attempts per IP address (`429 rate_limited`).

    Every `POST /token` answer may carry `captchaRequired: true`: a hint about your **next** attempt. Then call
    `POST /captcha` with `{"purpose":"login","email":...}` and send the answer and token with the next sign-in. Ask
    for a new captcha after every refused attempt.

    The lock only stops a **wrong** password: the owner can still sign in with the right one. With two-factor
    authentication on, a wrong code counts like a wrong password and the lock refuses even the right one.

    The same counters guard the password and code that an open session is asked for again: `POST /account`
    (`newPassword`, `notificationEmails`, `loginEmail`), `POST /account/deletion`, `POST /totp/confirm` and
    `POST /totp/disable`. Past the lock threshold they answer `403 account_locked` until the failures age out; the
    session stays valid.

    ## 10. Privacy

    - An account only reads and writes **its own** data. There is no admin endpoint, no user list.
    - `GET /pub_stat` is public but rounded, so nobody can be recognised.
    - `POST /recover_password` and `POST /register` answer the same whether or not the address has an account.
    - `GET /all_of_my_data_plz` returns all the user's data as CSV (GDPR access); passwords, TOTP secrets and tokens are masked.
    - `POST /account/deletion` deletes the account and everything it owns. It needs the password.
    - An account with no activity for 4 years is deleted.
    - The server's log never holds a password, token, e-mail address, observation or description text.

    ## 11. Glossary

    | Term | Meaning |
    |---|---|
    | **NFP** | Natural Family Planning: methods based on daily body observations. |
    | **Cervical mucus self-observation** | Method `cervicalMucus`: the user describes cervical mucus in their own words. |
    | **FertilityCare** | The Creighton Model FertilityCare System: short standard codes such as `10KL` or `6C`. |
    | **Cycle** | From the first day of menstruation to the day before the next one. |
    | **Day 1** | The first day of a cycle: the day flagged `cycleFirstDay: true`. |
    | **Stamp** | The coloured square of the paper chart for one day: red, green, yellow or white. |
    | **Baby stamp** | A baby picture on a stamp, marking a potentially fertile day. |
    | **Peak day** | The last day of the most fertile mucus. A cycle can hold more than one `isPeak` day. |
    | **Sensation** | What the user *feels* ("dry"). |
    | **Observation** | What the user *sees* ("stretchy"). |
    | **Description** | A reusable free-text label: a sensation or an observation. |
    | **Basal temperature** | Body temperature at rest, right after waking up. |
    | **TOTP** | The 6-digit code of an authenticator app (two-factor authentication). |
    | **NFP file** | The portable JSON format of `/export` and `/import`. |
    | **Upsert** | A write that creates the record or replaces it. |

externalDocs:
  description: moncycle.app website
  url: https://www.moncycle.app

servers:
  - url: ./v2
    description: The server this documentation page is served from (relative paths).
  - url: https://tableau.moncycle.app/api/v2
    description: Production.
  - url: http://localhost:8003/api/v2
    description: Local development (docker).

# Every endpoint needs a token, unless it declares `security: []`.
security:
  - HTTPtoken: []
  - HTTPcookie: []

tags:
  - name: server
    description: |-
      Public endpoints. No token, no personal data. **`GET /server_info` is the first call of every client**: the
      version of the contract, whether the server is in maintenance and the limits to check a form with. Also monitoring
      (`GET /health_check`) and the public counters for a web site (`GET /pub_stat`).
  - name: auth
    description: |-
      Getting in and proving who you are: the captcha, sign-up, the link by e-mail (`POST /verify_email`), sign-in
      and the tokens (`POST`, `GET`, `DELETE /token`), the lost password, two-factor authentication.

      Read **sections 3 and 4** of the introduction first. The order of the calls matters: a
      captcha is asked for just before the call it guards, for the same address.
  - name: account
    description: |-
      The account: `GET /account`, `POST /account` (settings, login address, password), and its deletion.
  - name: timeline
    description: |-
      The heart of the API: the timeline of days (`/day`), the reusable free-text labels (`/description`), and
      `GET /timeline_sync`, which keeps a local copy up to date.

      Read **section 1** of the introduction first ("one day = one observation"), and
      **section 5** before your first write (`POST /day/{date}` replaces the whole day).
  - name: files
    description: |-
      Import and export. Both speak the portable **NFP file format**, which is versioned on its
      own (`schemaVersion`) and shared with other NFP apps.

      `GET /export/{format}` returns a **file** when it works and the usual `error` envelope when it does not.
      `POST /import` takes a file but answers like the rest of the API, with `data` on success and `error` on failure.

paths:

  # ---------------------------------------------------------------------------
  # GENERAL
  # ---------------------------------------------------------------------------

  /server_info:
    get:
      tags: [server]
      operationId: getServerInfo
      summary: What this server is — the first call of every client
      description: |-
        Public, no token. **Call it first.** It tells you the app version (`appVersion`), whether the server is in
        maintenance, which optional features are on (new accounts, demo accounts, captcha, news banner), the address of the
        terms of service, and the `limits` a form can check before sending anything.

        It does not open the database, so it answers in maintenance too.

        - `maintenanceMode`: `true` when the operator stopped the server. Every other endpoint then answers
          `503 maintenance`; this one stays `200`, so a client can tell the user to come back later.
        - `appVersion`: a string (`15`, `15dev`). It changes with each release: a client that finds a new value knows the
          server was updated (the web app then drops its local copy and reloads). It is not the version of the contract (`v2`).
        - `limits`: lengths in characters (`...Chars`), sizes in bytes (`...Bytes`), and how many days or dates one `GET /day` reads.
      security: []
      responses:
        "200":
          description: The server.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ServerInfo'
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'

  /health_check:
    get:
      tags: [server]
      operationId: getHealthCheck
      summary: Is the server alive?
      description: |-
        For monitoring. Answers `200` only if the server can read the database. Any other case is `503`
        (`database_unreachable`, or `maintenance`: a container healthcheck must accept that one as alive).

        ```json
        { "data": { "status": "oookkk" } }
        ```

        Nothing is written and nothing personal is read, so you can poll it often. For the version, the maintenance flag and
        the limits use `GET /server_info`.
      security: []
      responses:
        "200":
          description: The server and the database both work.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [oookkk]
        "503":
          description: |-
            `maintenance` — the server is in maintenance (the database was not looked at).
            `database_unreachable` — the database is down, or the query failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /pub_stat:
    get:
      tags: [server]
      operationId: getPubStat
      summary: Public counters
      description: |-
        Public, anonymous usage counters, for a web site. Every number is **rounded** so that nobody can be recognised:
        accounts and cycles to the nearest 10, observations to the nearest 100. A small server can report `0`.
        The numbers are refreshed once a day.

        Each call raises the visit counters: do not use it as a health check (use `GET /health_check`).
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accounts:
                        type: integer
                        description: Number of accounts, rounded to the nearest 10.
                        example: 1250
                      cycles:
                        type: integer
                        description: Number of recorded cycles, rounded to the nearest 10.
                        example: 8430
                      observations:
                        type: integer
                        description: Number of recorded days, rounded to the nearest 100.
                        example: 241500
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /register:
    post:
      tags: [auth]
      operationId: registerAccount
      summary: Create an account
      description: |-
        Creates an account and **emails a link that proves the address**. The account cannot sign in until the link is used
        (`POST /verify_email`, purpose `accountCreation`): `POST /token` answers `403 email_not_verified` meanwhile. An account
        whose address is not proved within 7 days is erased.

        ### The answer never says whether the address is new

        The answer is `202` whether the address is new or already has an account, so nobody can find out who has one. For an
        existing address nothing is changed, whatever the request says: its owner gets a mail saying so, with a link to choose
        a new password. Everything a request can get wrong is refused with a `400` before the address is looked at.

        ### Order of calls

        1. `POST /captcha` with `{"purpose":"register","email":...}`: a picture and a token.
        2. A human reads the picture.
        3. `POST /register` with the answer (`captcha`) and the token (`captchaToken`), for **the same address** (trimmed,
           lower case) and **from the same network**.

        The token lasts 5 minutes and works once: after a refused captcha, ask for a new one. A failed captcha counts as an
        attempt for your IP address (section 9, `429 rate_limited`).

        `sent: false` means the mail could not be sent: send the user to `POST /recover_password`.

        ### Body fields

        | Key | Type | Required | Usage |
        |---|---|---|---|
        | `nickname` | string (max 255) | Yes | Initials for instance. Not a name. |
        | `email` | string (email) | Yes | Login address; the link is mailed here. |
        | `password` | string | Yes | The chosen password; must match `passwordPolicyRegex` of `server_info` (128 characters at most). |
        | `birthYear` | integer | Yes | This year or up to 100 years earlier. Anonymous statistics only. |
        | `termsAccepted` | boolean | Yes | Must be `true`. |
        | `captcha` | string | Yes | The text read in the picture (purpose `register`). |
        | `captchaToken` | string | Yes | The `token` that came with the picture. |
        | `method` | `cervicalMucus` or `fertilityCare` | No | Default `cervicalMucus`. |
        | `language` | `EN`, `FR`, `ES`, `DE`, `IT`, `PL`, `PT` | No | Default `EN`. The mails the server sends to the account are written in it. |
        | `temperatureTracking` | boolean | No | Also record basal body temperature. Default `false`. |
        | `discoveredComment` | string (max 255) | No | How the user found the app. |
        | `okForResearch` | boolean | No | Consent to share anonymous data with research. Default `false`. |
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname, email, password, birthYear, termsAccepted, captcha, captchaToken]
              properties:
                nickname:
                  type: string
                  maxLength: 255
                  description: A nickname, their initials for instance. Do not ask for a name.
                  example: MB
                email:
                  type: string
                  format: email
                  description: Login address; the link that proves it is sent here. Stored in lower case, so `Marie@Example.org` and `marie@example.org` are one account.
                  example: marie@example.org
                password:
                  type: string
                  maxLength: 128
                  description: The chosen password. It must match `passwordPolicyRegex` of `server_info` and be 128 characters at most. Ignored when the address already has an account.
                  example: a long passphrase
                birthYear:
                  type: integer
                  description: Year of birth, for anonymous statistics only (± 2 years is fine). This year or up to 100 years earlier.
                  example: 1994
                captcha:
                  type: string
                  description: The text read in the picture from `POST /captcha`. Case and spaces do not matter.
                  example: ak7fpm
                captchaToken:
                  type: string
                  description: The `token` that came with the picture (purpose `register`, this address). Valid for 5 minutes.
                  example: 1790000000.9f2c6b1e0d4a8f7c3b5e2a1d9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b
                method:
                  type: string
                  enum: [cervicalMucus, fertilityCare]
                  default: cervicalMucus
                  description: Tracking method (introduction, section 7).
                language:
                  type: string
                  enum: [EN, FR, ES, DE, IT, PL, PT]
                  default: EN
                  description: "The language of the account. The mails the server sends to the account are written in it."
                temperatureTracking:
                  type: boolean
                  default: false
                  description: Does the user also record basal body temperature?
                discoveredComment:
                  type: string
                  maxLength: 255
                  description: Free-text answer to "how did you find this app?". Optional.
                  example: recommended by my midwife
                okForResearch:
                  type: boolean
                  default: false
                  description: Consent to share anonymous data with research. Can be changed later (`research` in `POST /account`).
                termsAccepted:
                  type: boolean
                  description: "Must be `true`: the user accepts the terms of service (`termsOfServiceUrl` in `GET /server_info`). `false` is refused with the issue `terms_not_accepted`."
                  example: true
      responses:
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "202":
          description: Request accepted, for a new address and for one that already has an account alike. The mail holds a link.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sent:
                        type: boolean
                        description: "`false` means the mail could not be sent."
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "403":
          description: |-
            `registration_disabled` — this instance does not accept new accounts.
            `captcha_invalid` — a wrong answer, or a token that is missing, altered, cut, for another address or another network, or already used. One code for all of them, on purpose.
            `captcha_expired` — the token is more than 5 minutes old: ask for a new one.
            `cross_origin_refused` — a browser page of another origin sent this write (see section 3 of the introduction).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "429":
          description: "`rate_limited` — too many failed attempts from this IP address (section 9). Wait and try again later."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "503":
          description: "`captcha_unavailable` — the instance has no `CAPTCHA_SECRET` of at least 32 characters, so the captcha is closed and nothing that needs one can be done. `maintenance` — see section 2."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "409":
          description: |-
            `already_authenticated` — you sent a valid token; log out first. A token of one of the two public
            demo accounts does not count: the caller is a visitor, who can sign up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /captcha:
    post:
      tags: [auth]
      operationId: createCaptcha
      summary: Get a captcha challenge
      description: |-
        Gives a **picture** and a **token** for one purpose and one address. A human reads the picture; the call it guards
        then carries the answer (`captcha`) and the token (`captchaToken`). Nothing is stored on the server.

        | `purpose` | Guards | The token stops working when |
        |---|---|---|
        | `register` | `POST /register` | a link is made for the address (one mail per captcha), or the password changes |
        | `recover` | `POST /recover_password` | the same |
        | `login` | `POST /token`, once `captchaRequired` | a sign-in attempt is refused: ask again after each one |

        The answer looks the same whether or not the address has an account.

        The picture is a JPEG of six lower-case letters and digits. The answer is matched without regard to case or spaces.
        The token lasts 5 minutes (`expiresAt` is a Unix time). It only works for the purpose, the address and the network
        (same /24, or /64 for IPv6) it was made for; any mismatch, and a token already used, answer `captcha_invalid` without
        saying which. Ask for a new token when the address changes, after any refused captcha, and when it has expired.

        Only `POST` is accepted. The answer is not cached.

        ### Body fields

        | Key | Type | Required | Usage |
        |---|---|---|---|
        | `purpose` | `register`, `recover` or `login` | Yes | What the captcha is for. |
        | `email` | string (email) | Yes | The address of the call that follows. |
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, email]
              properties:
                purpose:
                  type: string
                  enum: [register, recover, login]
                  description: What the captcha is for.
                  example: register
                email:
                  type: string
                  format: email
                  description: The address of the call that follows (`POST /register`, `/recover_password` or `/token`).
                  example: marie@example.org
      responses:
        "200":
          description: A new challenge.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      image:
                        type: string
                        description: The picture, as a data URI (`data:image/jpeg;base64,...`), ready for the `src` of an `<img>`.
                      token:
                        type: string
                        description: "Send it back as `captchaToken`, with the answer as `captcha`."
                        example: 1790000000.9f2c6b1e0d4a8f7c3b5e2a1d9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b
                      expiresAt:
                        type: integer
                        description: When the token runs out, a Unix time (5 minutes after it was made).
                        example: 1790000000
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "403":
          $ref: '#/components/responses/CrossOriginRefused'
        "405":
          description: "`method_not_allowed` — only `POST`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "503":
          description: "`captcha_unavailable` — the instance has no `CAPTCHA_SECRET` of at least 32 characters. `maintenance` — see section 2."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /verify_email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Use the link of a mail
      description: |-
        Uses the link of a mail. It **proves the address** of a new account (`accountCreation`), **sets a new password**
        (`resetPassword`) or **changes the login address** (`changeEmail`). No token is needed: the mail may be opened on
        another device.

        ### The link

        A link is a page of the app: `APP_URL` + `verify_email#purpose=<purpose>&t=<token>`. The page posts both values here;
        a client that is not a web page reads them from the link and does the same.

        - A link works **once** and only for its purpose.
        - An account has **one pending link**: a new one (sign-up, `POST /recover_password`, a `loginEmail` change in
          `POST /account`) replaces the previous one, whatever it was for.
        - It lasts 3 days (`accountCreation`), 5 hours (`resetPassword`) or 1 day (`changeEmail`), then answers `token_expired`.
          A wrong, used or other-purpose link answers `invalid_token`.

        | `purpose` | Does | Also |
        |---|---|---|
        | `accountCreation` | the address is proved: the account can sign in | |
        | `resetPassword` | sets `newPassword` | proves the address; open sessions stay open; two-factor is untouched; the owner is told by mail |
        | `changeEmail` | the login address becomes the one the link was made for | the old address is told by mail; sessions stay open |

        A refused password (`400`) does not use the link up.

        ### Body fields

        | Key | Type | Required | Usage |
        |---|---|---|---|
        | `purpose` | `accountCreation`, `resetPassword` or `changeEmail` | Yes | What the link is for, as the link says. |
        | `token` | string | Yes | The token of the link (the `t` of its fragment). |
        | `newPassword` | string (10 to 128 characters) | `resetPassword` only | The new password. |
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, token]
              properties:
                purpose:
                  type: string
                  enum: [accountCreation, resetPassword, changeEmail]
                  description: What the link is for, as the link says.
                token:
                  type: string
                  description: The token of the link.
                newPassword:
                  type: string
                  minLength: 10
                  maxLength: 128
                  description: Required for `resetPassword` only. Must match `passwordPolicyRegex`; 128 characters at most.
      responses:
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "403":
          $ref: '#/components/responses/CrossOriginRefused'
        "200":
          description: The link was used up and did what it is for.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      purpose:
                        type: string
                        enum: [accountCreation, resetPassword, changeEmail]
                      loginEmail:
                        type: string
                        description: The address to sign in with from now on.
                        example: marie@example.org
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "409":
          description: "`email_taken` — (`changeEmail`) another account has the new address since the link was made. The account keeps its address."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "429":
          description: "`rate_limited` — too many attempts from this IP address (section 9): every call counts until it succeeds. Wait and try again later."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /token:
    post:
      tags: [auth]
      operationId: createToken
      summary: Sign in, and get a token
      description: |-
        Exchanges an email and a password for a **token**. This is the only way to get one: the web app's session and a
        script's token come from the same call. The password is always checked, so a stolen session cannot make itself a new
        token. The limits of section 9 apply.

        ### The token

        - `name`: what you call it (256 characters at most, one line; default `API`). It is shown in `GET /token`, so make it
          recognisable (`backup script`). The web app uses `WEB-APP <domain>`.
        - `scope`: `readWrite` (default) or `readOnly`. A read-only token can read and end its own session; anything else
          answers `403 read_only_token`.
        - `expiresInDays`: 1 to 365. The token dies on that day. Without it, it lasts until destroyed, or 40 days without
          use, or a year.
        - `cookie`: `true` also sets the token as the `MONCYCLEAPP_TOKEN` cookie (for a browser). The token is in the
          answer either way.

        Each sign-in creates a **new** token and leaves the others valid, so signing in on a phone does not disconnect the
        laptop. **A script should sign in once and keep its token**: every sign-in adds a token to the list and sends a mail
        to the owner (the two public demo accounts excepted). That mail has the token's name, `prefix`, scope, expiry and
        user agent.

        ### Which call do I make?

        ```
        POST /token {email, password, name?, scope?, expiresInDays?, cookie?}
          |-- 201 + token ............... done
          |-- 401 totp_required ......... retry with {email, password, code}
          |-- 403 captcha_required ...... POST /captcha {purpose:"login", email}, then retry with {email, password, captcha, captchaToken}
          |-- 403 captcha_expired ....... ask for a new captcha
          |-- 401 invalid_credentials ... wrong email or password
          |-- 403 account_locked ........ too many failures, wait (section 9)
          |-- 429 rate_limited .......... too many attempts from this IP, wait
          '-- 400 validation_failed ..... a field is wrong (details.issues); nothing was counted
        ```

        A captcha and a TOTP code can be required together: send both.

        ### The success body

        The token as `GET /token` shows it (`current: true`), plus:

        - `token`: the credential, **shown this once**.
        - `totpUsed`: whether a second factor was verified.
        - `captchaRequired`: a hint about the **next** attempt, even on a success.

        ### Body fields

        | Key | Type | Required | Usage |
        |---|---|---|---|
        | `email` | string (email) | Yes | Login address. |
        | `password` | string | Yes | Account password. |
        | `name` | string (max 256) | No | Name of the token. Default `API`. |
        | `scope` | `readWrite` or `readOnly` | No | Default `readWrite`. |
        | `expiresInDays` | integer (1 to 365) | No | Days before the token dies. |
        | `cookie` | boolean | No | Also set the cookie. Default `false`. |
        | `code` | string (6 digits) or integer | After `401 totp_required` | Code of the authenticator app. |
        | `captcha` | string | After `403 captcha_required` | The text read in the picture (purpose `login`). |
        | `captchaToken` | string | With `captcha` | The `token` that came with the picture. |
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "201":
          description: Signed in. A token was made.
          headers:
            Set-Cookie:
              description: "`MONCYCLEAPP_TOKEN=<token>`. HttpOnly, SameSite=Strict by default (`COOKIE_SAMESITE`), 5 years (the day the token dies, with `expiresInDays`). Only with `cookie: true`."
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Token'
                      - type: object
                        properties:
                          token:
                            type: string
                            description: 256-character token. Shown once.
                          userId:
                            type: integer
                            example: 42
                          totpUsed:
                            type: boolean
                            description: "`true` when a TOTP code was verified."
                          captchaRequired:
                            type: boolean
                            description: Present and `true` when the **next** attempt on this account will need a captcha.
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          description: |-
            `invalid_credentials` — wrong password, or no such account. The same code is used for both,
            on purpose, so nobody can discover which emails have an account.
            `totp_required` — the password is correct, now send `code`.
            `totp_invalid` — the password is correct but `code` is wrong or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: |-
            `login_disabled` — this instance has logins turned off.
            `captcha_required` — send `captcha` (the answer) and `captchaToken` (from `POST /captcha`, purpose `login`, this address). Also the answer to a wrong or used-up one: after each refused attempt, ask for a new token.
            `captcha_expired` — the `captchaToken` is more than 5 minutes old.
            `account_disabled` — the account was deactivated by an administrator, or it is one of the two public demo accounts and this instance has them turned off (`DEMO_ENABLED`).
            `email_not_verified` — the password is right, but the address was never proved: the link mailed at sign-up has not been used (`POST /verify_email`). Said only to someone who knows the password (a wrong one still answers `401 invalid_credentials`), counted as no failed attempt, and no token is made.
            `account_locked` — too many recent failures. Wait; it clears after 60 minutes with no new failure. With two-factor authentication on, it also refuses the right password and code.
            `cross_origin_refused` — a browser page of another origin sent this write (see section 3 of the introduction).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "429":
          description: "`rate_limited` — too many attempts from this IP address. Wait and try again later."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "503":
          description: "`captcha_unavailable` — this account must answer a captcha and the instance has no `CAPTCHA_SECRET` of at least 32 characters. Nothing is counted against the account. `maintenance` — see section 2."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    get:
      tags: [auth]
      operationId: listTokens
      summary: List the account's tokens
      description: |-
        Every token of the account that still works, newest first: the browsers and apps signed in, and the tokens made for
        scripts. **The token itself is never shown again**; you see its first 5 characters, `prefix`, which is unique in the
        account and which `DELETE /token/{prefix}` takes.

        Each entry shows `createdAt`, `lastUsedAt`, `expiresAt`, `scope`, `current` (the token of this request), the user
        agent and the network of the address (cut to /24 or /48). `name` and the user agent are whatever the client said:
        the list helps the owner recognise devices, it proves nothing about who holds a token. When in doubt, revoke the
        others and change the password.

        `lastUsedAt` is updated at most every 5 minutes. The two demo accounts have no list (`403 demo_account`).
      responses:
        "200":
          description: The tokens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Token'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: "`demo_account` — a demo account has no list of tokens."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    delete:
      tags: [auth]
      operationId: deleteToken
      summary: Log out, or revoke every other token
      description: |-
        **No parameter**: ends the session you are using (deletes the token, clears the cookie). It is idempotent: a token
        already gone, or none at all, is a logout all the same and answers `204`. A read-only token may do it.

        **`others=true`**: revokes every token but the one you are using. Use it when a device is lost or a token leaked.
        A read-only token cannot (`403 read_only_token`), nor a demo session (`403 demo_account`).

        To revoke **one** token: `DELETE /token/{prefix}`.

        A `DELETE` takes no body (`400`, issue `body_not_allowed`).
      parameters:
        - name: others
          in: query
          required: false
          description: "`true` to revoke every other token. Any other value is refused: leave the parameter out to log out."
          schema:
            type: boolean
            enum: [true]
      responses:
        "204":
          description: Logged out. Also returned when you were not logged in.
          headers:
            Set-Cookie:
              description: Expires `MONCYCLEAPP_TOKEN`.
              schema:
                type: string
        "200":
          description: The other tokens were revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RevokedTokens'
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          description: "`unauthorized` — `others=true` was sent and the token is not valid."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: "`read_only_token` — a read-only token revoking others. `demo_account` — a demo session. `cross_origin_refused` — see section 3 of the introduction."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'

  /token/{prefix}:
    delete:
      tags: [auth]
      operationId: revokeToken
      summary: Revoke one token
      description: |-
        Revokes the token that starts with these 5 characters (`prefix` in `GET /token` or in the answer of `POST /token`).
        A token of another account, or one that does not exist, is `404 not_found`. Revoking your own prefix is a logout.

        A read-only token may only revoke itself. Demo account tokens cannot be revoked (`403 demo_account`).
        No body.
      parameters:
        - $ref: '#/components/parameters/TokenPrefix'
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RevokedTokens'
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: "`read_only_token` — a read-only token revoking another token. `demo_account` — see above. `cross_origin_refused` — see section 3 of the introduction."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: "`not_found` — `prefix` is not the start of a token of this account."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'

  /recover_password:
    post:
      tags: [auth]
      operationId: recoverPassword
      summary: Send a link to choose a new password
      description: |-
        Emails the owner a **link to choose a new password** (`POST /verify_email`, purpose `resetPassword`). The password
        is not touched until the link is used, so asking locks nobody out and open sessions stay open.

        **It always answers `200` with `sent: true`**, whether the account exists or not, and waits a random 1 to 5 seconds.
        This is deliberate: nobody can find out which addresses have an account. Show a neutral message such as *"If an
        account exists for this address, a link to choose a new password has been sent."*

        The link lasts 5 hours and works once. An account has one pending link, so this call replaces any other (including a
        waiting change of address). It also works for an account whose address is not proved yet.

        A captcha is required (`POST /captcha`, purpose `recover`), checked the same way whether the account exists or not.
        A token works once: of several requests that arrive together with one token, one succeeds and the others get
        `403 captcha_invalid`.

        ### Body fields

        | Key | Type | Required | Usage |
        |---|---|---|---|
        | `email` | string (email) | Yes | Login address of the account. |
        | `captcha` | string | Yes | The text read in the picture (purpose `recover`). |
        | `captchaToken` | string | Yes | The `token` that came with the picture. |
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, captcha, captchaToken]
              properties:
                email:
                  type: string
                  format: email
                  description: The login address of the account.
                  example: marie@example.org
                captcha:
                  type: string
                  description: The text read in the picture from `POST /captcha`. Case and spaces do not matter.
                  example: ak7fpm
                captchaToken:
                  type: string
                  description: The `token` that goes with that picture (purpose `recover`, this address).
                  example: 1790000000.9f2c6b1e0d4a8f7c3b5e2a1d9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b
      responses:
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "403":
          description: |-
            `captcha_invalid` — a wrong answer, or a token that is missing, altered, for another address or network, or already used (the link it was tied to is replaced). One code for all of them.
            `captcha_expired` — the token is more than 5 minutes old.
            `cross_origin_refused` — a browser page of another origin sent this write (see section 3 of the introduction).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "429":
          description: "`rate_limited` — too many failed attempts from this IP address (section 9). Wait and try again later."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "503":
          description: "`captcha_unavailable` — the instance has no `CAPTCHA_SECRET` of at least 32 characters. `maintenance` — see section 2."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "200":
          description: Request accepted. This says nothing about whether the account exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sent:
                        type: boolean
                        enum: [true]
        "400":
          $ref: '#/components/responses/ValidationFailed'

  /totp:
    post:
      tags: [auth]
      operationId: startTotpSetup
      summary: "Two-factor: step 1, start the setup"
      description: |-
        Starts the setup of **TOTP** two-factor authentication (the 6-digit code of an app such as Aegis, FreeOTP or Google
        Authenticator). It is a `POST` because it stores a new secret.

        ```
        POST /totp                          -> a new secret + a QR code   (state "init")
        POST /totp/confirm {code, password} -> turn it on                 (state "active")
        POST /totp/disable {code}           -> turn it off                (state "disabled")
        ```

        Two-factor is **not active** until `POST /totp/confirm` succeeds; until then sign-in works with the password alone,
        so a user who loses the QR code mid-setup is never locked out. Each call to `POST /totp` replaces the previous secret.

        Show `qrcode` to the user, with `initSecret` as a fallback.

        | Response field | Use |
        |---|---|
        | `qrcode` | A complete **SVG document as a string**. Render it directly. |
        | `otpauth` | The `otpauth://` URI behind the QR code (a "tap to add" link on mobile). |
        | `initSecret` | The base32 secret, for typing by hand. |

        `initSecret` and `otpauth` are as sensitive as a password: never log them.

        No body (or `{}`). A read-only token is refused (`403 read_only_token`).
      responses:
        "200":
          description: Setup started. The account state is now `init`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      totpState:
                        type: string
                        enum: [init]
                      initSecret:
                        type: string
                        description: Base32 secret. Secret value — do not log it.
                        example: JBSWY3DPEHPK3PXP
                      otpauth:
                        type: string
                        description: "`otpauth://` provisioning URI. Secret value — do not log it."
                        example: otpauth://totp/marie%40example.org?issuer=MONCYCLE.APP&secret=JBSWY3DPEHPK3PXP
                      qrcode:
                        type: string
                        description: A full SVG document, as a string.
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: "`read_only_token` — the token is read-only. `cross_origin_refused` — see section 3 of the introduction."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "409":
          description: "`totp_already_enabled` — turn it off with `POST /totp/disable` before setting it up again."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /totp/confirm:
    post:
      tags: [auth]
      operationId: confirmTotp
      summary: "Two-factor: step 2, turn it on with a code and the password"
      description: |-
        Turns two-factor on with one real code from the authenticator app **and the current password**. From then on
        `POST /token` asks for a `code`. The code is a string of digits (keep a leading zero: `"091710"`); a number is
        accepted too, and spaces are ignored.

        A wrong password or code counts like a failed sign-in (section 9).

        ### Body fields

        | Key | Type | Required | Usage |
        |---|---|---|---|
        | `code` | string (digits) or integer | Yes | One code from the authenticator app. |
        | `password` | string | Yes | Current password. |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpConfirmRequest'
      responses:
        "200":
          description: Two-factor authentication is on.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      totpState:
                        type: string
                        enum: [active]
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          description: "`unauthorized` — no valid token. `invalid_password` — the password is wrong. `totp_invalid` — the code is wrong or expired."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: "`read_only_token` — the token is read-only. `account_locked` — too many wrong passwords or codes lately (section 9). `cross_origin_refused` — see section 3 of the introduction."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "409":
          description: "`totp_already_enabled`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'

  /totp/disable:
    post:
      tags: [auth]
      operationId: disableTotp
      summary: "Two-factor: turn it off"
      description: |-
        Turns two-factor authentication off with one real code from the authenticator app. The secret is erased.
        It is a `POST` because a one-time code does not belong in a URL, and a `DELETE` takes no body.

        ### Body fields

        | Key | Type | Required | Usage |
        |---|---|---|---|
        | `code` | string (digits) or integer | Yes | One code from the authenticator app. |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
      responses:
        "200":
          description: Two-factor authentication is off.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      totpState:
                        type: string
                        enum: [disabled]
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          description: "`unauthorized` — no valid token. `totp_invalid` — the code is wrong or expired."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: "`read_only_token` — the token is read-only. `account_locked` — too many wrong passwords or codes lately (section 9). `cross_origin_refused` — see section 3 of the introduction."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "409":
          description: "`totp_not_enabled`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'

  /account:
    get:
      tags: [account]
      operationId: getAccount
      summary: The account and its settings
      description: |-
        Who the user is and their settings, in one small call. Make it after sign-in and when the app comes back to the
        foreground: `method` and `temperatureTracking` tell you **which fields of a day to show**.

        The timeline is not here. The cycles (`allCyclesFirstDay`, `allObservationPausedDates`) come with `GET /timeline_sync`, the news
        address with `GET /server_info`. No password hash or TOTP secret is ever returned.

        **`ETag`:** the answer carries one. Send it back in `If-None-Match` and an unchanged account answers `304` with no
        body. (The API sends `Cache-Control: no-store`, so your client has to keep the value and send it itself.)
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` of the last answer.
          schema:
            type: string
      responses:
        "200":
          description: The account.
          headers:
            ETag:
              description: Weak entity tag of the answer.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Account'
        "304":
          description: Unchanged since the `ETag` given. No body.
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

    post:
      tags: [account]
      operationId: updateAccount
      summary: Change the settings, the login address, the password
      description: |-
        Every setting of the account is changed here: nickname, method, preferences, notification addresses, login address
        and password.

        **Partial update:** only the fields you send change. (`POST /day/{date}` is the opposite.) `{}` is valid and changes
        nothing; `null` is the same as not sent. Send only the one of `method` / `temperatureTracking` you change.

        An unknown field, a read-only field of `GET /account` (`userId`, `inscriptionDate`, `oldestDay`, `totpState`) or a
        wrong value is refused with `400 validation_failed`, and nothing is changed.

        ### What needs the password again

        Send the **current password** as `password` in the same body for these three:

        | Field | What it does | Also needs |
        |---|---|---|
        | `newPassword` | Sets the new password at once (must differ from the current one). | `logoutOtherDevices: true` closes the other sessions |
        | `notificationEmails` | Addresses that receive the finished cycles, reminders and warnings, besides the login address. One string, `;` between addresses, 5 at most, `""` to empty. The login address gets a notice. | |
        | `loginEmail` | **Asks** to change the login address. A link goes to the **new** address and the change happens when it is used (`POST /verify_email`, purpose `changeEmail`, valid 1 day). The old address is told. | the TOTP `code` if two-factor is on |

        Without `password`: `400` (issue `password_required`). Wrong: `401 invalid_password`. Either way nothing is changed.
        Sending the value the account already has asks for no password (an unchanged `notificationEmails` is ignored; an
        unchanged `loginEmail` is refused, issue `email_unchanged`). The demo accounts cannot change these three
        (`403 demo_account`). A wrong password or code counts like a failed sign-in (section 9); past the lock threshold
        these three answer `403 account_locked`, the other settings do not.

        ### The response

        `data` is the account after the change. `meta` says what happened:

        - `fieldsUpdated`: the settings written (`password` when `newPassword` was set; never `loginEmail`, which changes when the link is used). It can be empty.
        - `loggedOutDevices`: present when `newPassword` was sent.
        - `loginEmailLinkSent`: present when `loginEmail` was sent; `false` means the mail could not be sent. The answer is
          the same if another account has that address (its owner gets a mail instead).

        ### Body fields

        All optional.

        | Key | Type | Usage |
        |---|---|---|
        | `nickname` | string (max 255) | New nickname. Not empty. |
        | `password` | string | Current password. Needed with `newPassword`, `notificationEmails`, `loginEmail`. |
        | `newPassword` | string (max 128 characters) | Must match `passwordPolicyRegex` and differ from the current one. |
        | `logoutOtherDevices` | boolean | With `newPassword`: close every other session. Default `false`. |
        | `loginEmail` | string (email) | Asks to change the login address. |
        | `code` | string (digits) | TOTP code, needed with `loginEmail` when two-factor is on. |
        | `notificationEmails` | string | See above (1024 characters at most). |
        | `method` | `cervicalMucus` or `fertilityCare` | Tracking method. |
        | `temperatureTracking` | boolean | Also record basal temperature. |
        | `birthYear` | integer | This year or up to 100 years earlier. |
        | `language` | `EN`, `FR`, `ES`, `DE`, `IT`, `PL`, `PT` | Language of the account. |
        | `timelineAscending` | boolean | Display preference: today at the top of the table. |
        | `research` | boolean | Consent to contribute anonymous data to research. |
        | `sponsor` | boolean | Marks the account as a financial supporter. |
        | `autoMailExport` | boolean | Mail the export of each finished cycle. |
        | `lastWriteClientUtc` | string (RFC 3339) | Your own clock. |
      requestBody:
        required: true
        description: Every field is optional. `{}` is valid and changes nothing.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatch'
            examples:
              rename:
                summary: A setting
                value:
                  nickname: MB
              newPassword:
                summary: A new password, closing the other sessions
                value:
                  password: the current passphrase
                  newPassword: a new long passphrase
                  logoutOtherDevices: true
      responses:
        "200":
          description: Done. Read `meta.fieldsUpdated` to see what really changed — it can be empty.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Account'
                  meta:
                    $ref: '#/components/schemas/AccountPatchMeta'
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          description: |-
            `unauthorized` — no valid token.
            `invalid_password` — `password` is wrong. Nothing was changed.
            `totp_required` — `loginEmail` would change, the account has two-factor authentication on, and no `code` was sent.
            `totp_invalid` — `code` is wrong or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: |-
            `read_only_token` — the token is read-only.
            `demo_account` — `newPassword`, `notificationEmails` or `loginEmail` on one of the two public demo accounts.
            `account_locked` — `newPassword`, `notificationEmails` or `loginEmail` with too many wrong passwords or codes lately (section 9).
            `cross_origin_refused` — a browser page of another origin sent this write (see section 3 of the introduction).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'

  /account/deletion:
    post:
      tags: [account]
      operationId: deleteAccount
      summary: Delete the account, for good
      description: |-
        Deletes the account for good, with its days, labels and tokens. It needs the password, and the TOTP `code` when
        two-factor is on. **It cannot be undone.**

        It is a `POST` on `/account/deletion`, not a `DELETE` on `/account`, because the password has to travel in a body.

        ### Body fields

        | Key | Type | Required | Usage |
        |---|---|---|---|
        | `password` | string | Yes | Current password. |
        | `code` | string (digits) or integer | When two-factor is on | TOTP code. Without it the answer is `401 totp_required`. |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                  maxLength: 1024
                  description: The current password.
                code:
                  type: string
                  description: The TOTP code. Required when two-factor authentication is on (without it the answer is `401 totp_required`); ignored otherwise. A string of digits (a leading zero matters), a number is accepted too.
                  example: "091710"
      responses:
        "204":
          description: The account is gone. The cookie is cleared.
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          description: "`unauthorized` — no valid token. `invalid_password` — the password is wrong: nothing was deleted. `totp_required` — two-factor authentication is on and no `code` was sent. `totp_invalid` — `code` is wrong or expired."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: "`read_only_token` — the token is read-only. `account_locked` — too many wrong passwords or codes lately (section 9). `cross_origin_refused` — see section 3 of the introduction."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'

  /timeline_sync:
    get:
      tags: [timeline]
      operationId: getTimelineSync
      summary: What changed in the timeline since the last sync?
      description: |-
        Brings a local copy of the timeline up to date: the days written since `since`, every label, the cycles and the
        pauses. Several clients of one account stay consistent without downloading everything each time. (Settings are
        in `GET /account`.)

        Section 8 of the introduction gives the loop. In short:

        - Take `since` from `syncTimestamp` of the previous answer, **never from your own clock**. The first call sends no `since`.
        - Some days come back again: **replace what you hold, do not append**.
        - A cleared day comes back empty, a deleted label is absent from `descriptions`, and a change of cycle start brings
          back the days that follow it.

        `days` is a flat array in date order, each day as `GET /day/{date}` shows it (`cycleStartDate` and `cycleDay`
        included). `descriptions` is what `GET /description` returns. `allCyclesFirstDay` and `allObservationPausedDates` are whole
        every time, which is how a deletion reaches you.
      parameters:
        - name: since
          in: query
          required: false
          description: |-
            An RFC 3339 timestamp with a zone, normally the `syncTimestamp` of the previous call. **Leave it out
            (or empty) the first time**: the sync then starts at `1970-01-01T00:00:00Z` and returns the whole timeline.
            A zone is required (`Z` or `+02:00`, which is converted to UTC); a bare `2026-03-10 15:30:45` is refused.
            In a URL, write the `+` of an offset as `%2B`.
          schema:
            type: string
            format: date-time
          example: "2026-03-10T15:30:45Z"
      responses:
        "200":
          description: OK. `days` can be empty, which simply means "no day changed".
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TimelineSync'
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /day:
    get:
      tags: [timeline]
      operationId: listDays
      summary: Read several days
      description: |-
        Reads days, **at most 100 per call**. For one day use `GET /day/{date}`; for everything use `GET /timeline_sync`.

        | Parameters | What you get |
        |---|---|
        | `dates=2026-03-10,2026-03-11` | exactly those dates, **one entry each, empty days included** (1 to 100) |
        | `from=2026-03-01&to=2026-03-31` | the stored days of that range, both ends included (100 days at most) |

        Use one form or the other: both together, or neither, is refused. The answer is a flat array sorted by date,
        oldest first, whatever `timelineAscending` says. A range does not pad gaps; `dates` gives an entry per date.
      parameters:
        - name: dates
          in: query
          required: false
          description: |-
            One to 100 dates `YYYY-MM-DD`, separated by commas. Spaces around them are allowed.
          schema:
            type: string
          example: "2026-03-10,2026-03-11"
        - name: from
          in: query
          required: false
          description: First date of the range, included. **Goes with `to`.**
          schema:
            type: string
            format: date
          example: "2026-03-01"
        - name: to
          in: query
          required: false
          description: Last date of the range, included. **Goes with `from`**, not before it, at most 100 days after it (both ends counted).
          schema:
            type: string
            format: date
          example: "2026-03-31"
      responses:
        "200":
          description: The days, oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Day'
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /day/{date}:
    get:
      tags: [timeline]
      operationId: getDay
      summary: Read one day
      description: |-
        Reads one day. **It never answers `404`**: a date with nothing stored is a full day with empty values.

        ```json
        { "data": { "date": "2026-03-15", "stampColor": null, "isPeak": false, "comment": "", "...": null } }
        ```

        The day includes the computed `cycleStartDate` and `cycleDay`.
      parameters:
        - $ref: '#/components/parameters/DatePath'
      responses:
        "200":
          description: The day, empty when nothing is stored for the date.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Day'
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

    post:
      tags: [timeline]
      operationId: writeDay
      summary: Write one day (replaces the whole day)
      description: |-
        Creates or replaces one day. The date is in the address: no id, no separate create and update. Sending the same
        write twice is harmless. `201` (with a `Location`) when the day was new, `200` when it replaced one. The answer is
        the day as stored.

        ### The body is the complete day

        **This is not a partial update.** A field you leave out is cleared (empty or `false`).

        ```
        correct:   GET the day -> change one field -> POST the whole object back
        wrong:     POST {"comment": "new"}     <- clears everything else
        ```

        A day you read can be sent back as it is: `cycleStartDate`, `cycleDay` and `lastWriteDb` are accepted and dropped.
        A `date` in the body must be the date of the address (else `date_mismatch`). A field the day does not have is
        refused (`unknown_field`).

        ### Starting a cycle

        Send `cycleFirstDay: true`. The server recomputes `cycleStartDate` and `cycleDay` for that day and the following ones.

        ### Free-text labels

        Names in `freeMucusSensation`, `freeMucusObservation` and `freeOther` are trimmed and lower-cased. An existing name is
        reused (and keeps its original type), a new one is created: no need to call `POST /description` first.

        A label you do not send back is unlinked, `freeOther` included. A client that does not know `freeOther` and omits it
        unlinks the day's untyped labels.

        ### Values are checked

        A value the day cannot hold is refused with `400 validation_failed` (every problem in `details.issues`), and nothing
        is stored: a `stampColor` outside Red / Green / Yellow / White, a `codifiedArrow` outside Up / Down / Right, a code
        outside the FertilityCare notation, a `temperature` outside 0 to 99.99 (`0` means none), a `counterStart` outside 0
        to 255, a flag that is not a boolean, a text over its limit.

        ### A write that arrives late

        Two devices can write the same day, one of them offline. The write that was **made** last wins, and *made* is told by
        `lastWriteClientUtc` (RFC 3339 with a zone). A write older than the stored day is refused with `409 stale_write` and
        nothing is stored. The same moment is accepted. On this answer, drop your change, `GET` the day again and show it to
        the user. Without `lastWriteClientUtc` the server's clock is used, so the write is never late. A client clock set in
        the future cannot lock other writers out.

        Writing a day marks the account as active (accounts inactive for 4 years are deleted).

        ### Body fields

        No key is mandatory, but **a key left out is cleared**: send the complete day.

        | Key | Type | Usage |
        |---|---|---|
        | `date` | string (`YYYY-MM-DD`) | Leave out, or the date of the address. |
        | `cycleFirstDay` | boolean | `true` makes this date day 1 of a new cycle. |
        | `dayNotObserved` | boolean | No observation was recorded on this date. |
        | `stampColor` | `Red`, `Green`, `Yellow`, `White` or null | Colour of the stamp. |
        | `stampBaby` | boolean | Baby picture on the stamp (potentially fertile day). |
        | `isPeak` | boolean | Peak day. |
        | `counterStart` | integer or null (0 to 255) | Start a counter shown for this many days. `0` is stored as null. |
        | `sexUnion` | boolean | Sexual intercourse on this date. |
        | `observationPaused` | boolean | The observations are paused from this date: it ends the cycle, and a new cycle resumes them. |
        | `freeMucusSensation` | array of string (max 256 each) | Cervical mucus: what the user feels. |
        | `freeMucusObservation` | array of string (max 256 each) | Cervical mucus: what the user sees. |
        | `freeOther` | array of string (max 256 each) | Cervical mucus: labels with no type yet. |
        | `temperature` | number or null (0 to 99.99) | Basal body temperature. `0` means none. |
        | `temperatureTime` | string or null (`hh:mm:ss`) | When it was taken. Ignored without a `temperature`. |
        | `codifiedBleedingObservation` | string or null | FertilityCare: `VH`, `H`, `M`, `VL`, `B`, optional `L` suffix, or `L` alone. |
        | `codifiedMucusSensation` | string or null | FertilityCare: `0`, `2`, `2W`, `4`, `6`, `8`, `10`, `10DL`, `10SL`, `10WL`. |
        | `codifiedMucusObservation` | string or null | FertilityCare: any combination of `C`, `G`, `K`, `P`, `Y`, `L`. |
        | `codifiedNumberObservations` | string or null | FertilityCare: `X1`, `X2`, `X3`, `AD`. |
        | `codifiedPainObservations` | string or null | FertilityCare: `AP`, `RAP`, `LAP`. |
        | `codifiedArrow` | `Up`, `Down`, `Right` or null | FertilityCare: the arrow drawn on the chart. |
        | `comment` | string (max 256) | Free note. |
        | `lastWriteClientUtc` | string or null (RFC 3339) | Your clock; decides which of two writes is the latest. |
        | `cycleStartDate`, `cycleDay`, `lastWriteDb` | | Computed by the server: accepted so a day read can be sent back, then ignored. |
      parameters:
        - $ref: '#/components/parameters/DatePath'
      requestBody:
        required: true
        description: The **complete** day, without its `date` (or with the date of the address). Everything is optional but omitting it clears it.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Day'
            examples:
              cervicalMucus:
                summary: Cervical mucus — first day of a cycle (POST /day/2026-03-10)
                value:
                  cycleFirstDay: true
                  stampColor: Red
                  freeMucusSensation: [dry]
                  comment: cramps in the morning
                  lastWriteClientUtc: "2026-03-10T07:12:00Z"
              cervicalMucusPeak:
                summary: Cervical mucus — peak day, with temperature (POST /day/2026-03-22)
                value:
                  stampColor: White
                  isPeak: true
                  freeMucusObservation: [stretchy]
                  temperature: 36.8
                  temperatureTime: "06:45:00"
              fertilityCare:
                summary: FertilityCare — codes (POST /day/2026-03-12)
                value:
                  stampColor: Green
                  codifiedMucusSensation: "10WL"
                  codifiedMucusObservation: CK
                  codifiedArrow: Up
      responses:
        "201":
          description: The day was new. `Location` is its address.
          headers:
            Location:
              description: "`/api/v2/day/{date}`."
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Day'
        "200":
          description: The day replaced the one stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Day'
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: "`read_only_token` — the token is read-only. `cross_origin_refused` — see section 3 of the introduction."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "409":
          description: "`stale_write` — this day was written more recently than this change (see \"A write that arrives late\"). Nothing was stored."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

    delete:
      tags: [timeline]
      operationId: deleteDay
      summary: Clear one day
      description: |-
        Clears a day: every field goes back to empty and its labels are unlinked. The row stays, empty, so that
        `GET /timeline_sync` tells the other clients the day is gone. Clearing a date never written is a success (`204`).

        `lastWriteClientUtc` works as on `POST /day/{date}`: a clear made before the last write of the day is refused with
        `409 stale_write`. A `DELETE` takes no body, so it is a query parameter.
      parameters:
        - $ref: '#/components/parameters/DatePath'
        - name: lastWriteClientUtc
          in: query
          required: false
          description: When the clear was made, on your clock. RFC 3339 with a zone. The server's clock when absent.
          schema:
            type: string
            format: date-time
          example: "2026-03-10T15:30:45Z"
      responses:
        "204":
          description: The day is clear.
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: "`read_only_token` — the token is read-only. `cross_origin_refused` — see section 3 of the introduction."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "409":
          description: "`stale_write` — the day was written more recently than this clear. Nothing was cleared."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /description:
    get:
      tags: [timeline]
      operationId: listDescriptions
      summary: List the free-text labels
      description: |-
        Every label of the account, most used first (`useCount` = the number of days that carry it). A bare array.
      responses:
        "200":
          description: The labels.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Description'
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

    post:
      tags: [timeline]
      operationId: createDescription
      summary: Create a label
      description: |-
        Creates a label. You rarely need to: a name sent in a day is created for you (`POST /day/{date}`). Use it for a
        "most used first" picklist or to prepare labels.

        The name must be **lower case with no leading or trailing space**: what you send is trimmed and lower-cased
        (`"Humide "` is saved as `humide`). It is unique per account: a name that exists is `409 duplicate_name`. The type is
        `sensation` (felt) or `observation` (seen); `undefined` is a label nobody classified yet (classify it later with
        `POST /description/{id}`).

        ### Body fields

        | Key | Type | Required | Usage |
        |---|---|---|---|
        | `name` | string (max 256) | Yes | Name of the label. |
        | `type` | `undefined`, `observation` or `sensation` | Yes | What the label stands for. |
        | `lastWriteClientUtc` | string (RFC 3339) | No | Your own clock. |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name:
                  type: string
                  maxLength: 256
                  description: Trimmed and lower-cased by the server.
                  example: stretchy
                type:
                  $ref: '#/components/schemas/DescriptionType'
                lastWriteClientUtc:
                  type: string
                  format: date-time
                  description: Your own clock, RFC 3339 with a zone. The server's clock when absent.
      responses:
        "201":
          description: Created. `Location` is its address.
          headers:
            Location:
              description: "`/api/v2/description/{id}`."
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DescriptionWritten'
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: "`read_only_token` — the token is read-only. `cross_origin_refused` — see section 3 of the introduction."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "409":
          description: "`duplicate_name` — a label of this account already has this name."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /description/{id}:
    post:
