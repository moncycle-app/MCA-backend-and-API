info:
  title: moncycle.app API
  version: "2.0"
  termsOfService: https://www.moncycle.app/ToS/term_of_service_fr.html
  license:
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0
  description: |-
    This API stores **daily fertility observations** for one person, or for one couple sharing
    an account. It is the backend of the moncycle.app web app. Other clients (mobile apps,
    scripts, research tools) can use the same API.

    **Using this API means accepting its terms of service** (`termsOfService` above). An operator may publish
    others: the address of the terms of the server you talk to is `termsOfServiceUrl` in `GET /server_info`.
    A client that creates accounts for people must have them accept the terms first: `POST /register` requires
    `termsAccepted: true`.

    Read this page from top to bottom the first time, then use it as a reference. Domain words
    (peak day, stamp, cervical mucus self-observation…) are explained in the **Glossary** at the end.

    ---

    ## 1. The one idea you need

    **One day = one observation.**

    The account owns a **timeline**: a long list of calendar days. Each day holds what the user
    observed on that date. There is no "cycle" resource, no "chart" resource, no "entry id".
    The calendar date *is* the identifier.

    ```
    timeline of one account
    ┌──────────┬──────────┬──────────┬──────────┬──────────┬──────────┐
    │2026-03-08│2026-03-09│2026-03-10│2026-03-11│2026-03-12│2026-03-13│
    ├──────────┼──────────┼──────────┼──────────┼──────────┼──────────┤
    │          │          │ cycle    │          │ isPeak   │          │
    │ stamp    │ stamp    │ FirstDay │ stamp    │ = true   │ stamp    │
    │ = Green  │ = Green  │ = true   │ = Red    │          │ = White  │
    └──────────┴──────────┴──────────┴──────────┴──────────┴──────────┘
                           ^
                           └─ a new cycle starts here
    ```

    A **cycle is not stored**. It is *derived* from the timeline. One day carries the flag
    `cycleFirstDay: true`, and that is all the server needs:

    - the cycle of any date = the closest day at or before it that has `cycleFirstDay: true`;
    - `cycleStartDate` and `cycleDay` are **computed by the server** on every read.

    So, to start a new cycle, you do not create anything. You write one day with
    `cycleFirstDay: true`. To correct a wrong cycle start, you write that same day again with
    `cycleFirstDay: false`. Everything after it moves to the previous cycle automatically.

    That is the whole mindset of the API.

    ## 2. Rules for every response

    **Rule 1 — success is wrapped in `data`.**

    ```json
    { "data": { "status": "oookkk" } }
    ```

    A single thing is an object, a list is a bare array. Nothing else sits next to `data`, except `meta`.

    **Rule 2 — failure is wrapped in `error`.**

    ```json
    { "error": { "code": "invalid_credentials", "message": "Incorrect password or non-existent account." } }
    ```

    Read `code` in your program. It is a stable slug and it will not change.
    Show `message` to a human, or log it. Never parse it. An optional `details` object may
    carry extra context.

    **Rule 3 — the HTTP status code is real.** `200` means it worked, `401` that you are not logged in,
    `409` a conflict, `413` that the request body is over 256 KB (whichever endpoint it was sent to), `415` that
    a write was not sent as JSON, and `403` with the code `cross_origin_refused` that a browser page of another
    origin tried to write (both in section 3). `503` with the code `maintenance` means the operator put the
    server in maintenance: every endpoint answers it before it reads or writes anything, so nothing was done;
    try again later. Only `GET /server_info` stays up, with `maintenanceMode: true`, so that a client can say
    what is going on. `503` with `schema_mismatch` means the database is not at the version this code needs:
    nothing works until the operator runs the migrations. Check the status first, then the body.

    **Rule 4 — `meta` is about the answer, not part of it.** A few answers carry a sibling `meta` next to `data`
    (`POST /account`: what was changed). It is how information can be added to a list later without turning the list
    into an object.

    **Every response carries an `X-Request-Id` header** (but `GET /health_check`): the id the server's log
    uses for that request, to quote when you report a problem. You may send your own in an `X-Request-Id`
    request header (letters, digits and `._:-`, 64 characters at most); anything else is ignored.

    A method an endpoint does not take answers `405 method_not_allowed` with an `Allow` header. A `401` carries
    `WWW-Authenticate: Bearer`. A `201` carries a `Location`.

    ### Exceptions to rule 1 and 2

    Two endpoints answer a **file** when they succeed. Their failures are in the envelope like everything else
    (`GET /export/{format}` included, and English: the web app shows its own French text from the `code`).

    | Endpoint | What it returns when it works |
    |---|---|
    | `GET /export/{format}` | a file (`.nfp` JSON, `.csv` or `.pdf`) |
    | `GET /all_of_my_data_plz` | a CSV file; its `401` has no body |

    ### Errors that tell the whole story

    A request the server cannot accept because of **what it says** — an unknown field, a value of the wrong type,
    a number out of range, a date that is not one — is refused with **HTTP 400** and the code `validation_failed`.
    `details.issues` lists **every** problem found, not only the first:

    ```json
    {
      "error": {
        "code": "validation_failed",
        "message": "The request is not valid: 2 problems (see details.issues). First: Unknown field 'stampColour'. Did you mean 'stampColor'?",
        "details": {
          "issues": [
            { "field": "stampColour", "code": "unknown_field", "message": "Unknown field 'stampColour'. Did you mean 'stampColor'?" },
            { "field": "temperature", "code": "wrong_type", "message": "'temperature' must be a decimal number, got string." }
          ]
        }
      }
    }
    ```

    - `field` says where: the name of a body field (`stampColor`, `freeMucusSensation[2]`), `query.from` for a query
      parameter, `path.date` for a part of the address.
    - `code` is a stable slug you can branch on (`unknown_field`, `wrong_type`, `out_of_range`, `too_long`,
      `invalid_date`…; the full list is the `ValidationIssue` schema).
    - `message` is a sentence for a human that names the field, says what came (a type, never the value of a
      password, a code or a text) and what is expected (the type, the allowed values, the limit).

    **Nothing is silently ignored.** A typo in a field name is an error, not "nothing happened"; a value that cannot
    be stored is an error, not a quiet `null`. The exceptions are written where they apply: the fields of a day that
    the server computes are dropped when you send a day back (`POST /day/{date}`), and a field set to `null` is the same
    as a field that is not sent.

    A request in the wrong **state** is not a validation problem and keeps its own code and status: `unauthorized`,
    `invalid_credentials`, `invalid_password`, `stale_write`, `duplicate_name`, `not_found`, `totp_invalid`...
    `invalid_json` (400) is a body that is not a JSON object.

    ### Compatibility: what can change, and what cannot

    The version of the API is in the address: this page describes **v2**, served under `/api/v2/` (every path below is
    relative to it). `GET /server_info` tells the version of the *server* (`appVersion`, the release of the app), which says
    nothing about the contract.

    - **These are not breaking changes and stay in v2**: a new field in an answer, a new optional field in a
      request, a new endpoint, a new value of an enum, a new `code`. **A client must ignore the fields and the enum values it
      does not know**, and treat a `code` it does not know like any other error of the same status.
    - **A breaking change** (a field renamed or removed, a meaning changed, a required field added) is published under a new
      version in the address (`/api/v3/`). A client written for v2 asks `/api/v2/` and nothing else.

    ## 3. Authentication

    There is one credential: a **token**. You get it from `POST /token`.

    The token is a random 256-character string. Send it back in one of two ways. **Each one works alone, on every
    protected endpoint** — pick the one that fits your client:

    ```
    Authorization: Bearer <token>          <- apps, scripts, mobile clients
    Cookie: MONCYCLEAPP_TOKEN=<token>      <- browsers (the server sets this cookie for you)
    ```

    If both are present, the `Authorization` header wins and is the only credential looked at: an invalid Bearer
    token is a `401` even when a valid cookie comes with it.

    Good to know:

    - A token lives until you destroy it (`DELETE /token`) or the server purges it. Made without
      `expiresInDays`, it is deleted by the daily cron when it has **not been used for 40 days**, or is
      **more than a year old**, whatever its use. Made with `expiresInDays`, it dies on that day whatever
      its use, and opens nothing from then on. The next call with it answers `401`: sign in again. There is
      no refresh step. The cookie is set for 5 years (the same day as the token, with `expiresInDays`), so it
      can outlive its token.
    - `DELETE /token` destroys **one** token (the one you used); `DELETE /token/{prefix}` destroys the token that starts
      with these 5 characters, `DELETE /token?others=true` every other one, and `GET /token` lists them
      (prefix, name, scope, dates, user agent, network). One account can hold many tokens (one per device), with no limit.
    - A token has a **scope**: `readWrite`, or `readOnly` (it reads, and can end its own session).
      There are no roles: a read-write token can do everything its account can.
    - Missing or wrong token on a protected endpoint → `401` with code `unauthorized`.
    - **Every body is JSON.** Send `Content-Type: application/json` (a parameter such as
      `; charset=utf-8` is fine) with every `POST` (`POST /import` too, whose body is the NFP file). Any other
      type, a form or `text/plain`, is
      answered `415` `unsupported_media_type`. A `GET` and a `DELETE` take **no body**: one is refused.
    - **A write from a browser page that is not ours is refused**, with `403`
      `cross_origin_refused`, whoever is logged in. The server reads the `Origin` header of a
      `POST` or `DELETE` (and `Sec-Fetch-Site` when there is no `Origin`): the allowed origins
      are the server's own, the web app's (`APP_URL`) and the ones the operator lists
      (`WEB_APP_ORIGINS`). A request with neither header, which is what curl, a script or a
      mobile app sends, is not a browser's and is never refused for this.
    - The session cookie is `HttpOnly` and `SameSite=Strict`, unless the operator set
      `COOKIE_SAMESITE` to `lax` or `none`.

    ## 4. First run, step by step

    **Start with `GET /server_info`**, a public call: it tells you the `appVersion` of the server, whether it is in
    maintenance (`maintenanceMode`), whether `registrationEnabled`, and the `limits` to check forms with.

    ```bash
    curl -s http://localhost:8003/api/v2/server_info
    # -> 200 {"data":{"app":"moncycle.app","appVersion":15,"maintenanceMode":false,"registrationEnabled":true,"limits":{...},...}}
    ```

    Creating an account needs a captcha, which the server keeps nowhere: `POST /captcha` gives a picture
    and a signed **token**, and you send the token back with what the human read (no cookie).

    ```bash
    # 1. Ask for a challenge for this address: a picture (a data URI) and a token.
    curl -s -X POST http://localhost:8003/api/v2/captcha \
      -H 'Content-Type: application/json' \
      -d '{"purpose":"register","email":"marie@example.org"}'
    # -> 200 {"data":{"image":"data:image/jpeg;base64,...","token":"1790000000.9f2c...","expiresAt":1790000000}}
    # ... a human reads the picture, for example "a7k2fm"

    # 2. Create the account, with the password the user chose, the answer and the token.
    curl -s -X POST http://localhost:8003/api/v2/register \
      -H 'Content-Type: application/json' \
      -d '{"nickname":"MB","email":"marie@example.org","password":"a long passphrase","birthYear":1994,
           "method":"cervicalMucus","temperatureTracking":false,"captcha":"a7k2fm","captchaToken":"1790000000.9f2c..."}'
    # -> 202 {"data":{"sent":true}}
    ```

    The user chooses the password here (10 to 72 bytes). The account cannot be signed in to until its
    address is proved: the mail holds a link (a page of the app, with a token in its fragment) that the page
    posts to `POST /verify_email` with `purpose: "accountCreation"`. Until then `POST /token` answers
    `403 email_not_verified`.

    Then log in and keep the token:

    ```bash
    curl -s -X POST http://localhost:8003/api/v2/token \
      -H 'Content-Type: application/json' \
      -d '{"email":"marie@example.org","password":"a long passphrase","name":"my script"}'
    # -> 201 {"data":{"prefix":"abcde","token":"abc...256 chars...","userId":42,"totpUsed":false,"name":"my script","scope":"readWrite",...}}
    ```

    ## 5. Daily use, step by step

    ```bash
    TOKEN=abc...   # from POST /token
    AUTH="Authorization: Bearer $TOKEN"

    # Who am I, and what are my settings? Call this at startup, and when the app comes back to the foreground.
    curl -s -H "$AUTH" http://localhost:8003/api/v2/account

    # The whole timeline the first time (the days, the labels, the cycles); then only what changed (section 8).
    curl -s -H "$AUTH" http://localhost:8003/api/v2/timeline_sync

    # Write today. Day 1 of a new cycle, red stamp, one free-text sensation. The date is in the address.
    curl -s -H "$AUTH" -H 'Content-Type: application/json' \
      -X POST http://localhost:8003/api/v2/day/2026-03-10 \
      -d '{"cycleFirstDay":true,"stampColor":"Red",
           "freeMucusSensation":["dry"],"comment":"cramps in the morning"}'
    # -> 201 (day created) with the full day as the server now stores it

    # Read one week back (at most 100 days per call)
    curl -s -H "$AUTH" \
      'http://localhost:8003/api/v2/day?from=2026-03-04&to=2026-03-10'
    ```

    ### The most important write rule: POST /day/{date} replaces the whole day

    `POST /day/{date}` is an **upsert of the complete day**, not a partial update. Any field you leave
    out is written as empty or `false`. There is no partial update of a day.

    ```
    stored:  { date: 2026-03-10, stampColor: "Red", isPeak: true, comment: "cramps" }
    you send:{ stampColor: "Green" }       (POST /day/2026-03-10)
    result:  { date: 2026-03-10, stampColor: "Green", isPeak: false, comment: "" }
                                                      ^^^^^^^^^^^^^  ^^^^^^^^^^^^
                                                      both were silently cleared
    ```

    **Always read the day, change the fields you want, then send the whole object back.**
    The day you read can be sent as it is. The response body is the day as the server stored it, so you
    can use it to refresh your local copy without a second `GET`.
    (`POST /account` is the opposite: a partial update, only the fields sent are touched.)

    ## 6. Dates, times and null

    | Thing | Format | Example |
    |---|---|---|
    | A calendar date | `YYYY-MM-DD` | `2026-03-10` |
    | A time of day | `hh:mm:ss` | `06:45:00` |
    | A timestamp | RFC 3339, **with a zone**; the server always answers in UTC with `Z` | `2026-03-10T05:32:48Z` |

    A timestamp you send (`lastWriteClientUtc`, `since`) is RFC 3339 **with a zone**: `Z`, or an offset such as
    `+02:00`, which the server **converts to UTC** (`2026-03-10T07:32:48+02:00` is `05:32:48Z`). Fractional seconds
    are accepted (what a browser's `toISOString()` writes); a time with no zone, or the bare `2026-03-10 05:32:48`,
    is refused (`invalid_timestamp`). In a URL, write the `+` of an offset as `%2B`. Convert to local time in your
    client.

    Two timestamps appear on days, descriptions and the account:

    - **`lastWriteClientUtc`** — *your* clock, which you send. Omitted, or outside what the server can store (a
      clock far in the past or the future), it is replaced by the server's clock; a value that is not a timestamp
      is an error. It is stored and returned in UTC. On a day, it also decides which write is the latest: see
      "A write that arrives late" on `POST /day/{date}`.
    - **`lastWriteDb`** — the server clock. Read-only. The server always sets it. This is the
      field `GET /timeline_sync` is based on, so a wrong clock on your side cannot make you miss anything.

    A field that is `null` means "no value recorded". An empty array (`[]`) means "no labels".
    An empty string (`""`) is used for `comment` when there is no comment. Booleans are real
    JSON booleans (`true` / `false`), never the strings `"true"` / `"false"`. On a request, a field set to `null`
    is the same as a field that is not sent.

    ## 7. Two tracking methods

    Each account uses one method, chosen at registration and changeable later on
    `POST /account`. The method decides **which fields of a day make sense**. The server does
    not block the other fields, but the app will not display them.

    | Method | How a day is recorded | Fields used |
    |---|---|---|
    | `cervicalMucus` | free text, chosen by the user | `freeMucusSensation`, `freeMucusObservation` (and `freeOther`, see below) |
    | `fertilityCare` | short standard codes | the six `codified*` fields |

    Common to both: `stampColor`, `stampBaby`, `isPeak`, `cycleFirstDay`, `sexUnion`,
    `temperature`, `comment`, and the rest.

    `temperatureTracking` is a separate boolean. It says whether the user also records basal
    body temperature. So there are four real combinations, for example
    `cervicalMucus` + temperature, or `fertilityCare` without temperature.

    ### Free-text labels are shared objects (cervical mucus)

    With the `cervicalMucus` method, a user writes labels like "dry", "sticky", "clear and stretchy". These
    are **not** free strings stored on the day. Each label is a reusable object called a
    **description**, with its own `id` and a `useCount`.

    You never have to create them by hand. When you send a new name inside
    `freeMucusSensation` or `freeMucusObservation`, `POST /day/{date}` creates the description for you
    and links it to the day. The `/description` endpoints exist so the app can show a
    "most used first" picklist, and rename or delete a label everywhere at once.

    Two things to know:

    - Names are **unique per account** and **case-sensitive**. `"Dry"` and `"dry"` are two
      different labels.
    - A name keeps the type it was first created with. If "dry" already exists as an
      `observation`, sending it inside `freeMucusSensation` links the existing `observation`
      label. It does not create a second one.
    - A label can have no type yet (`type: "undefined"`): nobody said whether it is a sensation or an
      observation. A day shows such labels in `freeOther`, and keeps them only if you send them
      back there. To classify one, `POST /description/{id}` with the new `type`: every
      day that carries it then shows it in `freeMucusSensation` or `freeMucusObservation`.

    ## 8. Keeping a local copy in sync

    `GET /timeline_sync?since=...` is made for a client that keeps its own copy of the timeline:
    a phone, a browser, a script. It answers with everything that copy may lack. (The account's settings are not
    in it: read `GET /account` at start-up and when the app comes back to the foreground.)

    | Key | What it holds |
    |---|---|
    | `syncTimestamp` | The server clock when it started to answer. **Keep it**: it is the `since` of your next call. |
    | `days` | The days written since `since`, and the days that follow them in their cycle. A cleared day is among them, empty. |
    | `descriptions` | **Every** label of the account, with its `useCount`. |
    | `allCyclesFirstDay` | **Every** day flagged `cycleFirstDay`, newest first. |
    | `allPregnancyDates` | **Every** day flagged `booleanPregnancyDetected`, newest first. |

    The loop:

    ```
    1. POST/DELETE your own unsent days, POST/DELETE your labels   (your changes first)
         - a day answered 409 stale_write was written after you made your change: drop yours
    2. GET /account                           (the settings; send its ETag back to get a 304)
    3. GET /timeline_sync?since=<lastSync>    (the first time: GET /timeline_sync, with no parameter)
    4. merge into your copy:
         - each returned day replaces yours; an empty day means "forget this day";
         - the returned labels replace yours; the returned lists of cycles and pregnancies replace yours;
         - except a day you changed after step 1: keep yours, you are about to send it
    5. save syncTimestamp as lastSync, once step 4 is done
    ```

    What the server does for you, so that this loop is enough:

    - **The server clock decides, not yours.** Days are selected on `lastWriteDb`, and
      `syncTimestamp` comes from the same clock, so a client with a wrong clock misses nothing. **Take the cursor from
      `syncTimestamp` only**, and hand it back as it is.
    - **A safety margin is taken for you.** The server reads from 120 seconds *before*
      `since` (a write is stamped when it starts but seen when it is committed), so the last days of a sync
      come back in the next one. **Your merge must tolerate a day received twice** — replacing it is enough.
    - **Deletions are reported.** `DELETE /day/{date}` does not remove the row: the day stays, empty,
      with the time it was cleared, and comes back in `days` with every field empty. A deleted
      label is absent from `descriptions`, which always lists all of them: forget the ones that
      are not in the list. Renaming, retyping or deleting a label also reports the days
      that carry it, with their new `freeMucus*` and `freeOther` lists.
    - **A change of cycle reports the cycle.** Setting or clearing `cycleFirstDay` changes the
      `cycleStartDate` and `cycleDay` of every following day up to the next first day. Those days
      come back too, so you never have to compute a cycle yourself.
    - **The answer is not paged.** It comes in one piece, as big as the changed days (about 500 bytes a day): the
      first call, with no `since`, is the whole timeline.

    ## 9. Login protection

    Failed logins are counted per account, and they decay after **60 minutes** of no failure.

    | Recent failures on the account | What happens |
    |---|---|
    | 0 – 2 | normal login |
    | 3 or more | a captcha is required: `403` `captcha_required` |
    | 15 or more | account temporarily locked: `403` `account_locked` |

    There is also a limit of **30 attempts per IP address**, which answers `429` `rate_limited`.

    Every `POST /token` response — success or failure — may contain `captchaRequired: true`. It is a
    hint about your **next** attempt, not about this one. When you see it, call
    `POST /captcha` with `{"purpose":"login","email":...}` and include the answer and the token
    in the next sign-in. The token is tied to the account's failure counters, so **ask for a new
    one after every refused attempt** (a wrong password moves the counters and ends the token).

    The lock only applies to a **wrong** password. The real owner can still log in with the
    correct password, so a third party cannot lock someone out.

    One exception: an account with **two-factor authentication on**. Once the password is known,
    only the one-time code is left to guess, so a wrong code counts like a wrong password and,
    from the lockout threshold on, even the right code is refused with `403` `account_locked`.
    Someone who knows the password can therefore keep such an account locked while they keep trying.

    The same counters guard the password and the code that **a session** asks for again: `POST /account` (`newPassword`,
    `notificationEmails`, `loginEmail`), `POST /account/deletion`, `POST /totp/confirm` and `POST /totp/disable`. A wrong
    one counts like a wrong sign-in, and from the lockout threshold on these checks answer `403` `account_locked`, even for
    the right secret, until the failures age out (the session stays valid). A correct one clears the count, as a sign-in does.

    ## 10. Privacy by design

    This is personal data, so the API is deliberately narrow:

    - An account can only ever read and write **its own** data. There is no admin endpoint, no
      user list, and no way to address another account.
    - `GET /pub_stat` is public but rounded (to the nearest 10, or 100 for observations), so no
      individual can be recognised.
    - `POST /recover_password` always answers `200`, even when the email is unknown, and waits
      a random 1–5 seconds. This hides whether an account exists.
    - `GET /all_of_my_data_plz` gives the user a full CSV dump of their own data (GDPR right of
      access). Passwords, TOTP secrets and tokens are masked in it.
    - `POST /account/deletion` deletes the account for real. Rows in every other table are removed by
      database cascade. It needs the password as confirmation.
    - An account with no activity for 4 years is deleted automatically.
    - The server's log says what happened, to which account and to which row, never the content:
      no password, token, e-mail address, query string, observation or description text.

    ## 11. Glossary

    | Term | Meaning |
    |---|---|
    | **NFP** | Natural Family Planning. A family of methods based on daily body observations. |
    | **Cervical mucus self-observation** | The method value `cervicalMucus`. The user describes cervical mucus in their own words. |
    | **FertilityCare** | The Creighton Model FertilityCare System. The user records short standard codes such as `10KL` or `6C`. |
    | **Cycle** | The period from one first day of menstruation to the day before the next one. |
    | **Day 1** | The first day of a cycle. In this API, the day flagged `cycleFirstDay: true`. |
    | **Stamp** | The coloured square drawn on the paper chart for one day. Red, green, yellow or white. |
    | **Baby stamp** | A small baby picture added on top of a stamp, to mark a potentially fertile day. |
    | **Peak day** | The last day with the most fertile type of mucus. A cycle can hold more than one `isPeak` day. |
    | **Sensation** | What the user *feels* (for example "dry"). |
    | **Observation** | What the user *sees* (for example "stretchy"). |
    | **Description** | A reusable free-text label in this API, either a sensation or an observation. |
    | **Basal temperature** | Body temperature taken at rest, right after waking up. |
    | **TOTP** | Time-based One-Time Password. The 6-digit code from an app such as Aegis or Google Authenticator. Used for two-factor authentication. |
    | **NFP file** | The portable JSON file format used by `/export` and `/import`, so a user can move data between apps. |
    | **Upsert** | A write that creates the record if it does not exist, and replaces it if it does. |

