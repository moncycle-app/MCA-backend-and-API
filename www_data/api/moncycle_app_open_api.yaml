  /export/{format}:
    get:
      tags: [files]
      operationId: exportFile
      summary: Export a period as NFP, CSV or PDF
      description: |-
        Downloads a period of the timeline as a file.

        | `format` | Content type | Purpose |
        |---|---|---|
        | `nfp` | `application/json` | **Portable data**: the NFP format, to move data to another app. `POST /import` reads it. See the `NfpFile` schema. |
        | `csv` | `text/csv; charset=utf-8` | A spreadsheet, one row per day. |
        | `pdf` | `application/pdf` | A printable chart, laid out for the account's method. |

        Only a `200` is a file. A failure is the usual `error` envelope: `validation_failed` (missing or malformed date,
        `from` after `to`, unknown format or parameter), `no_data_in_period` (`404`: nothing is recorded in the period) or
        `unauthorized`.

        ### Parameters

        - `from` and `to` are both **included**; `from` may equal `to`. The period must contain at least one recorded day.
        - `nfp` starts at the **first day of the cycle** containing `from`, so a cycle is never cut in half. `csv` and `pdf`
          use exactly the dates you ask for.
        - `anonymous=true` (`pdf`, `nfp`) leaves the user's name off the chart and omits `userInformation` from the NFP file.
          Observations are unchanged. Use it before sharing the file. It does nothing for `csv`.
        - `inline=true` (`nfp` only) returns indented JSON in the response instead of a download.

        The response is an attachment named `moncycle_app_<date>.<ext>` (except `nfp` with `inline=true`).

        ### CSV

        UTF-8 with a BOM, fields separated by `;`, RFC 4180 quoting, CRLF line ends: Excel, LibreOffice and Google Sheets read
        it. One header row, then **one row per calendar day**, oldest first. Columns depend on the method:

        | Method | Columns |
        |---|---|
        | `cervicalMucus` | `date` `cycleDay` `cycleFirstDay` `mucusNotObserved` `stampColor` `stampBaby` `freeMucusSensation` `freeMucusObservation` [`temperature` `temperatureTime`] `isPeak` `counterStart` `sexUnion` `observationPaused` `comments` |
        | `fertilityCare` | `date` `cycleDay` `cycleFirstDay` `mucusNotObserved` `stampColor` `stampBaby` `codifiedBleedingObservation` `codifiedMucusSensation` `codifiedMucusObservation` `codifiedNumberObservations` `codifiedPainObservations` `codifiedArrow` [`temperature` `temperatureTime`] `isPeak` `sexUnion` `observationPaused` `comments` |

        The temperature columns exist only for accounts that record temperature.

        - Booleans are `1`, or empty for false. Lists are joined with ` | `. Dates are `YYYY-MM-DD`, `temperatureTime` is `HH:MM`.
          `temperature` uses a decimal comma (`36,45`).
        - `cycleDay` counts from the latest `cycleFirstDay` inside the period, and is empty before the first one.
        - `comments` holds the day's comment, then the labels with no type yet (`freeOther`), after ` | `.
        - A text cell starting with `=`, `+`, `-`, `@`, a tab or a carriage return gets a leading `'`, so a spreadsheet does not run it as a formula.
        - A date with no recorded day between the first and last recorded day is a row with only `date` and `cycleDay`.
        - A day flagged `mucusNotObserved` has empty mucus columns (sensation, observation, stamp, baby stamp and the
          FertilityCare bleeding, mucus and number codes); the other columns are filled as usual. The PDF follows the same rule.
          The NFP file keeps everything.

        ### PDF

        For cervical mucus: one line per day (date, cycle day, stamp, peak, counter, union, sensations, observations, comment,
        and the temperature with its curve when there is one), a new page for each cycle. For FertilityCare: a grid of 35 days
        per row, one row per cycle. Always an attachment.

        ### NFP

        `fileInformation`, `userMethodPreferences.preferredMethod`, `userInformation` (unless `anonymous=true`) and the cycles
        of the period. Re-importing an exported file reproduces the account, with these normalisations of the FertilityCare
        notation: `Br` becomes `B`, `x1`/`x2`/`x3` become uppercase, `C/K` becomes `CK`. The labels with no type yet
        (`freeOther`) have no field in the file: they are written in the day's `comments` and come back as part of the comment.
      parameters:
        - name: format
          in: path
          required: true
          description: The file format.
          schema:
            type: string
            enum: [nfp, csv, pdf]
        - name: from
          in: query
          required: true
          description: First date, `YYYY-MM-DD`, included.
          schema:
            type: string
            format: date
          example: "2026-03-01"
        - name: to
          in: query
          required: true
          description: Last date, `YYYY-MM-DD`, included. Not before `from`.
          schema:
            type: string
            format: date
          example: "2026-03-31"
        - name: anonymous
          in: query
          required: false
          description: |-
            `pdf` and `nfp`. `true` = leave the user's name off the chart, and omit
            `userInformation` from the NFP file. `false`, `1` and `0` are read too.
          schema:
            type: boolean
            default: false
        - name: inline
          in: query
          required: false
          description: "`nfp` only. `true` = return indented JSON inline. `false` = download a `.nfp` file."
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The file.
          headers:
            Content-Disposition:
              description: "`attachment; filename=\"moncycle_app_<date>.<ext>\"`. Absent when `inline=true`."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NfpFile'
            text/csv:
              schema:
                type: string
                description: |-
                  UTF-8 with a BOM, `;`-separated, RFC 4180 quoting, CRLF line ends. One header
                  row of NFP field names, then one row per calendar day. See "What a CSV export
                  contains" above.
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: "`no_data_in_period` — there is no recorded day between `from` and `to`. `not_found` — no format in the address."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /import:
    post:
      tags: [files]
      operationId: importNfp
      summary: Import an NFP file into the account
      description: |-
        Reads an NFP file (the body, `Content-Type: application/json`) and writes its cycles into the account. The answer is
        an `ImportReport` in `data`. `dryRun=true` previews exactly what the write would do.

        ### All or nothing

        Nothing is written until every check has passed, and a rejected file leaves the account as it was.

        | Stage | What it checks | Failure |
        |---|---|---|
        | 1 | size, UTF-8, JSON, `schemaVersion` | `413` or `400` |
        | 2 | structure and types, against `NfpFile` | `400 invalid_nfp_structure` |
        | 3 | real dates, ranges, text lengths, overlapping cycles | `400 inconsistent_nfp_data` |
        | 4 | the write, in one transaction | `500`, nothing committed |

        ### Days that already have data

        - `override=false` (default): they are left alone and listed in `daysSkipped`.
        - `override=true`: they are replaced whole, labels included, like `POST /day/{date}`.

        Either way they are counted in `daysAlreadyInAccount`. A day the file leaves empty (`{}`) is a gap: not written,
        never a conflict. The first day of each cycle is always written.

        ### Nothing is dropped silently

        This app stores less than the format can describe, so every answer reports what became of the rest (`ImportReport`):

        - `ignoredFields`: in the file, nowhere to put it here (cervix observations, `babyFeedCount`, an event other than `ObservationPaused`...).
        - `mappedFields`: stored less precisely (a `symptothermic_fr` bleeding value becomes a Red stamp).
        - `warnings`: imported, but worth showing: a cycle whose `method` differs from the account's, `null` values, and the
          shapes listed below.

        A cycle of any `method` imports; the fields every method shares are kept.

        ### What is read kindly

        - A `null` is a field not set (one warning per field). A `null` in `days` is an empty day that keeps its place.
        - A wrong value in a field this app never stores (`userInformation`, `userMethodPreferences`, the fields of
          `ignoredFields`) is a warning, and the field is ignored.
        - FertilityCare notes written as numbers are read as codes: `codifiedNumberObservations` `1`, `2`, `3` as `x1`, `x2`,
          `x3`; `codifiedMucusSensation` `0`, `2`, `4` ... `10` as the same number. An unknown number goes to `ignoredFields`.

        Still refused: a wrong value in a field this app stores (`temperature` as text, a `stampColor` outside the
        enumeration), and a missing `schemaVersion`, `fileInformation`, `cycles`, or a cycle's `method`, `cycleStartDate`
        or `days`.

        `userInformation` and `userMethodPreferences` are **never applied**: a file cannot rename the account, change its
        address or its method (that is `POST /account`).

        ### A file from `GET /export/nfp` always imports

        What this app exports, it reads back. These shapes are only warned about:

        - `mucusNotObserved` together with an observation, a stamp or a label.
        - More than 20 labels on a day.
        - A temperature under 30 °C or over 45 °C (kept), or an unreadable `temperatureTime` (dropped).

        ### Hard limits

        These refuse the file (`400`, or `413` for the first):

        - **`requestBodyMaxBytes`** per request (`GET /server_info`; 10 MB by default, the operator's `REQUEST_BODY_MAX_BYTES`): `413 file_too_large`. This holds for every endpoint, and the number of days or cycles in a file is not limited otherwise: 15 years of full days are about 7.7 MB. Split a bigger file into fewer cycles.
        - 256 characters per label and per joined comment.
        - 32 characters for the packed FertilityCare notes of a day.
        - A temperature outside `0.00`–`99.99`.
        - Dates must be real, from `1900-01-01`, and not in the future (one day of slack). Two cycles covering the same date
          reject the file.
      parameters:
        - name: override
          in: query
          required: false
          description: '`false` (`0`) leaves dates that already have data alone (`daysSkipped`); `true` (`1`) replaces them. A dry run honours it too.'
          schema:
            type: boolean
            default: false
        - name: dryRun
          in: query
          required: false
          description: |-
            `true` (`1`) answers what a real import would do, **without writing anything**: same report, without
            `daysWritten`. Send it first to show the user what is at stake and let them choose `override`, then send
            the same file again without it.

            A refused dry run also answers everything the checks found, not only the first problem: see the `400`
            response.
          schema:
            type: integer
            enum: [0, 1]
            default: 0
        - name: lastWriteClientUtc
          in: query
          required: false
          description: Your own clock (RFC 3339 with a zone), recorded on every day the import writes. Default the server's time.
          schema:
            type: string
            format: date-time
          example: "2026-03-31T18:04:22Z"
      requestBody:
        required: true
        description: The content of an `.nfp` file, as a JSON body.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NfpFile'
      responses:
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "403":
          $ref: '#/components/responses/CrossOriginRefused'
        "200":
          description: |-
            The file was accepted. On a dry run nothing was written; otherwise the days in
            `daysCreated` and `daysOverwritten` are now in the account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ImportReport'
        "400":
          description: |-
            The file was rejected and **nothing was written**. `error.code` says which stage
            refused it:

            | `code` | Meaning |
            |---|---|
            | `validation_failed` | a query parameter is wrong: unknown, `override` or `dryRun` not `true`/`false`/`1`/`0`, a `lastWriteClientUtc` that is no timestamp (see `error.details.issues`) |
            | `empty_body` | no request body |
            | `invalid_encoding` | the body is not valid UTF-8 |
            | `invalid_json` | not JSON, too deeply nested, or the top level is not an object |
            | `missing_schema_version` | `schemaVersion` absent or empty |
            | `invalid_schema_version` | `schemaVersion` is not a number like `1.0` |
            | `unsupported_schema_version` | a version this build does not implement |
            | `invalid_nfp_structure` | fails the `NfpFile` schema |
            | `inconsistent_nfp_data` | valid JSON, impossible contents |

            `invalid_nfp_structure` and `inconsistent_nfp_data` carry `error.details.issues`: one line per problem,
            `[where] what is wrong`, with `where` a path in the file (`cycles[0].days[7].temperature`) or a date. At most
            50 lines; `error.details.issueCount` is the true total. Ready to show as is.

            On a **dry run**, `inconsistent_nfp_data` also carries `duplicatedDaysInFile` (the dates two cycles share, the
            commonest cause), `warnings`, `mappedFields`, `ignoredFields`, `cyclesRead` and `daysRead`, as in
            `ImportReport`. A real run answers `issues` and `issueCount` alone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: inconsistent_nfp_data
                  message: The file is valid JSON but its contents are inconsistent.
                  details:
                    issues:
                      - "[2026-03-14] temperature 52.4 is outside the plausible range 30.0-45.0 C."
                      - "[cycles[1]] 2026-03-20 appears twice in the file (also in cycles[0]): the cycles overlap."
                    issueCount: 2
        "401":
          $ref: '#/components/responses/Unauthorized'
        "405":
          description: "`method_not_allowed` — only `POST`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "413":
          description: |-
            `file_too_large` — the body is over `requestBodyMaxBytes` (10 MB by default). Split the file into fewer cycles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /all_of_my_data_plz:
    get:
      tags: [files]
      operationId: getRawData
      summary: Download everything (GDPR)
      description: |-
        Returns **all** the data held about the account as one CSV file (the GDPR right of access). Offer it before
        `POST /account/deletion`.

        It is a human-readable dump, not a clean table: three blocks, each with its own header row: the account, its tokens
        (one row per device), then every recorded day. Columns carry the internal database names (some in French), separated
        by `;`, with a UTF-8 BOM. Secrets are masked (`abc [masqué] xyz`): the password hash, the TOTP secret and the tokens.

        To move data to another app, use `GET /export/nfp`.
      responses:
        "200":
          description: The CSV file.
          headers:
            Content-Disposition:
              description: '`attachment; filename="export_moncycle_app.csv"`'
              schema:
                type: string
          content:
            application/csv:
              schema:
                type: string
                format: binary
        "401":
          description: "Not authenticated. No body, and a `Location: auth` header."

# =============================================================================
# COMPONENTS
# =============================================================================

components:

  responses:

    Unauthorized:
      description: |-
        `unauthorized` — no token, an unknown token, or the account is deactivated. Send the user
        back to `POST /token`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: unauthorized
              message: Authentication required.

    UnsupportedMediaType:
      description: |-
        `unsupported_media_type` — the body was not sent as `Content-Type: application/json`. Nothing was read.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: unsupported_media_type
              message: "The body must be sent as 'Content-Type: application/json'."

    CrossOriginRefused:
      description: |-
        `cross_origin_refused` — a browser sent this write from a page of a foreign origin. Nothing was done.
        A client that sends no `Origin` header (curl, scripts, apps) is never refused for this.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: cross_origin_refused
              message: This request comes from a page that is not allowed to write to this API.

    ValidationFailed:
      description: |-
        `validation_failed` — the request is not valid: an unknown field, a wrong type, a value out of range, a date that
        is not one, a body on a request that takes none... **Every** problem is in `error.details.issues` (`field`, `code`,
        `message`). Nothing was done.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorEnvelope'
          example:
            error:
              code: validation_failed
              message: "The request is not valid: 2 problems (see details.issues). First: Unknown field 'stampColour'. Did you mean 'stampColor'?"
              details:
                issues:
                  - field: stampColour
                    code: unknown_field
                    message: "Unknown field 'stampColour'. Did you mean 'stampColor'?"
                  - field: temperature
                    code: wrong_type
                    message: "'temperature' must be a decimal number, got string."

    MethodNotAllowed:
      description: "`method_not_allowed` — this address does not take this method. The `Allow` header lists the ones it takes."
      headers:
        Allow:
          description: The methods this address takes, for example `GET, POST`.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: method_not_allowed
              message: "Method PATCH is not supported here. Supported: GET, POST."

    NotFound:
      description: "`not_found` — this address does not exist (an unknown path after the name of the endpoint)."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: not_found
              message: This URL does not exist.

    ServiceUnavailable:
      description: |-
        `maintenance` — the server is in maintenance; nothing was done, try again later (`GET /server_info` tells).
        `schema_mismatch` — the database needs a migration; nothing works until the operator runs it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: maintenance
              message: The server is under maintenance. Try again later.

  parameters:

    DatePath:
      name: date
      in: path
      required: true
      description: A real calendar date, `YYYY-MM-DD`. It is the identifier of the day.
      schema:
        type: string
        format: date
      example: "2026-03-10"

    DescriptionId:
      name: id
      in: path
      required: true
      description: The `id` of a label, as `GET /description` gives it (a whole number from 1).
      schema:
        type: integer
        minimum: 1
      example: 58

    TokenPrefix:
      name: prefix
      in: path
      required: true
      description: "The first 5 characters of a token (`prefix` in `GET /token`): letters and digits."
      schema:
        type: string
        pattern: '^[A-Za-z0-9]{5}$'
      example: aB3x9

  schemas:

    Error:
      type: object
      description: The content of the `error` key. See introduction, section 2.
      required: [code, message]
      properties:
        code:
          type: string
          description: |-
            A stable slug to branch on. Each endpoint lists its codes.

            Codes you may meet anywhere: `unauthorized`, `validation_failed` (see `details.issues`), `invalid_json`,
            `method_not_allowed`, `not_found`, `maintenance` and `schema_mismatch` (both `503`), `unexpected_error`
            (a server fault: retry, then report it with the `X-Request-Id` of the response).
          example: invalid_credentials
        message:
          type: string
          description: "A sentence in English for a human. **Never parse it**: the wording can change."
          example: Incorrect password or non-existent account.
        details:
          type: object
          description: "Optional extra context, for example `captchaRequired: true` on a refused `POST /token`."
          additionalProperties: true

    ErrorEnvelope:
      type: object
      description: Every failure of a JSON endpoint looks like this.
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'

    TokenRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: The login address of the account. Not case-sensitive, spaces around it are ignored.
          example: demo.bl@moncycle.app
        password:
          type: string
          format: password
          maxLength: 1024
          description: The account password (1024 characters at most).
          example: demo
        name:
          type: string
          maxLength: 256
          description: What the token is called in `GET /token`. One line. Absent or empty, `API`.
          example: backup script
        scope:
          type: string
          enum: [readWrite, readOnly]
          default: readWrite
          description: "`readOnly` can read and end its own session, and do nothing else."
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
          description: The token dies this many days from now. Absent, it is erased after 40 days without use or a year after creation.
          example: 90
        cookie:
          type: boolean
          default: false
          description: "`true`: the server also sets the token as the `MONCYCLEAPP_TOKEN` cookie. The token is in the answer either way."
        code:
          type: integer
          description: The 6-digit TOTP code. Needed only after a sign-in answered `401 totp_required`. Send a string, to keep a leading zero.
          example: 492013
        captcha:
          type: string
          description: "The text read in the picture from `POST /captcha` (purpose `login`). Needed after `403 captcha_required`, or when a response carried `captchaRequired: true`. Case and spaces do not matter."
          example: ak7fpm
        captchaToken:
          type: string
          description: The `token` that came with that picture. After a refused attempt, ask for a new one.
          example: 1790000000.9f2c6b1e0d4a8f7c3b5e2a1d9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b

    Token:
      type: object
      description: A token of the account, as `GET /token` and `POST /token` show it. The token itself is not part of it.
      properties:
        prefix:
          type: string
          nullable: true
          description: The first 5 characters of the token, unique within the account. `DELETE /token/{prefix}` names a token by them.
          example: aB3x9
        name:
          type: string
          description: What the client called it. The client's word, not a proof.
          example: WEB-APP moncycle.app
        scope:
          type: string
          enum: [readWrite, readOnly]
        current:
          type: boolean
          description: "`true` for the token of the request."
        createdAt:
          type: string
          format: date-time
        createdUserAgent:
          type: string
          nullable: true
          description: The `User-Agent` the server received when the token was made (255 characters at most).
        createdIp:
          type: string
          nullable: true
          description: The network of the address the token was made from, `a.b.c.0` (IPv4) or the first 48 bits (IPv6).
          example: 203.0.113.0
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: "`null` for a token never used. Written at most every 5 minutes."
        lastUsedUserAgent:
          type: string
          nullable: true
        lastUsedIp:
          type: string
          nullable: true
          description: Like `createdIp`, for the last use.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: When the token dies (`expiresInDays`, else a year after `createdAt`; a token unused for 40 days is erased earlier).

    Account:
      type: object
      description: |-
        The account and its settings, as `GET /account` shows them (and `POST /account` answers). `userId`, `inscriptionDate`, `oldestDay` and
        `totpState` are read-only: sent in a `POST /account`, they are refused.
      properties:
        userId:
          type: integer
          example: 42
        loginEmail:
          type: string
          format: email
          description: The login address.
        notificationEmails:
          type: string
          nullable: true
          description: The addresses that also receive the cycles, the reminders and the warnings by email, separated by `;`. Empty or `null` when there is none.
          example: partner@example.org;mother@example.org
        method:
          type: string
          enum: [cervicalMucus, fertilityCare]
          description: The tracking method. It decides which fields of a day to display.
        temperatureTracking:
          type: boolean
          description: Does the user also record basal body temperature?
        birthYear:
          type: integer
          description: Year of birth, approximate, used for anonymous statistics.
          example: 1994
        language:
          type: string
          enum: [EN, FR, ES, DE, IT, PL, PT]
          description: "The language of the account. The mails the server sends to the account are written in it."
        nickname:
          type: string
          description: The user's nickname, their initials for instance (the app does not collect the identity of its users).
          example: MB
        inscriptionDate:
          type: string
          format: date-time
          description: When the account was created, UTC.
          example: "2024-06-14T09:21:03Z"
        oldestDay:
          type: string
          format: date
          nullable: true
          description: The date of the oldest day the account holds, `null` when it holds none. Read-only.
          example: "2023-11-02"
        sponsor:
          type: boolean
          description: Is this account a financial supporter of the project?
        research:
          type: boolean
          description: Has the user agreed to contribute anonymous data to research?
        timelineAscending:
          type: boolean
          description: |-
            Display preference: `true` puts today at the top of the table. The API itself always
            returns days in ascending date order.
        autoMailExport:
          type: boolean
          description: Is the export of each finished cycle mailed (PDF, CSV and NFP file)? `true` by default.
        totpState:
          type: string
          enum: [never_used, disabled, init, active, unknown]
          description: |-
            Where the account stands with two-factor authentication.

            | Value | Meaning |
            |---|---|
            | `active` | On. `POST /token` needs a `code`. |
            | `init` | `POST /totp` was called but never confirmed. Login still works with the password alone. |
            | `disabled` | It was on, and the user turned it off. |
            | `never_used` | Never set up. |
            | `unknown` | No state stored. A brand-new account reports this; treat it exactly like `never_used`. |
        lastWriteClientUtc:
          type: string
          format: date-time
          nullable: true
          description: When the account settings were last written, from the client clock. `null` if never.

    Day:
      type: object
      description: |-
        One day of the timeline, the central object of the API (`GET /day`, `GET /day/{date}`, `POST /day/{date}`,
        `GET /timeline_sync`).

        **On write, send the whole object**: a field you leave out is cleared (see `POST /day/{date}`).

        Three groups of fields:

        - **read-only**, computed by the server (dropped if you send them back): `cycleStartDate`, `cycleDay`, `lastWriteDb`;
        - **common**: the stamp, `isPeak`, `cycleFirstDay`, `sexUnion`, `temperature`, `comment`...;
        - **method-specific**: `freeMucus*` and `freeOther` for `cervicalMucus`, `codified*` for FertilityCare.

        A field of the other method is accepted but not displayed.
      required: [date]
      properties:

        date:
          type: string
          format: date
          description: |-
            `YYYY-MM-DD`, the identifier of the day. On write, leave it out or send the date of the address (else `date_mismatch`).
          example: "2026-03-10"

        cycleStartDate:
          type: string
          format: date
          nullable: true
          readOnly: true
          description: '**Read-only.** The first day of the cycle this date belongs to. `null` when no cycle has started yet.'
          example: "2026-03-10"
        cycleDay:
          type: integer
          nullable: true
          readOnly: true
          description: '**Read-only.** Position of this date inside its cycle, from `1`. `null` when `cycleStartDate` is `null`.'
          example: 1

        cycleFirstDay:
          type: boolean
          default: false
          description: '`true` makes this date **day 1 of a new cycle** (introduction, section 1). Setting it back to `false` merges the cycle into the previous one.'
        dayNotObserved:
          type: boolean
          default: false
          description: The user recorded **no observation** on this date ("I looked and have nothing to note"), as opposed to a date with no data.

        stampColor:
          type: string
          nullable: true
          enum: [Red, Green, Yellow, White]
          description: |-
            The colour of the stamp on the chart.

            Limit: `White` without `stampBaby` cannot be told from no stamp, and reads back as `null`.
        stampBaby:
          type: boolean
          default: false
          description: A baby picture on top of the stamp, marking a potentially fertile day.

        isPeak:
          type: boolean
          default: false
          description: "Peak day: the last day of the most fertile mucus. A cycle can have more than one."
        counterStart:
          type: integer
          nullable: true
          description: Start a counter on this day, shown for this many days (0 to 255). `0` is stored as `null`.
          example: 3

        sexUnion:
          type: boolean
          default: false
          description: Sexual intercourse on this date.
        observationPaused:
          type: boolean
          default: false
          description: The observations are paused from this date (whatever the reason); it ends the cycle, and a new cycle resumes them. Listed in `GET /timeline_sync` as `allObservationPausedDates`.

        freeMucusSensation:
          type: array
          description: |-
            **Cervical mucus only.** What the user *feels*, as labels, for example `["dry"]`.

            A new name is created for you. A name that already exists under another type is reused and keeps that
            type. Names should be lower case with no leading or trailing space; the server trims and lower-cases them,
            and the day comes back with the stored form.
          items:
            type: string
            maxLength: 256
          example: [dry, slippery]
        freeMucusObservation:
          type: array
          description: "**Cervical mucus only.** What the user *sees*, as free-text labels. Same rules as `freeMucusSensation`."
          items:
            type: string
            maxLength: 256
          example: [clear and stretchy]
        freeOther:
          type: array
          description: |-
            **Cervical mucus only.** Labels with no type yet (classify them with `POST /description/{id}`).
            Always present on read. On write, leave it out and these labels are unlinked.
          items:
            type: string
            maxLength: 256
          example: []

        temperature:
          type: number
          format: float
          nullable: true
          description: Basal body temperature, 0.00 to 99.99, two decimals (usually °C). `0` or less is stored as `null`.
          example: 36.75
        temperatureTime:
          type: string
          nullable: true
          description: When the temperature was taken, `hh:mm:ss`. Ignored without a `temperature`.
          example: "06:45:00"

        codifiedBleedingObservation:
          type: string
          nullable: true
          description: |-
            **FertilityCare only.** One of `VH`, `H`, `M`, `VL`, `B`, with an optional `L` suffix for
            spotting (for example `BL`), or `L` alone for spotting only.
          example: BL
        codifiedMucusSensation:
          type: string
          nullable: true
          description: "**FertilityCare only.** One of `0`, `2`, `2W`, `4`, `6`, `8`, `10`, `10DL`, `10SL`, `10WL`."
          example: "10"
        codifiedMucusObservation:
          type: string
          nullable: true
          description: "**FertilityCare only.** Any combination of `C`, `G`, `K`, `P`, `Y`, `L`."
          example: KL
        codifiedNumberObservations:
          type: string
          nullable: true
          description: "**FertilityCare only.** One of `X1`, `X2`, `X3`, `AD`."
          example: X2
        codifiedPainObservations:
          type: string
          nullable: true
          description: "**FertilityCare only.** One of `AP`, `RAP`, `LAP`."
          example: AP
        codifiedArrow:
          type: string
          nullable: true
          enum: [Up, Down, Right]
          description: "**FertilityCare only.** The arrow drawn on the chart. An unknown value is stored as `null`."

        comment:
          type: string
          maxLength: 256
          default: ""
          description: A free note from the user. Read back as `""` when empty, never `null`.
          example: cramps in the morning

        lastWriteClientUtc:
          type: string
          format: date-time
          nullable: true
          description: Your own clock, RFC 3339 with a zone. It decides which of two writes of a day is the latest. The server's clock is used if absent.
          example: "2026-03-10T07:12:00Z"
        lastWriteDb:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: '**Read-only.** The server clock at the last write of the day, or of a label it carries. `GET /timeline_sync` is based on it.'
          example: "2026-03-10T07:12:03Z"

    Description:
      type: object
      description: A reusable free-text label, as returned by `GET /description` and `GET /timeline_sync`.
      properties:
        id:
          type: integer
          description: The identifier of the label.
          example: 58
        name:
          type: string
          maxLength: 256
          description: The label text, always trimmed and in lower case. Unique per account.
          example: clear and stretchy
        type:
          type: string
          enum: [undefined, observation, sensation]
          description: '`sensation` is felt, `observation` is seen, `undefined` is not classified yet.'
        useCount:
          type: integer
          description: How many days carry this label. `0` means unused.
          example: 12

    DescriptionWritten:
      type: object
      description: "What `POST /description` and `POST /description/{id}` return: a `Description` with `lastWriteClientUtc` instead of `useCount`."
      properties:
        id:
          type: integer
          example: 58
        name:
          type: string
          description: The stored name.
          example: clear and stretchy
        type:
          type: string
          enum: [undefined, observation, sensation]
        lastWriteClientUtc:
          type: string
          format: date-time
          description: The timestamp that was stored.
          example: "2026-03-10T15:30:45Z"

    NfpFile:
      type: object
      description: |-
        The **NFP file format**: a portable JSON file for moving cycle data between NFP apps. Written by
        `GET /export/nfp`, read by `POST /import`. It is not the live API shape and has its own version:
        only `schemaVersion` `"1.0"` is supported.
      required: [schemaVersion, fileInformation, cycles]
      properties:
        schemaVersion:
          type: string
          pattern: '^[0-9]+\.[0-9]+$'
          description: Version of this file format. Must be `"1.0"`.
          example: "1.0"
        fileInformation:
          $ref: '#/components/schemas/NfpFileInformation'
        userInformation:
          $ref: '#/components/schemas/NfpUserInformation'
        userMethodPreferences:
          $ref: '#/components/schemas/NfpUserMethodPreferences'
        cycles:
          type: array
          minItems: 1
          maxItems: 120
          description: The cycles, in order.
          items:
            $ref: '#/components/schemas/NfpCycle'

    NfpFileInformation:
      type: object
      description: Which app wrote the file, and when.
      required: [sourceApp, sourceAppVersion, fileCreationTimestamp]
      properties:
        sourceApp:
          type: string
          maxLength: 255
          description: The app that wrote the file.
          example: moncycle.app
        sourceAppVersion:
          type: string
          maxLength: 64
          description: The version of that app.
          example: "15dev"
        fileCreationTimestamp:
          type: string
          maxLength: 64
          description: When the file was written, ISO 8601 with a timezone.
          example: "2026-03-31T18:04:22+02:00"

    NfpUserInformation:
      type: object
      description: |-
        Who the data belongs to. Every field is optional. **Never applied on import** (reported in `ignoredFields`);
        omitted on export with `anonymous=true`.
      properties:
        identifier:
          type: string
          maxLength: 255
          description: The writing app's own id for the user. moncycle.app writes the account id.
          example: "1042"
        email:
          type: string
          maxLength: 255
          example: jane@example.org
        firstName:
          type: string
          maxLength: 255
          example: Jane
        lastName:
          type: string
          maxLength: 255
        birthDate:
          type: string
          maxLength: 32
          description: '`YYYY-MM-DD`. moncycle.app never writes it: it only stores a birth year.'
          example: "1995-12-31"
        comment:
          type: string
          maxLength: 1024

    NfpUserMethodPreferences:
      type: object
      description: |-
        The user's method settings. Advisory: the `method` of each cycle decides how it is read.
        **Never applied on import** (reported in `ignoredFields`): the method is changed with `POST /account`.
      properties:
        preferredMethod:
          type: string
          maxLength: 64
          description: "`cervicalMucus`, `fertilityCare`, `symptothermic_fr`, or another app's own value."
          example: cervicalMucus
        twoTenthShift:
          type: boolean
          description: Not recorded by this app.
        oestrogenicalHollow:
          type: boolean
          description: Not recorded by this app.
        irregularitiesSensibility:
          type: boolean
          description: Not recorded by this app.

    NfpCycle:
      type: object
      description: One cycle. The file records the `method` **per cycle**, so a user who changed method keeps a correct history.
      required: [method, cycleStartDate, days]
      properties:
        method:
          type: string
          maxLength: 64
          description: |-
            The method of this cycle: `cervicalMucus`, `fertilityCare`, `symptothermic_fr` (case-insensitive) or an app's own value.
            A cycle of another method still imports: the shared fields are kept, the rest is reported in `ignoredFields`.
          example: cervicalMucus
        cycleStartDate:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Day 1 of this cycle. The first entry in `days` is this date.
          example: "2026-03-10"
        days:
          type: array
          maxItems: 400
          description: |-
            The days in date order from `cycleStartDate`: the position in the array is the day number. A day with
            nothing recorded is `{}`. On import an empty day is a gap (not written, never a conflict), except the first
            day of a cycle, which is always written.
          items:
            $ref: '#/components/schemas/NfpFileDay'
        comment:
          type: string
          maxLength: 1024
          description: Not recorded by this app — only per-day comments are. Reported on import.
        cycleParticularCases:
          type: array
          maxItems: 8
          description: Not recorded by this app. Reported on import.
          items:
            type: string
            enum: [FirstEyedCycle, PostPill, Pregnancy, PostPartum]
        currentCyclePlannedPregnancy:
          type: string
          enum: [Yes, No, Undecided]
          description: Not recorded by this app. Reported on import.
        nextMonthsPlannedPregnancy:
          type: string
          enum: [Yes, No, Undecided]
          description: Not recorded by this app. Reported on import.
        endOfCycleFollowUp:
          type: string
          enum: [Pregnancy, Menopause, Disease, Other]
          description: |-
            *Narrowed.* Any reason is a pause of the observations (`observationPaused` of the API), and no reason is stored:
            export writes `Other` on a cycle that holds a paused day; import stores another value as `Other` and reports it in
            `warnings`. When no day of the cycle carries the `ObservationPaused` event (or `booleanPregnancyDetected`), the pause
            goes on the cycle's last day that is not in the future.
        temperatureUsualTime:
          type: string
          pattern: '^\d{2}:\d{2}:\d{2}$'
          description: Not recorded by this app. Reported on import.
        temperatureCaptureType:
          type: string
          maxLength: 64
          description: Not recorded by this app. Reported on import.
        temperatureThermometerType:
          type: string
          maxLength: 64
          description: Not recorded by this app. Reported on import.

    NfpFileDay:
      type: object
      description: |-
        One day. **Every field is optional**; a field with no value is left out, so `{}` is an empty day.

        Fields marked *not stored* are reported in `ignoredFields` and not written. Fields marked *narrowed* are stored
        less precisely and reported in `mappedFields`.
      properties:
        comments:
          type: array
          maxItems: 32
          description: |-
            The user's notes, joined with newlines into the `comment` of the day (**256 characters**: a longer result
            rejects the file). `GET /export/nfp` also writes the labels with no type yet (`freeOther`) here, as one last
            entry.
          items:
            type: string
            maxLength: 256
          example: ["cramps in the morning"]
        stampColor:
          type: string
          enum: [Green, Red, Yellow, White]
          description: '*Narrowed for `White` alone:* `White` without `stampBaby` is stored as no stamp.'
          example: White
        stampBaby:
          type: boolean
          description: The baby label drawn on top of the stamp colour.
          example: true
        isPeak:
          type: boolean
          description: A cycle can hold more than one peak day.
          example: true
        counterStart:
          type: integer
          minimum: 0
          maximum: 255
          description: Number of days to show a counter for. `0` means none.
          example: 3
        sexUnion:
          type: string
          enum: [Union, ReservedUnion, LastReportedUnion]
          description: '*Narrowed.* Only whether there was a union is stored; export always writes `Union`.'
          example: Union
        mucusNotObserved:
          type: boolean
          description: |-
            The user recorded nothing that day (`dayNotObserved` of the API). The format calls it incompatible with a
            mucus observation on the same day, but this app can hold both: import accepts it, keeps both and reports it in `warnings`.
          example: true
        booleanPregnancyDetected:
          type: boolean
          description: |-
            *Narrowed.* Read as a pause of the observations on this day (reason `Other`), reported in `warnings`. Export never
            writes it: a paused day carries the `ObservationPaused` event of `codifiedEvents`.
          example: false
        temperature:
          type: number
          description: Basal body temperature, two decimals, between **30 and 45 °C** (anything else rejects the file).
          example: 36.75
        temperatureTime:
          type: string
          pattern: '^\d{2}:\d{2}:\d{2}$'
          description: When it was taken, `hh:mm:ss`. Ignored without a `temperature`.
          example: "06:45:00"
        freeMucusSensation:
          type: array
          maxItems: 20
          description: '**Cervical mucus.** Sensation labels (256 characters each). Each becomes a `sensation` description, reusing an existing one of the same name.'
          items:
            type: string
            maxLength: 256
          example: ["dry", "slippery"]
        freeMucusObservation:
          type: array
          maxItems: 20
          description: "**Cervical mucus.** Free-text observation labels, as above but typed `observation`."
          items:
            type: string
            maxLength: 256
          example: ["clear and stretchy"]
        codifiedBleedingObservation:
          type: string
          maxLength: 32
          description: |-
            **FertilityCare:** `VH`, `H`, `M`, `L`, `VL`, `Br` (stored as `B`).

            **Other methods:** *narrowed.* A value becomes a **Red stamp** when the day has no `stampColor`, and is
            reported otherwise (how a `symptothermic_fr` `Traces`/`Medium`/`Heavy` is kept).
          example: VH
        codifiedMucusSensation:
          type: string
          maxLength: 32
          description: |-
            **FertilityCare:** `0`, `2`, `2W`, `4`, `6`, `8`, `10`, `10DL`, `10SL`, `10WL`. A number is read as the string of the same number.
            *Not stored for other methods.*
          example: "10DL"
        codifiedMucusObservation:
          type: string
          maxLength: 32
          description: |-
            **FertilityCare:** `C`, `C/K` (stored as `CK`), `K`, `G`, `L`, `P`, `Y`.
            *Not stored for other methods*, as above.
          example: K
        codifiedNumberObservations:
          type: string
          maxLength: 16
          description: '**FertilityCare:** `x1`, `x2`, `x3`, `AD`, exported uppercase. The numbers `1`, `2`, `3` are read as `x1`, `x2`, `x3`.'
          example: X2
        codifiedPainObservations:
          type: string
          maxLength: 16
          description: "**FertilityCare:** `AP`, `RAP`, `LAP`."
          example: AP
        codifiedArrow:
          type: string
          enum: [Up, Down, Right]
          description: "**FertilityCare.** *Not stored for other methods.*"
          example: Up
        nonUsualBleeding:
          type: boolean
          description: "*Not stored.* This app has no spotting flag of its own."
        booleanCervixMucus:
          type: boolean
          description: "*Not stored.* Cervix observations are not recorded here."
        booleanCervixAperture:
          type: boolean
          description: "*Not stored.* Cervix observations are not recorded here."
        codifiedCervixConsistency:
          type: string
          maxLength: 32
          description: "*Not stored.* Cervix observations are not recorded here."
        codifiedCervixHeight:
          type: string
          maxLength: 32
          description: "*Not stored.* Cervix observations are not recorded here."
        codifiedTemperatureParasitic:
          type: string
          maxLength: 64
          description: "*Not stored.* No temperature-disturbance field is recorded here."
        temperatureCaptureOffset:
          type: integer
          minimum: -12
          maximum: 12
          description: "*Not stored.* Only an absolute `temperatureTime` is recorded here."
        codifiedEvents:
          type: array
          maxItems: 32
          description: |-
            *Narrowed.* Only the custom event `ObservationPaused` is stored: the observations are paused from this day
            (`observationPaused` of the API); export writes it on such a day. Any other event is reported in `ignoredFields`.
          items:
            type: string
            maxLength: 128
        babyFeedCount:
          type: integer
          minimum: 0
          maximum: 99
          description: "*Not stored.* No feed count is recorded here."
        codifiedManualFertility:
          type: string
          maxLength: 64
          description: "*Not stored.* Fertility is computed for display, not stored."

    ImportReport:
      type: object
      description: |-
        What `POST /import` did, or on a dry run what it would do (same shape). Nothing the file carries is dropped
        without appearing in `ignoredFields`, `mappedFields` or `warnings`: show them to the user.
      properties:
        dryRun:
          type: boolean
          description: True when `dryRun=true` was sent, so nothing was written.
          example: false
        override:
          type: boolean
          description: The `override` value that was applied.
          example: false
        schemaVersion:
          type: string
          description: The version the file declared.
          example: "1.0"
        sourceApp:
          type: string
          description: The app the file says wrote it.
          example: moncycle.app
        cyclesRead:
          type: integer
          description: Cycles found in the file.
          example: 2
        daysRead:
          type: integer
          description: Day entries found, including the empty ones.
          example: 58
        daysToWrite:
          type: integer
          description: Days the file asks to write (`daysRead` minus the gaps).
          example: 54
        daysWritten:
          type: integer
          description: "`daysCreated` + `daysOverwritten`. Absent on a dry run."
          example: 54
        daysCreated:
          type: array
          description: Dates that had no data and were created (or would be, on a dry run).
          items:
            type: string
            format: date
          example: ["2026-03-10", "2026-03-11"]
        daysOverwritten:
          type: array
          description: Dates that already had data and were replaced (`override=1` only).
          items:
            type: string
            format: date
          example: []
        daysSkipped:
          type: array
          description: Dates left untouched because they already had data and `override` was `0`.
          items:
            type: string
            format: date
          example: ["2026-03-09"]
        daysAlreadyInAccount:
          type: array
          description: Dates of the file the account already holds a day on (`daysOverwritten` and `daysSkipped` together). It does not depend on `override`, so show it next to that choice.
          items:
            type: string
            format: date
          example: ["2026-03-09"]
        duplicatedDaysInFile:
          type: array
          description: "Dates two cycles of the file both cover. The file is refused over them: empty in every `200`, filled in `error.details` on a refused dry run."
          items:
            type: string
            format: date
          example: []
        descriptionsCreated:
          type: integer
          description: Labels that did not exist on the account and were added (on a dry run, how many would be).
          example: 3
        warnings:
          type: array
          description: "Imported, but worth telling the user: a cycle whose `method` differs from the account's, a `null` read as not set, a wrong value in a field this app does not store..."
          items:
            type: string
          example:
            - "[cycles[0]] the cycle uses 'fertilityCare' while this account is set to 'cervicalMucus'. The data was imported; change the method in the account settings to see it."
        mappedFields:
          type: array
          description: 'Stored less precisely than the file said: a bleeding value outside FertilityCare becoming a Red stamp, a `ReservedUnion` / `LastReportedUnion` becoming a plain union, a `White` stamp with no baby label becoming no stamp, a label used under both types keeping its single type.'
          items:
            type: string
          example:
            - "[2007-01-25] codifiedBleedingObservation 'Heavy' stored as a Red stamp (symptothermic_fr records bleeding as a stamp)."
            - "[2007-02-06] sexUnion 'ReservedUnion' stored as a plain union: only whether there was one is recorded."
            - "[2024-08-01] 'humide' is recorded as a sensation on this account and stays one: a label carries a single type here."
        ignoredFields:
          type: array
          description: 'In the file, nowhere to put it here. Each line reads `[where] field: why`.'
          items:
            type: string
          example:
            - "[file] userInformation: the account's own identity is never changed by an import."
            - "[2007-01-25] codifiedManualFertility: fertility is computed for display, not stored."

    ValidationIssue:
      type: object
      description: One thing wrong in a request.
      required: [field, code, message]
      properties:
        field:
          type: string
          description: |-
            Where. A body field (`stampColor`, `freeMucusSensation[2]`), `query.<name>` for a query parameter,
            `path.<name>` for a part of the address, `body` for the body as a whole.
          example: stampColor
        code:
          type: string
          description: A stable slug to branch on.
          enum: [unknown_field, read_only_field, missing_field, wrong_type, invalid_value, out_of_range, too_long, too_many, invalid_date, invalid_timestamp, invalid_email, date_mismatch, body_not_allowed, password_required, password_too_weak, password_too_long, password_invalid, password_unchanged, email_unchanged, invalid_range, terms_not_accepted]
          example: invalid_value
        message:
          type: string
          description: A sentence in English. It names the field and says what is expected; it never holds the value of a password, a code or a text.
          example: "'stampColor' must be one of Green, Red, Yellow, White, or null."

    ValidationErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum: [validation_failed]
            message:
              type: string
              description: A summary for a human (the first problem, and how many there are).
            details:
              type: object
              required: [issues]
              properties:
                issues:
                  type: array
                  items:
                    $ref: '#/components/schemas/ValidationIssue'

    ServerInfo:
      type: object
      description: What `GET /server_info` says. Fields may be added; none is ever renamed or removed.
      properties:
        app:
          type: string
          example: moncycle.app
        appVersion:
          type: string
          description: The version of the app the server runs. It changes with each release; the version of the contract is the `v2` of the address.
          example: "15"
        maintenanceMode:
          type: boolean
          description: Is the server in maintenance? Every other endpoint then answers `503 maintenance`.
        registrationEnabled:
          type: boolean
          description: Does this instance accept new accounts?
        demoEnabled:
          type: boolean
          description: Are the two public demo accounts on?
        captchaAvailable:
          type: boolean
          description: "`false` when the captcha is not configured: register and recover_password answer `503 captcha_unavailable`."
        newsUrl:
          type: string
          format: uri
          nullable: true
          description: The JSON file the web app fetches for its news banner (an object per language, each with `title`, `description`, `url`, `pubDate`). `null` when off.
          example: https://tech4fertility.org/latest-news.json
        termsOfServiceUrl:
          type: string
          format: uri
          nullable: true
          description: "The https page of the terms of service. `POST /register` requires `termsAccepted: true`: a client that signs people up shows or links this page beside the box to tick. `null` when there is none."
          example: https://www.moncycle.app/ToS/term_of_service_fr.html
        passwordPolicyRegex:
          type: string
          description: The regex (no delimiters; PCRE and JavaScript syntax) a new password must match, else `400` with the issue `password_too_weak`. By default 10 characters at least, a lower case letter, an upper case letter and a digit. A form can use it as a `pattern`.
          example: '^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{10,}$'
        limits:
          type: object
          description: The numbers a form can check before it sends anything.
          properties:
            passwordMaxChars:
              type: integer
              description: The longest new password, in characters. A password typed to sign in may be up to 1024.
              example: 128
            accountNicknameMaxChars:
              type: integer
              example: 255
            registerCommentMaxChars:
              type: integer
              example: 255
            notificationEmailsMax:
              type: integer
              example: 5
            birthYearMaxAge:
              type: integer
              description: A birth year is this year or up to this many years back.
              example: 100
            tokenNameMaxChars:
              type: integer
              example: 256
            tokenExpiresInDaysMin:
              type: integer
              example: 1
            tokenExpiresInDaysMax:
              type: integer
              example: 365
            dayCommentMaxChars:
              type: integer
              example: 256
            descriptionNameMaxChars:
              type: integer
              example: 256
            counterStartMax:
              type: integer
              example: 255
            temperatureMin:
              type: number
              example: 0
            temperatureMax:
              type: number
              example: 99.99
            queryDaysMax:
              type: integer
              description: How many dates (`dates`) or days (`from` to `to`) one `GET /day` reads.
              example: 100
            requestBodyMaxBytes:
              type: integer
              description: The biggest request body any endpoint takes, in bytes (the operator's `REQUEST_BODY_MAX_BYTES`).
              example: 10485760

    TimelineSync:
      type: object
      properties:
        syncTimestamp:
          type: string
          format: date-time
          description: The server clock. Send it as `since` next time, once you have merged this answer.
          example: "2026-03-10T15:31:02Z"
        days:
          type: array
          description: Changed days in date order. A cleared day comes back with every field empty.
          items:
            $ref: '#/components/schemas/Day'
        descriptions:
          type: array
          description: '**Every** label of the account. A label not in the list does not exist any more.'
          items:
            $ref: '#/components/schemas/Description'
        allCyclesFirstDay:
          type: array
          description: "Every date flagged `cycleFirstDay: true`, newest first, whole every time."
          items:
            type: string
            format: date
          example: ["2026-03-10", "2026-02-11", "2026-01-14"]
        allObservationPausedDates:
          type: array
          description: "Every date flagged `observationPaused: true`, newest first, whole every time."
          items:
            type: string
            format: date

    AccountPatch:
      type: object
      description: Every field is optional. Unknown fields and the read-only fields of `Account` are refused.
      properties:
        nickname:
          type: string
          maxLength: 255
          description: A nickname for the user, their initials for instance. Not empty, at most 255 characters.
          example: MB
        password:
          type: string
          format: password
          maxLength: 1024
          description: The current password. Needed with `newPassword`, `notificationEmails` or `loginEmail`.
        newPassword:
          type: string
          format: password
          maxLength: 128
          description: The new password. It must match `passwordPolicyRegex` of `server_info`, be 128 characters at most, and differ from the current one. Needs `password`.
        logoutOtherDevices:
          type: boolean
          default: false
          description: "With `newPassword` only: `true` closes every other session (those devices must sign in again). The calling session stays open."
        loginEmail:
          type: string
          format: email
          description: The new login address, stored in lower case. Needs `password` (and `code` with two-factor). Takes effect when the link mailed to it is used.
          example: marie.new@example.org
        code:
          type: string
          description: The TOTP code. Needed with `loginEmail` when two-factor is on.
          example: "123456"
        notificationEmails:
          type: string
          description: The addresses that also receive the cycles by email, separated by `;` (5 at most, 1024 characters in all). `""` empties the list. Needs `password`.
          example: partner@example.org;mother@example.org
        method:
          type: string
          enum: [cervicalMucus, fertilityCare]
          description: Tracking method. `temperatureTracking` keeps its value when you do not send it.
        temperatureTracking:
          type: boolean
          description: Does the user also record basal temperature? `method` keeps its value when you do not send it.
        birthYear:
          type: integer
          description: Year of birth, for anonymous statistics. The current year or up to 100 years earlier.
          example: 1994
        language:
          type: string
          enum: [EN, FR, ES, DE, IT, PL, PT]
          description: "The language of the account. The mails the server sends to the account are written in it."
        timelineAscending:
          type: boolean
          description: 'Display preference only: `true` puts today at the top of the table. The API always returns days in ascending order.'
        research:
          type: boolean
          description: Consent to contribute anonymous data to research programs.
        sponsor:
          type: boolean
          description: Marks the account as a financial supporter of the project.
        autoMailExport:
          type: boolean
          description: Mail the export of each finished cycle (PDF, CSV and NFP file) to the login address and `notificationEmails`. `true` by default.
        lastWriteClientUtc:
          type: string
          format: date-time
          description: Your own clock, RFC 3339 with a zone. The server's clock when absent.
          example: "2026-03-10T15:30:45Z"

    AccountPatchMeta:
      type: object
      properties:
        fieldsUpdated:
          type: array
          description: "The settings that were written (`password` when `newPassword` was set). Can be empty. Never `loginEmail`: it changes when the link is used."
          items:
            type: string
            enum: [nickname, notificationEmails, method, birthYear, language, timelineAscending, research, sponsor, autoMailExport, password]
          example: [method]
        loggedOutDevices:
          type: integer
          description: Number of other sessions closed. Present when `newPassword` was sent.
        loginEmailLinkSent:
          type: boolean
          description: Only when `loginEmail` was sent. `false` means the mail with the link could not be sent.

    TotpConfirmRequest:
      type: object
      required: [code, password]
      properties:
        code:
          type: string
          description: The one-time code of the authenticator app, as a string of digits (a leading zero matters). A number is accepted too.
          example: "091710"
        password:
          type: string
          maxLength: 1024
          description: The current password of the account.

    TotpCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: The one-time code of the authenticator app, as a string of digits (a leading zero matters). A number is accepted too.
          example: "091710"

    RevokedTokens:
      type: object
      properties:
        revoked:
          type: integer
          description: How many tokens were revoked.
          example: 3

    DescriptionType:
      type: string
      enum: [undefined, observation, sensation]
      description: "`sensation` = what the user feels. `observation` = what the user sees. `undefined` = not classified yet."
      example: sensation

  securitySchemes:

    HTTPtoken:
      type: http
      scheme: Bearer
      description: |-
        The token from `POST /token`, in the `Authorization` header:

        ```
        Authorization: Bearer <token>
        ```

        For apps, scripts and mobile clients. It wins over the cookie if both are sent.

    HTTPcookie:
      type: apiKey
      in: cookie
      name: MONCYCLEAPP_TOKEN
      description: |-
        The same token, in a cookie. `POST /token` sets it when you ask (`cookie: true`; HttpOnly, SameSite=Strict by default), so a browser client has nothing to store.
