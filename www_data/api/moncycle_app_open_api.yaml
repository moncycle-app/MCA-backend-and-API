  - url: http://localhost:8003/api/v2
    description: Local development (docker).

# Every endpoint needs a token, unless it declares `security: []`.
security:
  - HTTPtoken: []
  - HTTPcookie: []

tags:
  - name: server
    description: |-
      Public endpoints. No token, no personal data. **`GET /server_info` is the first call of every client**: the
      version of the contract, whether the server is in maintenance and the limits to check a form with. Also monitoring
      (`GET /health_check`) and the public counters for a web site (`GET /pub_stat`).
  - name: auth
    description: |-
      Getting in and proving who you are: the captcha, sign-up, the link by e-mail (`POST /verify_email`), sign-in
      and the tokens (`POST`, `GET`, `DELETE /token`), the lost password, two-factor authentication.

      Read **sections 3 and 4** of the introduction first. The order of the calls matters: a
      captcha is asked for just before the call it guards, for the same address.
  - name: account
    description: |-
      The account: `GET /account`, `POST /account` (settings, login address, password), and its deletion.
  - name: timeline
    description: |-
      The heart of the API: the timeline of days (`/day`), the reusable free-text labels (`/description`), and
      `GET /timeline_sync`, which keeps a local copy up to date.

      Read **section 1** of the introduction first ("one day = one observation"), and
      **section 5** before your first write (`POST /day/{date}` replaces the whole day).
  - name: files
    description: |-
      Import and export. Both speak the portable **NFP file format**, which is versioned on its
      own (`schemaVersion`) and shared with other NFP apps.

      `GET /export/{format}` returns a **file** when it works and the usual `error` envelope when it does not.
      `POST /import` takes a file but answers like the rest of the API, with `data` on success and `error` on failure.

paths:

  # ---------------------------------------------------------------------------
  # GENERAL
  # ---------------------------------------------------------------------------

  /server_info:
    get:
      tags: [server]
      operationId: getServerInfo
      summary: What this server is — the first call of every client
      description: |-
        Public, no token. **Call it first**, before anything else: it says which version of the app the server runs
        (`appVersion`), whether the operator put it in maintenance, which optional features it has (new accounts, the
        demo accounts, the captcha, the news banner), the address of the terms of service, and the numbers a client needs to check a form before sending it.
        It is made from the settings of the server alone: the database is not opened, so it answers in maintenance too.

        ### The contract of this call

        Like the rest of v2, its fields may grow (see the introduction, "Compatibility"); they are never renamed or removed.

        ### `maintenanceMode`

        `true` when the operator put the server in maintenance: every other endpoint then answers `503 maintenance`
        before it reads or writes anything. The answer of this call is `200` all the same, so a client can tell the
        user to come back later. (A database that is not at the version this code needs is not told here: every other
        endpoint answers `503 schema_mismatch`.)

        ### The version

        `appVersion` — an integer, the version of the **app** the server runs. It is also the version of the database
        schema: the server serves nothing from a database at another number. It rises with each release, so a client that
        finds a different number than last time knows the server was updated (the web app then drops its local copy
        and reloads). It says nothing of the contract, which is the `v2` of the address. It is the only version the
        server tells: not the build, not the commit.

        ### `limits`

        The numbers a form can check before it sends anything: lengths in characters (`...Chars`), sizes in bytes
        (`...Bytes`), and how many days or dates one `GET /day` reads. Nothing here is secret.
      security: []
      responses:
        "200":
          description: The server.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ServerInfo'
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'

  /health_check:
    get:
      tags: [server]
      operationId: getHealthCheck
      summary: Is the server alive?
      description: |-
        For monitoring. The server answers `200` only if it can reach the database **and** get
        the expected result from a real query. Any other case is `503`.

        The body of a healthy answer is the fixed string `oookkk` (test for it as it is):

        ```json
        { "data": { "status": "oookkk" } }
        ```

        In maintenance it answers `503 maintenance` like every other endpoint, without opening the database. A
        container healthcheck must accept that answer as alive, or a server in maintenance is taken for a dead one
        (the `docker-compose.exemple.yml` of the repository does).

        Nothing is written and nothing personal is read, so you can poll this often. For the version, the maintenance
        and the limits of the server use `GET /server_info`.
      security: []
      responses:
        "200":
          description: The server and the database both work.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [oookkk]
        "503":
          description: |-
            `maintenance` — the server is in maintenance (the database was not looked at).
            `database_unreachable` — the database is down, or the query failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /pub_stat:
    get:
      tags: [server]
      operationId: getPubStat
      summary: Public counters
      description: |-
        Public, anonymous usage counters, for a web site.

        Every number is **rounded on purpose** so that no individual can be recognised:
        accounts and cycles to the nearest 10, observations to the nearest 100. A small
        instance can therefore report `0`. The numbers are counted once a day, by the cron, and
        kept: the endpoint only reads them (before the cron has run for the first time it counts
        them on the spot).

        Side effect: calling this endpoint increases the internal daily, weekly and monthly
        visit counters. Do not use it as a health check — use `GET /health_check`.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accounts:
                        type: integer
                        description: Number of accounts, rounded to the nearest 10.
                        example: 1250
                      cycles:
                        type: integer
                        description: Number of recorded cycles, rounded to the nearest 10.
                        example: 8430
                      observations:
                        type: integer
                        description: Number of recorded days, rounded to the nearest 100.
                        example: 241500
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /register:
    post:
      tags: [auth]
      operationId: registerAccount
      summary: Create an account
      description: |-
        Creates an account with the password the caller gives, and **emails a link that proves the
        address**. The account cannot be signed in to until the link is used (`POST /verify_email`,
        purpose `accountCreation`): `POST /token` answers `403 email_not_verified` meanwhile. An account
        whose address is not proved within 7 days is erased.

        ### The answer does not say whether the address is new

        The answer is `202 {"sent": ...}` **whether the address was new or already had an account**
        (proved or not), so nobody can find out who has an account. For an address that already has
        one, **nothing of it is touched**, whatever this request says (name, password, birth year):
        its owner gets a mail saying so, with a link to choose a new password. Everything a request
        can get wrong (a field, the password) is refused with a 400 (`validation_failed`, with every problem in `details.issues`) *before* the address is
        looked up, so these answers do not depend on it either.

        ### Order of calls

        1. `POST /captcha` with `{"purpose":"register","email":...}` — a picture and a signed token.
        2. A human reads the picture.
        3. `POST /register` with the answer in `captcha` and the token in `captchaToken`, for **the
           same address** (as the server normalises it: trimmed, in lower case) and **from the same
           network** (the same /24 for IPv4, /64 for IPv6).

        The token lasts 5 minutes. Nothing is stored for it, but a request that makes a link changes
        the state it is tied to: sent a second time, it answers `403 captcha_invalid`. After a refused
        captcha, ask for a new one.

        Every captcha that fails counts as an attempt against the caller's IP address (the limit
        of section 9, `429 rate_limited`); one that passes gives its attempt back.

        `sent: false` means the mail could not be sent. Send the user to `POST /recover_password`: it
        mails a link that works for an account whose address is not proved yet as well.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname, email, password, birthYear, termsAccepted, captcha, captchaToken]
              properties:
                nickname:
                  type: string
                  maxLength: 255
                  description: A nickname for the user, their initials for instance. The app does not collect the identity of its users, so do not ask for a name. Control characters are removed, and leading and trailing spaces.
                  example: MB
                email:
                  type: string
                  format: email
                  description: Login address. The link that proves it is sent here. It should not identify the person (not `firstname.lastname@domain`). Spaces around it are ignored and it is stored in lower case, so `Marie@Example.org` and `marie@example.org` are one account.
                  example: marie@example.org
                password:
                  type: string
                  minLength: 10
                  description: |-
                    The password the user chose: 10 characters at least, **72 bytes at most** (bcrypt reads no more, so a longer one is refused instead of being half kept), no null character. It is stored hashed. It is ignored when the address already has an account.
                  example: a long passphrase
                birthYear:
                  type: integer
                  description: |-
                    Year of birth, used for anonymous statistics only. It does not need to be exact
                    (± 2 years is fine). Must be the current year or up to 100 years earlier.
                  example: 1994
                captcha:
                  type: string
                  description: The text read in the picture from `POST /captcha`. Upper or lower case, and spaces, make no difference.
                  example: ak7fpm
                captchaToken:
                  type: string
                  description: The `token` that `POST /captcha` (purpose `register`, this address) answered with. Valid for 5 minutes.
                  example: 1790000000.9f2c6b1e0d4a8f7c3b5e2a1d9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b
                method:
                  type: string
                  enum: [cervicalMucus, fertilityCare]
                  default: cervicalMucus
                  description: Tracking method. Defaults to `cervicalMucus` when omitted. See introduction, section 7.
                temperatureTracking:
                  type: boolean
                  default: false
                  description: Does the user also record basal body temperature?
                discoveredComment:
                  type: string
                  maxLength: 255
                  description: Free-text answer to "how did you find this app?". Optional.
                  example: recommended by my midwife
                okForResearch:
                  type: boolean
                  default: false
                  description: Consent to share anonymous data with research programs. Optional, and the user can change it later (`research` in `POST /account`).
                termsAccepted:
                  type: boolean
                  description: |-
                    Must be `true`: the user has read and accepts the terms of service (`termsOfServiceUrl` in `GET /server_info`). `false`
                    is refused with the issue code `terms_not_accepted`, a missing field with `missing_field`. The moment is kept with the
                    account, as the trace of the consent. Ignored, like the rest, when the address already has an account.
                  example: true
      responses:
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "202":
          description: Request accepted, for a new address and for one that already has an account alike. The mail holds a link.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sent:
                        type: boolean
                        description: "`false` means the mail could not be sent."
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "403":
          description: |-
            `registration_disabled` — this instance does not accept new accounts.
            `captcha_invalid` — a wrong answer, or a token that is missing, altered, cut, for another address or another network, or already used. One code for all of them, on purpose.
            `captcha_expired` — the token is more than 5 minutes old: ask for a new one.
            `cross_origin_refused` — a browser page of another origin sent this write (see section 3 of the introduction).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "429":
          description: "`rate_limited` — too many failed attempts from this IP address (section 9). Wait and try again later."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "503":
          description: "`captcha_unavailable` — the instance has no `CAPTCHA_SECRET` of at least 32 characters, so the captcha is closed and nothing that needs one can be done. `maintenance` — see section 2."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "409":
          description: |-
            `already_authenticated` — you sent a valid token; log out first. A token of one of the two public
            demo accounts does not count: the caller is a visitor, who can sign up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /captcha:
    post:
      tags: [auth]
      operationId: createCaptcha
      summary: Get a captcha challenge
      description: |-
        Gives a **picture** and a signed **token** for one purpose and one address. A human reads
        the picture; the call that the captcha guards then carries the answer (`captcha`) and the
        token (`captchaToken`).

        **The server stores nothing**: no row, no cookie, no session. The token is `<exp>.<mac>`:
        its expiry, and an HMAC-SHA256 (with the instance's `CAPTCHA_SECRET`) of the purpose, the
        address, the expiry, the right answer, the caller's network (the IP address cut to its
        /24, or /64 for IPv6) and, depending on the purpose, a state of the account:

        | `purpose` | Guards | The token is also tied to | So it stops working when |
        |---|---|---|---|
        | `register` | `POST /register` | the stored password and the link pending for the address | a link is made, used or replaced, or the password changes: one mail per captcha, whether the address has an account or not |
        | `recover` | `POST /recover_password` | the stored password and the link pending for the address | the same: a request that makes a link uses the token up |
        | `login` | `POST /token`, once `captchaRequired` | the account's failure counters | a login attempt moves them: ask again after each refused attempt |

        The answer has the same shape whether the address has an account or not: nothing can be
        learned about an address from it.

        The picture is a JPEG of six characters, letters and digits that do not look alike, in
        lower case (`adefhkmnprtwxy3467`). The answer is matched without regard to case or spaces.

        The token lasts 5 minutes (`expiresAt` is a Unix time). Ask for a new one when the address
        changes, after any refused captcha, and when it has run out. A token is checked
        for what it was made for: a different purpose, address or network, an altered expiry or
        a token that was used up all answer `captcha_invalid`, with no clue as to which.

        The response carries `Cache-Control: no-store`. Only `POST` is accepted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, email]
              properties:
                purpose:
                  type: string
                  enum: [register, recover, login]
                  description: What the captcha is for.
                  example: register
                email:
                  type: string
                  format: email
                  description: The address of the call that follows (`email` of `POST /register`, `/recover_password` or `/token`). Spaces around it are ignored and it is read in lower case.
                  example: marie@example.org
      responses:
        "200":
          description: A new challenge.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      image:
                        type: string
                        description: The picture, as a data URI (`data:image/jpeg;base64,...`), ready for the `src` of an `<img>`.
                      token:
                        type: string
                        description: "`<exp>.<mac>`: send it back as `captchaToken`, with the answer as `captcha`."
                        example: 1790000000.9f2c6b1e0d4a8f7c3b5e2a1d9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b
                      expiresAt:
                        type: integer
                        description: When the token runs out, a Unix time (5 minutes after it was made).
                        example: 1790000000
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "403":
          $ref: '#/components/responses/CrossOriginRefused'
        "405":
          description: "`method_not_allowed` — only `POST`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "503":
          description: "`captcha_unavailable` — the instance has no `CAPTCHA_SECRET` of at least 32 characters. `maintenance` — see section 2."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /verify_email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Use the link of a mail
      description: |-
        Uses the link that a mail carried: it **proves the address** of a new account
        (`accountCreation`), **sets a new password** (`resetPassword`) or **changes the login
        address** (`changeEmail`). No token is needed: the person may open the mail on another
        device, and the link's token is the whole proof.

        ### The link

        A mail's link is a page of the app: `APP_URL` + `verify_email#purpose=<purpose>&t=<token>`.
        The purpose and the token are in the **fragment**, which no server, log or `Referer`
        ever sees, and a mail scanner that only fetches the link runs no script, so it uses
        nothing up. The page posts them here. A client that is not a web page does the same: read
        both from the link, post them.

        - The token is 32 random bytes; the server keeps its SHA-256 only.
        - **One slot per account:** a new link (a sign-up, a `POST /recover_password`, a
          `POST /account` that changes `loginEmail`) replaces the one before it, whatever that one was for.
        - A link is **single use** and checked against its purpose: the link of one action cannot do
          another (`invalid_token`).
        - It lives 3 days (`accountCreation`), 1 hour (`resetPassword`) or 1 day (`changeEmail`), then
          answers `token_expired`.

        ### What each purpose does

        | `purpose` | Does | Also |
        |---|---|---|
        | `accountCreation` | the address is proved: the account can be signed in to | |
        | `resetPassword` | sets `newPassword` | proves the address; the sessions that are open **stay open** and the TOTP is not touched; the owner is told by mail |
        | `changeEmail` | the login address becomes the one the link was made for | the old address is told by mail; the sessions stay open |

        The password is checked **before** the link is touched: a refused password (`400`, issue `password_too_short`, ...) does not
        use the link up.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, token]
              properties:
                purpose:
                  type: string
                  enum: [accountCreation, resetPassword, changeEmail]
                  description: What the link is for, as the link says.
                token:
                  type: string
                  description: The token of the link.
                newPassword:
                  type: string
                  minLength: 10
                  description: Required for `resetPassword` only. 10 characters at least, 72 bytes at most, no null character.
      responses:
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "403":
          $ref: '#/components/responses/CrossOriginRefused'
        "200":
          description: The link was used up and did what it is for.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      purpose:
                        type: string
                        enum: [accountCreation, resetPassword, changeEmail]
                      loginEmail:
                        type: string
                        description: The address to sign in with from now on.
                        example: marie@example.org
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "409":
          description: "`email_taken` — (`changeEmail`) another account has the new address since the link was made. The account keeps its address."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "429":
          description: "`rate_limited` — too many attempts from this IP address (section 9): every call counts until it succeeds. Wait and try again later."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /token:
    post:
      tags: [auth]
      operationId: createToken
      summary: Sign in, and get a token
      description: |-
        Exchanges an email and a password for a **token**. This is the only way to get one: the
        web app's session and the token of a script are made by the same call. The credentials are
        **always** checked, whatever token the request carries, so a stolen session cannot make
        itself another token without the password. The throttling of section 9 applies to every call.

        ### What the token is

        - `name` — what you call it (256 characters at most, one line; default `API`). It is shown in
          `GET /token`, so make it recognisable: `backup script`, `WEB-APP moncycle.app`. The web app
          names its sessions `WEB-APP <the domain it was opened on>`.
        - `scope` — `readWrite` (default) or `readOnly`. A read-only token can use `GET`, `HEAD` and `OPTIONS`
          and end its own session (`DELETE /token`); everything else answers `403` `read_only_token`. Signing in
          again with it is allowed.
        - `expiresInDays` — 1 to 365. The token dies on that day **whatever its use**, and from that moment
          it opens nothing (`401`). Without it the token lives until it is destroyed, but the daily cron
          erases it after 40 days without use or a year after its creation.
        - `cookie` — `true` to also have the server set the token as the `MONCYCLEAPP_TOKEN` cookie
          (a browser's session; the cookie it replaces is dropped with its session). `false` (default) sets
          no cookie: use it for a script, and for a token made from a page that already has a session.
          **The token is in the answer either way.** A page of the web app could therefore read it:
          the `Content-Security-Policy` (`script-src 'self'`) is what stands in the way.

        The server also keeps, for each token, the **user agent** and the **IP address** of the client when
        the token was made and when it was last used. `GET /token` shows them (the address cut to its network).

        Every sign-in is **announced by e-mail** to the account's own address (the two public demo accounts
        excepted), with the name, the token's `prefix` (to find it in `GET /token`), the scope, the expiry date and the user agent.
        No address is in the mail.

        ### Which call do I make?

        ```
        POST /token {email, password, name?, scope?, expiresInDays?, cookie?}
          |
          |-- 201 + token ............... done
          |-- 401 totp_required ......... retry with {email, password, code}
          |-- 403 captcha_required ...... POST /captcha {purpose:"login", email}, then retry with {email, password, captcha, captchaToken}
          |-- 403 captcha_expired ....... the captchaToken is more than 5 minutes old: ask for a new one
          |-- 401 invalid_credentials ... wrong email or password
          |-- 403 account_locked ........ too many failures, wait (see section 9)
          |-- 429 rate_limited .......... too many attempts from this IP, wait
          '-- 400 validation_failed ..... a field is wrong (see details.issues); nothing was counted
        ```

        A captcha and a TOTP code can both be required at the same time. Send them together.

        ### Reading the success body

        The token as `GET /token` shows it (`current` is `true`), plus:

        - `token` — your credential, **shown this once**: only its SHA-256 is kept, nobody can show it again.
        - `totpUsed` — whether a second factor was verified on this sign-in.
        - `captchaRequired` — a hint about the **next** attempt on this account, not this one.
          It can appear on a success.

        Each sign-in creates a **new** token and leaves the existing ones valid, so signing in on a phone
        does not disconnect the laptop. There is no limit to their number: revoke the ones you do not use.
        **A script should sign in once and keep its token**, not sign in on every run: each sign-in is a new
        token in the list and a mail to the owner.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "201":
          description: Signed in. A token was made.
          headers:
            Set-Cookie:
              description: "`MONCYCLEAPP_TOKEN=<token>`. HttpOnly, SameSite=Strict by default (`COOKIE_SAMESITE`), 5 years (the day the token dies, with `expiresInDays`). Only with `cookie: true`."
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Token'
                      - type: object
                        properties:
                          token:
                            type: string
                            description: 256-character token. Shown once.
                          userId:
                            type: integer
                            example: 42
                          totpUsed:
                            type: boolean
                            description: "`true` when a TOTP code was verified."
                          captchaRequired:
                            type: boolean
                            description: Present and `true` when the **next** attempt on this account will need a captcha.
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          description: |-
            `invalid_credentials` — wrong password, or no such account. The same code is used for both,
            on purpose, so nobody can discover which emails have an account.
            `totp_required` — the password is correct, now send `code`.
            `totp_invalid` — the password is correct but `code` is wrong or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: |-
            `login_disabled` — this instance has logins turned off.
            `captcha_required` — send `captcha` (the answer) and `captchaToken` (from `POST /captcha`, purpose `login`, this address). Also the answer to a wrong or used-up one: after each refused attempt, ask for a new token.
            `captcha_expired` — the `captchaToken` is more than 5 minutes old.
            `account_disabled` — the account was deactivated by an administrator, or it is one of the two public demo accounts and this instance has them turned off (`DEMO_ENABLED`).
            `email_not_verified` — the password is right, but the address was never proved: the link mailed at sign-up has not been used (`POST /verify_email`). Said only to someone who knows the password (a wrong one still answers `401 invalid_credentials`), counted as no failed attempt, and no token is made.
            `account_locked` — too many recent failures. Wait; it clears after 60 minutes with no new failure. With two-factor authentication on, it also refuses the right password and code.
            `cross_origin_refused` — a browser page of another origin sent this write (see section 3 of the introduction).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "429":
          description: "`rate_limited` — too many attempts from this IP address. Wait and try again later."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "503":
          description: "`captcha_unavailable` — this account must answer a captcha and the instance has no `CAPTCHA_SECRET` of at least 32 characters. Nothing is counted against the account. `maintenance` — see section 2."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    get:
      tags: [auth]
      operationId: listTokens
      summary: List the account's tokens
      description: |-
        Every token of the account that still opens something, the newest first: the browsers and
        apps signed in, and the tokens made for scripts. **The token itself is never shown** (only its
        hash is kept); what is shown is its first 5 characters, `prefix`: they tell the tokens of one app
        apart, and `DELETE /token/{prefix}` takes them. A `prefix` is unique within the account, and it is no secret
        (the other 251 characters are the secret).

        What is shown of each is what the server saw, and what the client said:

        - the server's own facts: `createdAt`, `lastUsedAt`, `expiresAt`, `scope`, `current` (the token of this
          very request), the user agent and the network of the address.
        - `name` is the client's word. **Anyone who signs in can call their token anything**, `WEB-APP moncycle.app`
          included, and send any user agent. The list helps its owner recognise their devices; it proves nothing
          about who holds a token. When in doubt, revoke every other token and change the password.

        `lastUsedAt` and the last user agent and address are written at most **every 5 minutes**.

        The two public demo accounts have no list (`403` `demo_account`): their sessions are the visitors'.
      responses:
        "200":
          description: The tokens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Token'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: "`demo_account` — a demo account has no list of tokens."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    delete:
      tags: [auth]
      operationId: deleteToken
      summary: Log out, or revoke every other token
      description: |-
        **Without a parameter**: ends the session you are using. It deletes the token of this request and clears the
        cookie (`HttpOnly`: only the server can). It is **idempotent**: a token that is already gone, or none at all,
        is a logout all the same and answers `204`, with the cookie cleared. A read-only token may do it.

        **With `others=true`**: revokes **every token but the one you are using**. This is what to do when a device is
        lost or a token leaked; `POST /account` with `newPassword` and `logoutOtherDevices` does the same with the
        password. A read-only token cannot (`403` `read_only_token`), nor a demo session (`403` `demo_account`).

        To revoke **one** token, name it in the address: `DELETE /token/{prefix}`.

        A `DELETE` takes **no body**: a body is refused (`400`, issue `body_not_allowed`), because many HTTP clients
        cannot send one. What identifies the target is in the address.
      parameters:
        - name: others
          in: query
          required: false
          description: "`true` to revoke every other token. Any other value is refused: leave the parameter out to log out."
          schema:
            type: boolean
            enum: [true]
      responses:
        "204":
          description: Logged out. Also returned when you were not logged in.
          headers:
            Set-Cookie:
              description: Expires `MONCYCLEAPP_TOKEN`.
              schema:
                type: string
        "200":
          description: The other tokens were revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RevokedTokens'
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          description: "`unauthorized` — `others=true` was sent and the token is not valid."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: "`read_only_token` — a read-only token revoking others. `demo_account` — a demo session. `cross_origin_refused` — see section 3 of the introduction."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'

  /token/{prefix}:
    delete:
      tags: [auth]
      operationId: revokeToken
      summary: Revoke one token
      description: |-
        Revokes the token that starts with these 5 characters (`prefix` in `GET /token`, or in the answer of
        `POST /token`). Another account's token, or one that does not exist, is a `404` `not_found`: a prefix is
        looked up in your own account only. Revoking your own `prefix` is a logout (the cookie is cleared).

        A read-only token may revoke only itself. The demo accounts' tokens cannot be revoked by `prefix`
        (`403` `demo_account`): they belong to every visitor.

        No body. `GET`, `POST` and the other methods answer `405` with `Allow: DELETE`.
      parameters:
        - $ref: '#/components/parameters/TokenPrefix'
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RevokedTokens'
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: "`read_only_token` — a read-only token revoking another token. `demo_account` — see above. `cross_origin_refused` — see section 3 of the introduction."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: "`not_found` — `prefix` is not the start of a token of this account."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'

  /recover_password:
    post:
      tags: [auth]
      operationId: recoverPassword
      summary: Send a link to choose a new password
      description: |-
        Emails the owner a **link to choose a new password**. **The password is not touched until the
        link is used** (`POST /verify_email`, purpose `resetPassword`): asking for one locks nobody
        out, and the sessions that are open stay open.

        **This endpoint always answers `200` with `sent: true`**, whether the account exists or
        not, and whether the email was delivered or not. It also waits a random 1 to 5 seconds.
        Both behaviours are deliberate: they stop an attacker from discovering which email
        addresses have an account, either from the response or from its timing.

        So your client cannot know whether a mail was really sent. Show a neutral message, for
        example: *"If an account exists for this address, a link to choose a new password has been sent."*

        The link lives 1 hour and works once. **An account has one slot for the link it is waiting
        for** (a verification, a reset, a change of address): this call replaces whatever was there,
        so it also cancels a change of address that was waiting. It proves the address as well: it
        works for an account whose address was never verified.

        **A captcha is needed** (`POST /captcha`, purpose `recover`), and it is checked the same
        way whether the account exists or not. The token is tied to the stored password and to the
        link waiting, and the link is made while the account is held: of requests that arrive
        together with one token, one makes a link and the others get `403 captcha_invalid`. The mail
        is sent after the link is saved, never before. No login token is needed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, captcha, captchaToken]
              properties:
                email:
                  type: string
                  format: email
                  description: The login address of the account.
                  example: marie@example.org
                captcha:
                  type: string
                  description: The text read in the picture from `POST /captcha`. Upper or lower case, and spaces, make no difference.
                  example: ak7fpm
                captchaToken:
                  type: string
                  description: The `token` that goes with that picture (purpose `recover`, this address).
                  example: 1790000000.9f2c6b1e0d4a8f7c3b5e2a1d9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b
      responses:
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "403":
          description: |-
            `captcha_invalid` — a wrong answer, or a token that is missing, altered, for another address or network, or already used (the link it was tied to is replaced). One code for all of them.
            `captcha_expired` — the token is more than 5 minutes old.
            `cross_origin_refused` — a browser page of another origin sent this write (see section 3 of the introduction).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "429":
          description: "`rate_limited` — too many failed attempts from this IP address (section 9). Wait and try again later."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "503":
          description: "`captcha_unavailable` — the instance has no `CAPTCHA_SECRET` of at least 32 characters. `maintenance` — see section 2."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "200":
          description: Request accepted. This says nothing about whether the account exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sent:
                        type: boolean
                        enum: [true]
        "400":
          $ref: '#/components/responses/ValidationFailed'

  /totp:
    post:
      tags: [auth]
      operationId: startTotpSetup
      summary: "Two-factor: step 1, start the setup"
      description: |-
        Starts the setup of **TOTP** two-factor authentication (the 6-digit code from an app
        such as Aegis, FreeOTP or Google Authenticator). It is a `POST` because it **stores a new secret**.

        ### The three steps

        ```
        POST /totp                    -> a new secret + a QR code      (state becomes "init")
        POST /totp/confirm {code, password} -> confirm with one real code and the password (state becomes "active")
        POST /totp/disable {code}     -> turn it off                    (state becomes "disabled")
        ```

        Two-factor is **not active** after this call. It only becomes active after `POST /totp/confirm`
        succeeds. Until then, login keeps working with the password alone. This way a user who
        loses the QR code mid-setup is never locked out.

        The body is optional and has no field: send nothing, or `{}`.

        ### Using the response

        Show `qrcode` to the user, and `initSecret` as a fallback for manual entry. Each call
        generates a **new secret and replaces the previous one**, so any code from a half-
        finished earlier attempt stops working.

        | Field | Use |
        |---|---|
        | `qrcode` | A complete **SVG document as a string**. Render it directly; there is no PNG. |
        | `otpauth` | The `otpauth://` URI behind the QR code. Use it for a "tap to add" link on mobile. |
        | `initSecret` | The raw base32 secret, for users who type it by hand. |

        `initSecret` and `otpauth` are as sensitive as a password. Never log them.

        A read-only token is refused (`403` `read_only_token`), as for every `POST`.
      responses:
        "200":
          description: Setup started. The account state is now `init`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      totpState:
                        type: string
                        enum: [init]
                      initSecret:
                        type: string
                        description: Base32 secret. Secret value — do not log it.
                        example: JBSWY3DPEHPK3PXP
                      otpauth:
                        type: string
                        description: "`otpauth://` provisioning URI. Secret value — do not log it."
                        example: otpauth://totp/marie%40example.org?issuer=MONCYCLE.APP&secret=JBSWY3DPEHPK3PXP
                      qrcode:
                        type: string
                        description: A full SVG document, as a string.
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: "`read_only_token` — the token is read-only. `cross_origin_refused` — see section 3 of the introduction."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "409":
          description: "`totp_already_enabled` — turn it off with `POST /totp/disable` before setting it up again."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /totp/confirm:
    post:
      tags: [auth]
      operationId: confirmTotp
      summary: "Two-factor: step 2, turn it on with a code and the password"
      description: |-
        Confirms the setup with one real code from the authenticator app, **and the current password**: the step that
        makes two-factor take effect asks for it, so a session that is not the owner's cannot lock the owner out of the next
        sign-in. From then on `POST /token` asks for a `code`. The code is a string of digits (keep a leading zero:
        `"091710"`); a number is accepted too. Spaces in a string are ignored.

        A wrong password or code counts against the account like a failed sign-in (section 9): past the lockout threshold
        every such check, here and in `POST /account`, `POST /account/deletion` and `POST /totp/disable`, answers
        `403 account_locked` until the failures age out. The session itself stays valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpConfirmRequest'
      responses:
        "200":
          description: Two-factor authentication is on.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      totpState:
                        type: string
                        enum: [active]
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          description: "`unauthorized` — no valid token. `invalid_password` — the password is wrong. `totp_invalid` — the code is wrong or expired."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: "`read_only_token` — the token is read-only. `account_locked` — too many wrong passwords or codes lately (section 9). `cross_origin_refused` — see section 3 of the introduction."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "409":
          description: "`totp_already_enabled`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'

  /totp/disable:
    post:
      tags: [auth]
      operationId: disableTotp
      summary: "Two-factor: turn it off"
      description: |-
        Turns two-factor authentication off, with one real code from the authenticator app. The secret is erased.

        It is a `POST` with the code in the body, not a `DELETE` with the code in the address: a one-time code does not
        belong in a URL (it would be in the logs of every proxy), and `DELETE` takes no body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
      responses:
        "200":
          description: Two-factor authentication is off.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      totpState:
                        type: string
                        enum: [disabled]
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          description: "`unauthorized` — no valid token. `totp_invalid` — the code is wrong or expired."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: "`read_only_token` — the token is read-only. `account_locked` — too many wrong passwords or codes lately (section 9). `cross_origin_refused` — see section 3 of the introduction."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "409":
          description: "`totp_not_enabled`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'

  /account:
    get:
      tags: [account]
      operationId: getAccount
      summary: The account and its settings
      description: |-
        Who the user is and their settings, in one small call. Make it after the sign-in and again when the app comes
        back to the foreground: `method` and `temperatureTracking` tell you **which fields of a day to show**, so you
        need them before you can draw anything.

        The timeline is not here. The cycles (`allCyclesFirstDay`, `allPregnancyDates`) come with the days in
        `GET /timeline_sync`, and the address of the news banner with `GET /server_info`.

        ### Cheap to repeat: `ETag`

        The answer carries a weak `ETag`. Send it back in `If-None-Match` and an account that did not change answers
        `304`, with no body. (The `Cache-Control: no-store` of the API keeps a browser from doing this alone: a client
        that wants it keeps the value and sends it itself.)

        Nothing here is a secret: no password hash and no TOTP secret is ever returned.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` of the last answer.
          schema:
            type: string
      responses:
        "200":
          description: The account.
          headers:
            ETag:
              description: Weak entity tag of the answer.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Account'
        "304":
          description: Unchanged since the `ETag` given. No body.
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

    post:
      tags: [account]
      operationId: updateAccount
      summary: Change the settings, the login address, the password
      description: |-
        **Every setting of the logged-in account is changed here**: its nickname, method, preferences,
        the addresses and the password.

        **This is a partial update**: only the fields present in the body are touched, everything else keeps its
        value. (`POST /day/{date}`, on the contrary, replaces a whole day.) An empty object `{}` is valid and changes
        nothing. A field set to `null` is the same as a field that is not sent.

        ### Strict: a wrong request is refused, and told in full

        An **unknown** field, a **read-only** field of `GET /account` (`userId`, `inscriptionDate`, `oldestDay`, `totpState`) and a
        **wrong value** are all refused with `400 validation_failed`, with every problem in `details.issues`.
        Nothing is silently ignored, and nothing is changed when anything is wrong. See the introduction,
        "Errors that tell the whole story".

        `method` and `temperatureTracking` are two fields: send only the one you change, the other keeps the value
        the account has.

        ### What needs the password again

        Three changes hand the account, or its cycles, to someone else, so a session alone is not
        enough: send the **current password** as `password` in the same body.

        | Field | What it does | Also needs |
        |---|---|---|
        | `newPassword` | sets the new password, at once (10 to 72 bytes, different from the current one) | `logoutOtherDevices: true` closes the other sessions |
        | `notificationEmails` | the addresses that receive the finished cycles, the reminders and the warnings, with the login address. A string, `;` between two, 5 at most, `""` to empty it. Made at once; a notice goes to the login address | |
        | `loginEmail` | **asks** to change the address that signs in. Nothing changes yet: a link goes to the **new** address and the change happens when it is used (`POST /verify_email`, purpose `changeEmail`, 1 day); the old address is told | the TOTP `code` when the account has one |

        Without `password` the answer is `400` (issue `password_required`), with a wrong one `401`
        `invalid_password`, and **nothing is changed**: everything is checked before anything is written. Sending the
        value the account already has asks for no password (an unchanged `notificationEmails` is ignored; an
        unchanged `loginEmail` is refused, issue `email_unchanged`). The sessions that are open stay open
        when the login address changes. The two public demo accounts cannot change these three
        (`403` `demo_account`).

        A wrong password or code here counts against the account like a failed sign-in (section 9). Past the lockout
        threshold these three changes answer `403 account_locked`, even with the right password, until the failures age
        out; the other settings and the session itself are not affected.

        ### The response

        `data` is the account after the change, as `GET /account` shows it. `meta` says what happened:
        `fieldsUpdated` lists the settings that were written (`password` when `newPassword` was set; `loginEmail` is never
        in it, because it changes when the link is used), `loggedOutDevices` is there when `newPassword` was sent,
        `loginEmailLinkSent` when `loginEmail` was: `false` means the mail with the link could not be sent. The link
        also goes out for an address that another account has, as a mail telling its owner, with the same
        answer: nobody can tell who has an account.
      requestBody:
        required: true
        description: Every field is optional. `{}` is valid and changes nothing.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatch'
            examples:
              rename:
                summary: A setting
                value:
                  nickname: MB
              newPassword:
                summary: A new password, closing the other sessions
                value:
                  password: the current passphrase
                  newPassword: a new long passphrase
                  logoutOtherDevices: true
      responses:
        "200":
          description: Done. Read `meta.fieldsUpdated` to see what really changed — it can be empty.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Account'
                  meta:
                    $ref: '#/components/schemas/AccountPatchMeta'
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          description: |-
            `unauthorized` — no valid token.
            `invalid_password` — `password` is wrong. Nothing was changed.
            `totp_required` — `loginEmail` would change, the account has two-factor authentication on, and no `code` was sent.
            `totp_invalid` — `code` is wrong or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: |-
            `read_only_token` — the token is read-only.
            `demo_account` — `newPassword`, `notificationEmails` or `loginEmail` on one of the two public demo accounts.
            `account_locked` — `newPassword`, `notificationEmails` or `loginEmail` with too many wrong passwords or codes lately (section 9).
            `cross_origin_refused` — a browser page of another origin sent this write (see section 3 of the introduction).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'

  /account/deletion:
    post:
      tags: [account]
      operationId: deleteAccount
      summary: Delete the account, for good
      description: |-
        Deletes the account for real: its days, labels and tokens go with it (database cascade). It needs the
        password as confirmation. **It cannot be undone.**

        It is a `POST` on `/account/deletion`, not a `DELETE` on `/account`: a `DELETE` takes no body (many HTTP
        clients cannot send one), and the password has to travel somewhere.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                  description: The current password.
      responses:
        "204":
          description: The account is gone. The cookie is cleared.
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          description: "`unauthorized` — no valid token. `invalid_password` — the password is wrong: nothing was deleted."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: "`read_only_token` — the token is read-only. `account_locked` — too many wrong passwords or codes lately (section 9). `cross_origin_refused` — see section 3 of the introduction."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'

  /timeline_sync:
    get:
      tags: [timeline]
      operationId: getTimelineSync
      summary: What changed in the timeline since the last sync?
      description: |-
        Brings a local copy of the timeline up to date: the days written since `since`, every label, the cycles and the
        pregnancies. This is how several clients of the same account stay consistent without downloading the whole
        timeline each time. (The account's settings are not here: `GET /account`.)

        Read **section 8** of the introduction for the loop. In short:

        - take the cursor from `syncTimestamp` of the previous answer, **never from your own clock**; the very first call
          sends no `since` at all, which reads from the start;
        - the server subtracts a safety margin (120 seconds) and the bound is inclusive, so the
          last days come back again: **replace what you hold, do not append**;
        - a cleared day comes back empty, a deleted label is absent from `descriptions`, and a
          change of cycle start brings back the days that follow it.

        `days` is a flat array in date order. Each day is exactly what `GET /day/{date}` shows, `cycleStartDate` and
        `cycleDay` included. `descriptions` is exactly `GET /description`. `allCyclesFirstDay` and `allPregnancyDates`
        are **whole** every time (a few dozen dates): that is how a deletion reaches you.
      parameters:
        - name: since
          in: query
          required: false
          description: |-
            An RFC 3339 timestamp with a zone, normally the `syncTimestamp` of the previous call. **Leave it out
            (or empty) the first time**: the sync then starts at `1970-01-01T00:00:00Z` and returns the whole timeline.
            A zone is required (`Z` or `+02:00`, which is converted to UTC); a bare `2026-03-10 15:30:45` is refused.
            In a URL, write the `+` of an offset as `%2B`.
          schema:
            type: string
            format: date-time
          example: "2026-03-10T15:30:45Z"
      responses:
        "200":
          description: OK. `days` can be empty, which simply means "no day changed".
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TimelineSync'
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /day:
    get:
      tags: [timeline]
      operationId: listDays
      summary: Read several days
      description: |-
        Reads days from the timeline, **at most 100 per call** (a long list of dates makes a long URL). To read one
        day use `GET /day/{date}`; to read everything use `GET /timeline_sync`.

        ### Two ways to ask

        | Parameters | What you get |
        |---|---|
        | `dates=2026-03-10,2026-03-11` | exactly those dates, **one entry each, empty days included** (1 to 100, duplicates answered once) |
        | `from=2026-03-01&to=2026-03-31` | the days stored in that range, both ends **included** (at most 100 days from `from` to `to`) |

        `dates` and a range together, or neither, are refused (the message lists the accepted forms). The answer is a
        **flat array sorted by date, oldest first**, `[]` when nothing matched.

        A range only returns days that exist: it does not pad the gaps. `dates` gives you one entry per date you asked
        for, so a client can render any date without a special case. Days always come in **ascending date order**,
        whatever `timelineAscending` says in the account: that flag is only a display preference.
      parameters:
        - name: dates
          in: query
          required: false
          description: |-
            One to 100 dates `YYYY-MM-DD`, separated by commas. Spaces around them are allowed.
          schema:
            type: string
          example: "2026-03-10,2026-03-11"
        - name: from
          in: query
          required: false
          description: First date of the range, included. **Goes with `to`.**
          schema:
            type: string
            format: date
          example: "2026-03-01"
        - name: to
          in: query
          required: false
          description: Last date of the range, included. **Goes with `from`**, not before it, at most 100 days after it (both ends counted).
          schema:
            type: string
            format: date
          example: "2026-03-31"
      responses:
        "200":
          description: The days, oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Day'
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /day/{date}:
    get:
      tags: [timeline]
      operationId: getDay
      summary: Read one day
      description: |-
        Reads one day. **It never answers `404`**: a date with nothing stored is a full day object with empty values,
        so a client can render any date without a special case.

        ```json
        { "data": { "date": "2026-03-15", "stampColor": null, "isPeak": false, "comment": "", "...": null } }
        ```

        The day carries the computed `cycleStartDate` and `cycleDay`.
      parameters:
        - $ref: '#/components/parameters/DatePath'
      responses:
        "200":
          description: The day, empty when nothing is stored for the date.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Day'
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

    post:
      tags: [timeline]
      operationId: writeDay
      summary: Write one day (replaces the whole day)
      description: |-
        Creates or replaces one day. **The date is in the address** — there is no id to pass and no separate "create"
        and "update" call. Sending the same write twice is harmless.

        ### Read this before your first write

        **This is not a partial update.** The body must carry the *complete* state of the day.
        Any field you leave out is written as empty or `false`. There is no partial update of a day.

        ```
        correct:   GET the day -> change one field -> POST the whole object back
        wrong:     POST {"comment": "new"}     <- clears everything else
        ```

        The day you read can be sent back as it is: the fields the server computes (`cycleStartDate`, `cycleDay`,
        `lastWriteDb`) are **accepted and dropped**, and a `date` in the body must be the date of the address (else
        `date_mismatch`). Any other field the day does not have is refused (`unknown_field`, with a "did you mean"
        when it is close). A field set to `null` is the same as a field that is not sent.

        The response body is the day as the server stored it, including the computed
        `cycleStartDate` and `cycleDay`. Use it to refresh your local copy — you do not need a
        second `GET`. `201` (with a `Location`) when the day was new, `200` when it replaced one.

        ### Starting a cycle

        Send `cycleFirstDay: true`. That is the only thing needed. The server recomputes
        `cycleStartDate` and `cycleDay` for that day and for every later day, on every read.

        ### Free-text labels

        Names you put in `freeMucusSensation`, `freeMucusObservation` and `freeOther` are
        resolved for you: an existing name is reused, a new name is created. You do not need
        `POST /description` first. Sending a name that exists under another type links the
        existing label and keeps its original type.

        The day is the full state, so a label you do not send back is unlinked, `freeOther`
        included: read the day, change what you mean to, and send all of it. A client that does
        not know `freeOther` and omits it silently unlinks the day's untyped labels.

        ### Values are checked, not dropped

        A value the day cannot hold is refused with `400 validation_failed`, with **every** problem in
        `details.issues` (`field`, `code`, `message`): a `stampColor` outside Red / Green / Yellow / White, a
        `codifiedArrow` outside Up / Down / Right, a code outside the FertilityCare notation, a `temperature` that is
        not a number from 0 to 99.99 (`0` means none), a `counterStart` that is not a whole number from 0 to 255, a
        flag that is not `true` or `false`, a text over its limit. Nothing is stored when anything is wrong.

        ### A write that arrives late

        Two devices can write the same day, and one of them may have been offline: its change
        reaches the server after the other's. The write that was **made** last wins, whichever
        reaches the server last, and *made* is told by `lastWriteClientUtc`. A write whose
        `lastWriteClientUtc` is **older** than the one the stored day carries is refused with
        `409 stale_write`; nothing is stored. The same moment is accepted, so sending a write
        twice is harmless. When you get this answer, drop the change, `GET` the day again and show
        it to the user.

        `lastWriteClientUtc` is an RFC 3339 timestamp **with a zone**: `Z`, or an offset that is converted to UTC.
        A write that carries none is stamped with the server's clock, so it is never late. A stamp later than the
        server's clock does not shut other writers out: for this comparison a stored day is never taken to be later
        than the server's clock when it was written.

        ### Side effect

        Writing a day marks the account as active again. This matters because accounts with no
        activity for 4 years are deleted automatically.
      parameters:
        - $ref: '#/components/parameters/DatePath'
      requestBody:
        required: true
        description: The **complete** day, without its `date` (or with the date of the address). Everything is optional but omitting it clears it.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Day'
            examples:
              cervicalMucus:
                summary: Cervical mucus — first day of a cycle (POST /day/2026-03-10)
                value:
                  cycleFirstDay: true
                  stampColor: Red
                  freeMucusSensation: [dry]
                  comment: cramps in the morning
                  lastWriteClientUtc: "2026-03-10T07:12:00Z"
              cervicalMucusPeak:
                summary: Cervical mucus — peak day, with temperature (POST /day/2026-03-22)
                value:
                  stampColor: White
                  isPeak: true
                  freeMucusObservation: [stretchy]
                  temperature: 36.8
                  temperatureTime: "06:45:00"
              fertilityCare:
                summary: FertilityCare — codes (POST /day/2026-03-12)
                value:
                  stampColor: Green
                  codifiedMucusSensation: "10WL"
                  codifiedMucusObservation: CK
                  codifiedArrow: Up
      responses:
        "201":
          description: The day was new. `Location` is its address.
          headers:
            Location:
              description: "`/api/v2/day/{date}`."
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Day'
        "200":
          description: The day replaced the one stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Day'
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: "`read_only_token` — the token is read-only. `cross_origin_refused` — see section 3 of the introduction."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "409":
          description: "`stale_write` — this day was written more recently than this change (see \"A write that arrives late\"). Nothing was stored."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

    delete:
      tags: [timeline]
      operationId: deleteDay
      summary: Clear one day
      description: |-
        Clears a day: every field goes back to empty and the day's labels are unlinked. The row stays, empty, with the
        time it was cleared — that is how `GET /timeline_sync` tells the other clients that the day is gone.
        Clearing a date that was never written is a success (`204`).

        `lastWriteClientUtc` has the same meaning as on `POST /day/{date}`: a clear **made before** the last write of the day is
        refused with `409 stale_write`. A `DELETE` takes no body, so the stamp is a query parameter.
      parameters:
        - $ref: '#/components/parameters/DatePath'
        - name: lastWriteClientUtc
          in: query
          required: false
          description: When the clear was made, on your clock. RFC 3339 with a zone. The server's clock when absent.
          schema:
            type: string
            format: date-time
          example: "2026-03-10T15:30:45Z"
      responses:
        "204":
          description: The day is clear.
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: "`read_only_token` — the token is read-only. `cross_origin_refused` — see section 3 of the introduction."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "409":
          description: "`stale_write` — the day was written more recently than this clear. Nothing was cleared."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /description:
    get:
      tags: [timeline]
      operationId: listDescriptions
      summary: List the free-text labels
      description: |-
        Every label of the account, most used first (`useCount`: the number of days that carry it). A bare array.
      responses:
        "200":
          description: The labels.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Description'
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

    post:
      tags: [timeline]
      operationId: createDescription
      summary: Create a label
      description: |-
        Creates a label. You rarely need to: a name sent in a day is created for you (see `POST /day/{date}`). It exists
        for a picklist ("most used first") and to prepare labels before they are used.

        Names are **unique per account** and **case-sensitive**: a name that exists is `409 duplicate_name`. The type
        is `sensation` or `observation` (`undefined` is a label nobody classified yet: to classify
        one, `POST /description/{id}` it).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name:
                  type: string
                  maxLength: 256
                  example: stretchy
                type:
                  $ref: '#/components/schemas/DescriptionType'
                lastWriteClientUtc:
                  type: string
                  format: date-time
                  description: Your own clock, RFC 3339 with a zone. The server's clock when absent.
      responses:
        "201":
          description: Created. `Location` is its address.
          headers:
            Location:
              description: "`/api/v2/description/{id}`."
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DescriptionWritten'
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: "`read_only_token` — the token is read-only. `cross_origin_refused` — see section 3 of the introduction."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "409":
          description: "`duplicate_name` — a label of this account already has this name."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /description/{id}:
    post:
      tags: [timeline]
      operationId: updateDescription
      summary: Rename or retype a label
      description: |-
        Changes the `name` and / or the `type` of a label, **everywhere at once**: every day that carries it shows the new
        name or the new list (`freeMucusSensation` or `freeMucusObservation`) from then on, and comes back in the next
        `GET /timeline_sync`. Send at least one of the two; what you do not send stays.
      parameters:
        - $ref: '#/components/parameters/DescriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 256
                  example: very stretchy
                type:
                  $ref: '#/components/schemas/DescriptionType'
                lastWriteClientUtc:
                  type: string
                  format: date-time
                  description: Your own clock, RFC 3339 with a zone. The server's clock when absent.
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DescriptionWritten'
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: "`read_only_token` — the token is read-only. `cross_origin_refused` — see section 3 of the introduction."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: "`not_found` — no label of this account has this id."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "409":
          description: "`duplicate_name` — another label of this account already has this name."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

    delete:
      tags: [timeline]
      operationId: deleteDescription
      summary: Delete a label
      description: |-
        Deletes a label **and its links to the days**: the days that carried it lose it, and come back in the next
        `GET /timeline_sync` without it.
      parameters:
        - $ref: '#/components/parameters/DescriptionId'
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: "`read_only_token` — the token is read-only. `cross_origin_refused` — see section 3 of the introduction."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: "`not_found` — no label of this account has this id."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /export/{format}:
    get:
      tags: [files]
      operationId: exportFile
      summary: Export a period as NFP, CSV or PDF
      description: |-
        Downloads a period of the timeline as a file. Three formats, three purposes:

        | `format` (in the address) | Content type | Purpose |
        |---|---|---|
        | `nfp` | `application/json` | **Portable data.** The NFP file format, to move data to another app, and what `POST /import` reads. See the `NfpFile` schema. |
        | `csv` | `text/csv; charset=utf-8` | A spreadsheet, one row per day, for a quick look at the values. |
        | `pdf` | `application/pdf` | A printable chart, laid out for the account's method. |

        ### Reading errors from this endpoint

        A failure is the usual `error` envelope, in English, with a stable `code`: `validation_failed` (a missing or
        malformed date, a `from` after `to`, a format that is none, a parameter nobody reads), `no_data_in_period`
        (`404`: nothing is recorded between the two dates), `unauthorized` (`401`). A client that saves the file should
        check the status first: only a `200` is a file.

        ### Rules on the parameters

        - `from` and `to` are both **included**, and `from` may be equal to `to`: one day is a period.
        - The period must contain at least one recorded day, otherwise you get `404 no_data_in_period`.
        - For `nfp` the export is widened backwards to the **first day of the cycle**
          containing `from`, so a cycle is never exported cut in half. The `csv` and `pdf`
          formats use exactly the dates you asked for.
        - `anonymous=true` affects `pdf` and `nfp`: it leaves the user's name off the chart, and
          omits the `userInformation` block from the NFP file. The observations themselves are
          unchanged. This is what you want before sharing either with a practitioner. It is accepted, and
          does nothing, for `csv`.
        - `inline=true` only affects `nfp`: it returns indented JSON inline instead of
          triggering a file download. Useful for a quick look in a browser or in curl. Accepted, and
          without effect, for `csv` and `pdf`.

        ### What a CSV export contains

        One header row, then **one row per calendar day** of the period, oldest first. Every row
        has exactly as many fields as the header. The file is UTF-8 with a BOM, fields are
        separated by `;` (the server's `CSV_SEP`), quoted per RFC 4180, and lines end in CRLF —
        what Excel (French and English), LibreOffice, Google Sheets and text editors all read.

        The header names are the NFP day fields, or the API's day fields (`date`, `cycleDay`,
        `cycleFirstDay`) where NFP has none. The columns depend on the account's method:

        | `nfp_method` | Columns |
        |---|---|
        | 1, 2 (cervical mucus) | `date` `cycleDay` `cycleFirstDay` `mucusNotObserved` `stampColor` `stampBaby` `freeMucusSensation` `freeMucusObservation` [`temperature` `temperatureTime`] `isPeak` `counterStart` `sexUnion` `booleanPregnancyDetected` `comments` |
        | 3, 4 (FertilityCare) | `date` `cycleDay` `cycleFirstDay` `mucusNotObserved` `stampColor` `stampBaby` `codifiedBleedingObservation` `codifiedMucusSensation` `codifiedMucusObservation` `codifiedNumberObservations` `codifiedPainObservations` `codifiedArrow` [`temperature` `temperatureTime`] `isPeak` `sexUnion` `booleanPregnancyDetected` `comments` |

        - `temperature` and `temperatureTime` only for methods 1 and 4.
        - `comments` holds the day's comment, then the labels with no type yet (descriptions of
          type `undefined`, the `freeOther` of a `Day`), joined with `, ` and added after the
          comment with ` | ` between the two (`cramps | some text, another`). They never replace
          the comment, and have no column of their own. The PDF charts do the same in their comment column (cervical mucus) or cell
          (FertilityCare), and so does the NFP file, as one more entry of the day's `comments`.

        Values:

        - booleans are `1`, or empty for false;
        - lists (`freeMucusSensation`, `freeMucusObservation`) are joined with ` | `;
        - dates are `YYYY-MM-DD`, `temperatureTime` is `HH:MM`;
        - `temperature` has a decimal comma when the separator is `;` (`36,45`), a point otherwise;
        - `cycleDay` counts from the latest `cycleFirstDay` inside the period, and is empty before
          the first one;
        - FertilityCare codes are written as stored, `0` included;
        - a free-text cell (descriptions, `comments`) starting with `=`, `+`, `-`, `@`, a tab or a
          carriage return gets a leading `'`, so a spreadsheet does not run it as a formula.

        **Gaps.** A date with no recorded day, between the first and the last recorded day of the
        period, is a row with only `date` and `cycleDay`. Gaps are never written past today.

        **`mucusNotObserved` days.** That flag only means the mucus was not observed. On such a
        row the mucus columns are empty, even if old values are still stored for that day:
        `freeMucusSensation`, `freeMucusObservation`, `stampColor`, `stampBaby`,
        `codifiedBleedingObservation`, `codifiedMucusSensation`, `codifiedMucusObservation` and
        `codifiedNumberObservations`; the labels with no type yet are not added to `comments`.
        Every other column is filled as usual — `sexUnion`,
        `counterStart`, `isPeak`, `temperature`, `temperatureTime`, `codifiedPainObservations`,
        `codifiedArrow`, `booleanPregnancyDetected`, `comments`, `cycleFirstDay`. The NFP export
        writes both, as it is a data file. The PDF chart follows the same rule.

        ### What a PDF export contains

        A chart of the period. For cervical mucus self-observation, a table with one line per day and a header on every
        page: date, day of the cycle, stamp, peak, counter and union (only when the period has
        one), sensations, observations, comment (followed by the labels with no type yet, see the
        CSV), and for method 1 the temperature with its curve
        (only when the period has a reading). Every cycle starts a new page, and a long text wraps
        inside its column, or ends with an ellipsis past ten lines. A day not observed and a day
        never filled in both show a light grey `?` stamp. For FertilityCare, a grid of 35 days per
        row and one row per cycle. A day not observed still shows its union, counter, peak,
        temperature, pain codes, arrow and comment. The PDF is always sent as an attachment.

        The server setting `PDF_CERVICAL_MUCUS_BORDERS` (`Off`) draws the cervical mucus table with no line.

        ### What an NFP export contains

        `fileInformation` (this app and its version), `userMethodPreferences.preferredMethod`,
        `userInformation` unless `anonymous=true`, and the cycles of the period — split at each
        cycle first day, each one a full run of dates with gaps written as `{}`.

        Re-importing an exported file reproduces the account exactly, with three expected
        normalisations of the FertilityCare notation: `Br` is written `B`, `x1`/`x2`/`x3` are
        written uppercase, and `C/K` is written `CK`. The one other difference is the labels with
        no type yet (`freeOther`): the file has no field for them, so they are written in the
        day's `comments` and come back as part of the comment.

        This holds for every account, including ones carrying shapes the file format calls
        invalid — `POST /import` warns about those rather than refusing them, precisely so that
        what this app exports it can read back. See "A file from `GET /export/nfp` always
        imports" on `POST /import`.

        The response carries `Content-Disposition: attachment`, so a browser saves a file named
        `moncycle_app_<date>.<ext>` — except for `nfp` with `inline=true`.
      parameters:
        - name: format
          in: path
          required: true
          description: The file format.
          schema:
            type: string
            enum: [nfp, csv, pdf]
        - name: from
          in: query
          required: true
          description: First date, `YYYY-MM-DD`, included.
          schema:
            type: string
            format: date
          example: "2026-03-01"
        - name: to
          in: query
          required: true
          description: Last date, `YYYY-MM-DD`, included. Not before `from`.
          schema:
            type: string
            format: date
          example: "2026-03-31"
        - name: anonymous
          in: query
          required: false
          description: |-
            `pdf` and `nfp`. `true` = leave the user's name off the chart, and omit
            `userInformation` from the NFP file. `false`, `1` and `0` are read too.
          schema:
            type: boolean
            default: false
        - name: inline
          in: query
          required: false
          description: "`nfp` only. `true` = return indented JSON inline. `false` = download a `.nfp` file."
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The file.
          headers:
            Content-Disposition:
              description: "`attachment; filename=\"moncycle_app_<date>.<ext>\"`. Absent when `inline=true`."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NfpFile'
            text/csv:
              schema:
                type: string
                description: |-
                  UTF-8 with a BOM, `;`-separated, RFC 4180 quoting, CRLF line ends. One header
                  row of NFP field names, then one row per calendar day. See "What a CSV export
                  contains" above.
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: '#/components/responses/ValidationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: "`no_data_in_period` — there is no recorded day between `from` and `to`. `not_found` — no format in the address."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /import:
    post:
      tags: [files]
      operationId: importNfp
      summary: Import an NFP file into the account
      description: |-
        Reads an NFP file and writes its cycles into the logged-in account.

        It answers an `ImportReport` inside the standard `data` envelope, and reports failures with the
        standard `error` envelope. `dryRun=true` is a full preview: it reports what the write would do, down
        to which days the account already holds.

        The body is the NFP file itself, which is JSON: send it with
        `Content-Type: application/json`. Any other type is refused with `415`.

        ### All or nothing

        The file goes through four stages, and **nothing is written until every checking stage
        has passed**:

        | Stage | What it checks | Failure |
        |---|---|---|
        | 1 | size, UTF-8, JSON, nesting depth, `schemaVersion` | `413`, or `400` |
        | 2 | structure and types, against `NfpFile` (a wrong value in a field this app never stores is only a warning) | `400` `invalid_nfp_structure` |
        | 3 | real calendar dates, value ranges, text lengths, overlapping cycles | `400` `inconsistent_nfp_data` |
        | 4 | the write, inside one transaction | `500`, nothing committed |

        So a rejected file leaves the account exactly as it was, and an accepted file is
        imported whole.

        ### Days that already have data

        `override=false` (the default) leaves those dates untouched and lists them in `daysSkipped`.
        `override=true` replaces them whole — including their free-text labels — exactly like a
        `POST /day/{date}`, which also carries the full state of a day. Either way they are counted in
        `daysAlreadyInAccount`, and `dryRun=true` fills all three without writing, so the choice
        can be made with the dates in hand.

        A day the file leaves empty (`{}`) is a gap: it is not written, and it does not count as
        a conflict. The **first** day of each cycle is always written even when empty, because
        it is what marks the cycle boundary.

        ### Nothing is dropped silently

        This app does not record everything the format can describe, so every answer reports
        what became of the rest — see `ImportReport`:

        - `ignoredFields` — carried by the file, nowhere to put it here (cervix observations,
          `codifiedEvents`, `babyFeedCount`, `codifiedManualFertility`, ...).
        - `mappedFields` — stored, but less precisely than the file said (a `symptothermic_fr`
          bleeding value becomes a Red stamp; `sexUnion: "ReservedUnion"` becomes a plain
          union).
        - `warnings` — accepted and imported, but worth showing the user: a cycle whose
          `method` differs from the account's, or one of the file shapes listed under
          "A file from `GET /export/nfp` always imports" below.

        A cycle of **any** `method` imports, `symptothermic_fr` included: the fields every
        method shares are kept, and the rest is reported.

        ### A file is read kindly

        The aim is that a file imports whenever nothing it holds can break the account, so the
        following are read, never refused, and the first two are reported in `warnings`:

        - **`null`** is a field that is not set, wherever it is written. One warning per field
          (`[cycles[].days[].temperature] null on 41 entries: read as not set.`), not one per day.
          A `null` in the list of `days` is a day with nothing on it: it keeps its place, so
          the days after it keep their dates.
        - **A wrong value in a field this app never stores** (`userInformation`,
          `userMethodPreferences`, and the day and cycle fields listed in `ignoredFields`): an
          identifier written as a number, a birth date as a year, `babyFeedCount` as text. The
          schema's message is the warning, and the field is ignored.
        - **FertilityCare notes written as numbers**: `codifiedNumberObservations` `1`, `2`,
          `3` (or `"1"`...) is read as `x1`, `x2`, `x3`, and `codifiedMucusSensation` `0`, `2`,
          `4` ... `10` as the string of the same number. A number that is no code of the note
          (`7`) goes to `ignoredFields`, like any other code this app does not store.

        What is still refused: a wrong value in a field this app **does** store (`temperature`
        as text, a `stampColor` outside the enumeration), a missing `schemaVersion`,
        `fileInformation`, `cycles`, or a cycle's `method`, `cycleStartDate` and `days`.

        ### What an import never changes

        `userInformation` and `userMethodPreferences` are read but **never applied**. A file
        cannot rename the account, change its address, or switch its method — that is what
        `POST /account` is for. Both appear in `ignoredFields`.

        ### A file from `GET /export/nfp` always imports

        Whatever this app writes, it reads back. That is a property the endpoint is built to
        hold, not a coincidence: anything `/export` can emit and the import would rather not
        see is reported in `warnings` and imported anyway, never refused. Re-importing an
        export over its own account with `override=1` leaves that account byte-identical, except
        for its labels with no type yet (`freeOther`): the file has no field for them, so an
        export writes them as the last entry of the day's `comments`, and they come back as
        part of the day's comment, no longer linked as labels.

        It is why several things the format calls invalid are only warned about here. The
        account is the source of truth, and `day_timeline` has no rule against them:

        - `mucusNotObserved` alongside an observation, a stamp or a label. The format calls
          these incompatible; the column does not, so both are kept as the account had them.
        - more than 20 free-text labels on a day — nothing caps how many a day is linked to.
        - more than 400 days in a cycle. A cycle runs until the next first day is marked, so
          an account left alone for a year exports one cycle padded with gaps to today.
        - more than 120 cycles, or 4000 days, in one file. `/export` is bounded by the date
          range asked for, not by these.
        - a temperature the column holds (`0.00`–`99.99`) but a body does not reach
          (under 30 °C or over 45 °C), and a `temperatureTime` that is not a time of day —
          `time_temp_taken` is a `TIME`, which MariaDB lets run past `23:59:59`. The reading
          is kept; only the unreadable hour is dropped.

        ### Hard limits

        These refuse the file, because the value cannot be stored at all. Rejected with `400`,
        or `413` for the first:

        - **256 KB** per request (262144 bytes, the `Content-Length`: a larger body is refused
          before the application starts, with this same `413 file_too_large`; the server's
          `post_max_size`, and raising it means raising `memory_limit` too). This is the one limit
          that bounds the work: stages 1 and 2 decode and validate the whole body before any
          count above is looked at. It holds for every endpoint of the API, not only this one.
        - 256 characters per label and per joined comment — `varchar(256)` either way.
        - 32 characters for the packed FertilityCare notes of a day — `varchar(32)`. The
          widest note set the app can write packs to 18, so `/export` cannot reach this.
        - a temperature outside `0.00`–`99.99`, which `decimal(4,2) unsigned` cannot hold.

        Dates must be real calendar dates, no earlier than `1900-01-01`, and not in the future
        (one day of slack, for a client in a timezone ahead of the server). Two cycles covering
        the same date reject the file, since the day would belong to both — `/export` never
        writes overlapping cycles.
      parameters:
        - name: override
          in: query
          required: false
          description: |-
            `false` (`0`) leaves dates that already have data alone and reports them in `daysSkipped`.
            `true` (`1`) replaces them. It is read on a dry run too, which answers the lists the way the
            value given would have them.
          schema:
            type: boolean
            default: false
        - name: dryRun
          in: query
          required: false
          description: |-
            `true` (`1`) answers what a real import would do, **without writing anything**.

            Every check runs, and the account is read to resolve what stage 4 would otherwise
            only discover as it writes, so the report is the one the real run would answer —
            same `daysCreated` / `daysOverwritten` / `daysSkipped` / `descriptionsCreated`,
            for the `override` that was sent, plus `daysAlreadyInAccount` which does not depend
            on it. Only `daysWritten` is absent, because nothing was.

            A dry run that is **refused** also answers with everything the checks found and not
            just the first thing that rejects the file: `error.details` carries the `warnings`,
            `mappedFields` and `ignoredFields` of an accepted answer, and
            `duplicatedDaysInFile` listing the dates two cycles of the file share. See the
            `400` response.

            So: send `dryRun=true` to show the user what is at stake and let them decide on
            `override`, then send the same file again without it.
          schema:
            type: integer
            enum: [0, 1]
            default: 0
        - name: lastWriteClientUtc
          in: query
          required: false
          description: |-
            The client's UTC clock, ISO 8601, recorded on every day the import writes.
            Defaults to the server's time.
          schema:
            type: string
            format: date-time
          example: "2026-03-31T18:04:22Z"
      requestBody:
        required: true
        description: The content of an `.nfp` file, as a JSON body.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NfpFile'
      responses:
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "403":
          $ref: '#/components/responses/CrossOriginRefused'
        "200":
          description: |-
            The file was accepted. On a dry run nothing was written; otherwise the days in
            `daysCreated` and `daysOverwritten` are now in the account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ImportReport'
        "400":
          description: |-
            The file was rejected and **nothing was written**. `error.code` says which stage
            refused it:

            | `code` | Meaning |
            |---|---|
            | `validation_failed` | a query parameter is wrong: unknown, `override` or `dryRun` not `true`/`false`/`1`/`0`, a `lastWriteClientUtc` that is no timestamp (see `error.details.issues`) |
            | `empty_body` | no request body |
            | `invalid_encoding` | the body is not valid UTF-8 |
            | `invalid_json` | not JSON, too deeply nested, or the top level is not an object |
            | `missing_schema_version` | `schemaVersion` absent or empty |
            | `invalid_schema_version` | `schemaVersion` is not a number like `1.0` |
            | `unsupported_schema_version` | a version this build does not implement |
            | `invalid_nfp_structure` | fails the `NfpFile` schema |
            | `inconsistent_nfp_data` | valid JSON, impossible contents |

            `invalid_nfp_structure` and `inconsistent_nfp_data` carry `error.details.issues`:
            one line per problem, `[where] what is wrong`, with `where` a path inside the file
            (`cycles[0].days[7].temperature`) or the date of the day. Capped at 50 lines, with
            `error.details.issueCount` giving the true total. Built to be shown as is.

            On a **dry run**, `inconsistent_nfp_data` carries the rest of the diagnosis as
            well, since that is what was asked for: `duplicatedDaysInFile` (the dates two
            cycles of the file share — the commonest reason a file is refused, and the one the
            user can act on), plus `warnings`, `mappedFields`, `ignoredFields`, `cyclesRead`
            and `daysRead`, each as described in `ImportReport`. A real run answers `issues`
            and `issueCount` alone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: inconsistent_nfp_data
                  message: The file is valid JSON but its contents are inconsistent.
                  details:
                    issues:
                      - "[2026-03-14] temperature 52.4 is outside the plausible range 30.0-45.0 C."
                      - "[cycles[1]] 2026-03-20 appears twice in the file (also in cycles[0]): the cycles overlap."
                    issueCount: 2
        "401":
          $ref: '#/components/responses/Unauthorized'
        "405":
          description: "`method_not_allowed` — only `POST`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "413":
          description: |-
            `file_too_large` — the body is over the server's `post_max_size`, so it never
            reached the application. Split the file into fewer cycles. The message quotes the
            size and the limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /all_of_my_data_plz:
    get:
      tags: [files]
      operationId: getRawData
      summary: Download everything (GDPR)
      description: |-
        Returns **all** data held about the logged-in account, as one CSV file. This covers the
        GDPR right of access, and it is also the right thing to offer a user before
        `POST /account/deletion`.

        The file is not a clean table. It is three blocks, one after another, each with its own
        header row:

        1. the account record;
        2. the authentication tokens (one row per device);
        3. every recorded day.

        Columns are the **internal database column names**, in French in places, and the
        separator is `;` by default. The file starts with a UTF-8 BOM so that Excel opens
        accented characters correctly.

        Secrets are masked, not exported: the password hash, the TOTP secret and the token
        strings appear as `abc [masqué] xyz`.

        This is a human-readable dump for the user, not a machine format. To move data to
        another app, use `GET /export/nfp`.
      responses:
        "200":
          description: The CSV file.
          headers:
            Content-Disposition:
              description: '`attachment; filename="export_moncycle_app.csv"`'
              schema:
                type: string
          content:
            application/csv:
              schema:
                type: string
                format: binary
        "401":
          description: "Not authenticated. No body, and a `Location: auth` header."

# =============================================================================
# COMPONENTS
# =============================================================================

components:

  responses:

    Unauthorized:
      description: |-
        `unauthorized` — no token, an unknown token, or the account is deactivated. Send the user
        back to `POST /token`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: unauthorized
              message: Authentication required.

    UnsupportedMediaType:
      description: |-
        `unsupported_media_type` — the body was not sent as `Content-Type: application/json`
        (a form and `text/plain` are what a page of another site can send without asking the
        browser's leave). Nothing was read.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: unsupported_media_type
              message: "The body must be sent as 'Content-Type: application/json'."

    CrossOriginRefused:
      description: |-
        `cross_origin_refused` — a browser sent this write from a page whose origin is not the
        server's own, `APP_URL`'s or one of `WEB_APP_ORIGINS` (the `Origin` header, or
        `Sec-Fetch-Site` when there is none). Nothing was read or done. A client that sends
        neither header is never refused for this.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: cross_origin_refused
              message: This request comes from a page that is not allowed to write to this API.

    ValidationFailed:
      description: |-
        `validation_failed` — the request says something the server cannot accept: an unknown field, a value of the wrong
        type or out of range, a date that is not one, a body on a request that takes none... **Every** problem found is in
        `error.details.issues`, with the field it is about, a stable `code` and a message in English (see the introduction,
        "Errors that tell the whole story"). Nothing was done.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorEnvelope'
          example:
            error:
              code: validation_failed
              message: "The request is not valid: 2 problems (see details.issues). First: Unknown field 'stampColour'. Did you mean 'stampColor'?"
              details:
                issues:
                  - field: stampColour
                    code: unknown_field
                    message: "Unknown field 'stampColour'. Did you mean 'stampColor'?"
                  - field: temperature
                    code: wrong_type
                    message: "'temperature' must be a decimal number, got string."

    MethodNotAllowed:
      description: "`method_not_allowed` — this address does not take this method. The `Allow` header lists the ones it takes."
      headers:
        Allow:
          description: The methods this address takes, for example `GET, POST`.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: method_not_allowed
              message: "Method PATCH is not supported here. Supported: GET, POST."

    NotFound:
      description: "`not_found` — this address does not exist (an unknown path after the name of the endpoint)."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: not_found
              message: This URL does not exist.

    ServiceUnavailable:
      description: |-
        `maintenance` — the operator put the server in maintenance; nothing was read or done, try again later.
        `schema_mismatch` — the database is not at the version this code needs; nothing works until the operator runs
        the migrations. `GET /server_info` says whether it is the first (`maintenanceMode`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: maintenance
              message: The server is under maintenance. Try again later.

  parameters:

    DatePath:
      name: date
      in: path
      required: true
      description: A real calendar date, `YYYY-MM-DD`. It is the identifier of the day.
      schema:
        type: string
        format: date
      example: "2026-03-10"

    DescriptionId:
      name: id
      in: path
      required: true
      description: The `id` of a label, as `GET /description` gives it (a whole number from 1).
      schema:
        type: integer
        minimum: 1
      example: 58

    TokenPrefix:
      name: prefix
      in: path
      required: true
      description: "The first 5 characters of a token (`prefix` in `GET /token`): letters and digits."
      schema:
        type: string
        pattern: '^[A-Za-z0-9]{5}$'
      example: aB3x9

  schemas:

    Error:
      type: object
      description: The content of the `error` key. See introduction, section 2.
      required: [code, message]
      properties:
        code:
          type: string
          description: |-
            A stable slug, meant for your program. It does not change, so you can branch on it
            safely. Each endpoint lists the codes it can return.

            Codes you may meet anywhere: `unauthorized` (no valid token), `validation_failed` (the request
            says something the server cannot accept: see `details.issues`), `invalid_json` (the body
            is not a JSON object), `method_not_allowed`, `not_found`, `schema_mismatch` (status `503`), `unexpected_error` (a server fault — retry, then report it with
            the `X-Request-Id` of the response), `maintenance` (the server is in maintenance, status
            `503`: nothing was read or done, try again later).
          example: invalid_credentials
        message:
          type: string
          description: |-
            A sentence in English for a human. Log it, or show it. **Never parse it** — the wording
            can change at any release.
          example: Incorrect password or non-existent account.
        details:
          type: object
          description: |-
            Optional extra context. For example `POST /token` adds `captchaRequired: true`, and
            `/register` adds `userId` on `already_authenticated`.
          additionalProperties: true

    ErrorEnvelope:
      type: object
      description: Every failure of a JSON endpoint looks like this.
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'

    TokenRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: The login address of the account. Not case-sensitive, spaces around it are ignored.
          example: demo.mucus.self.obs@moncycle.app
        password:
          type: string
          format: password
          description: The account password.
          example: demo
        name:
          type: string
          maxLength: 256
          description: |-
            What the token is called in `GET /token`. One line (control characters are dropped, runs of
            spaces and line breaks become one space). Absent or empty: `API`.
          example: backup script
        scope:
          type: string
          enum: [readWrite, readOnly]
          default: readWrite
          description: "`readOnly` can read and end its own session, and do nothing else."
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
          description: |-
            The token dies this many days from now, whatever its use. Absent: it is erased after 40 days
            without use or a year after its creation.
          example: 90
        cookie:
          type: boolean
          default: false
          description: "`true`: the server also sets the token as the `MONCYCLEAPP_TOKEN` cookie. The token is in the answer either way."
        code:
          type: integer
          description: |-
            The 6-digit TOTP code. Required only once a sign-in answered `401 totp_required` — that
            is, only for accounts where two-factor is active. Sent as a number or as a string: a
            leading zero lost on the way (`91710` for `091710`) is restored.
          example: 492013
        captcha:
          type: string
          description: |-
            The answer to the picture from `POST /captcha` (purpose `login`). Required only once a sign-in
            answered `403 captcha_required`, or once a response carried `captchaRequired: true`.
            Upper or lower case, and spaces, make no difference.
          example: ak7fpm
        captchaToken:
          type: string
          description: |-
            The `token` that goes with that picture. It is tied to the account's failure counters:
            after a refused attempt, ask for a new one.
          example: 1790000000.9f2c6b1e0d4a8f7c3b5e2a1d9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b

    Token:
      type: object
      description: A token of the account, as `GET /token` and `POST /token` show it. The token itself is not part of it.
      properties:
        prefix:
          type: string
          nullable: true
          description: |-
            The first 5 characters of the token: they tell the tokens of one app apart, and `DELETE /token/{prefix}` names a token by them.
            Unique within the account. `null` for a token whose first characters another token of the account shares
            (it can only be revoked with `all`).
          example: aB3x9
        name:
          type: string
          description: What the client called it. The client's word, not a proof.
          example: WEB-APP moncycle.app
        scope:
          type: string
          enum: [readWrite, readOnly]
        current:
          type: boolean
          description: "`true` for the token of the request."
        createdAt:
          type: string
          format: date-time
        createdUserAgent:
          type: string
          nullable: true
          description: The `User-Agent` the server received when the token was made (255 characters at most).
        createdIp:
          type: string
          nullable: true
          description: The network of the address the token was made from, `a.b.c.0` (IPv4) or the first 48 bits (IPv6, `2001:db8:1234::`). The server keeps the whole address.
          example: 203.0.113.0
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: "`null` for a token never used. Written at most every 5 minutes."
        lastUsedUserAgent:
          type: string
          nullable: true
        lastUsedIp:
          type: string
          nullable: true
          description: Like `createdIp`, for the last use.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: |-
            The day the token dies: the date asked for with `expiresInDays`, else a year after `createdAt`
            (a token without a date is also erased after 40 days without use).

    Account:
      type: object
      description: |-
        The account and its settings, as `GET /account` shows them (and `POST /account` answers). `userId`, `inscriptionDate`, `oldestDay` and
        `totpState` are read-only: sent in a `POST /account`, they are refused.
      properties:
        userId:
          type: integer
          example: 42
        loginEmail:
          type: string
          format: email
          description: The login address.
        notificationEmails:
          type: string
          nullable: true
          description: The addresses that also receive the cycles, the reminders and the warnings by email, separated by `;`. Empty or `null` when there is none.
          example: partner@example.org;mother@example.org
        method:
          type: string
          enum: [cervicalMucus, fertilityCare]
          description: The tracking method. It decides which fields of a day to display.
        temperatureTracking:
          type: boolean
          description: Does the user also record basal body temperature?
        birthYear:
          type: integer
          description: Year of birth, approximate, used for anonymous statistics.
          example: 1994
        nickname:
          type: string
          description: The user's nickname, their initials for instance (the app does not collect the identity of its users).
          example: MB
        inscriptionDate:
          type: string
          format: date-time
          description: When the account was created, UTC.
          example: "2024-06-14T09:21:03Z"
        oldestDay:
          type: string
          format: date
          nullable: true
          description: The date of the oldest day the account holds, `null` when it holds none. Read-only. An export asked from an earlier date starts there anyway.
          example: "2023-11-02"
        sponsor:
          type: boolean
          description: Is this account a financial supporter of the project?
        research:
          type: boolean
          description: Has the user agreed to contribute anonymous data to research?
        timelineAscending:
          type: boolean
          description: |-
            Display preference: `true` puts today at the top of the table. The API itself always
            returns days in ascending date order.
        autoMailExport:
          type: boolean
          description: |-
            Is the export of each finished cycle sent by email (PDF, CSV and NFP file)? `true` by
            default.
        totpState:
          type: string
          enum: [never_used, disabled, init, active, unknown]
          description: |-
            Where the account stands with two-factor authentication.

            | Value | Meaning |
            |---|---|
            | `active` | On. `POST /token` needs a `code`. |
            | `init` | `POST /totp` was called but never confirmed. Login still works with the password alone. |
            | `disabled` | It was on, and the user turned it off. |
            | `never_used` | Never set up. |
            | `unknown` | No state stored. A brand-new account reports this; treat it exactly like `never_used`. |
        lastWriteClientUtc:
          type: string
          format: date-time
          nullable: true
          description: When the account settings were last written, from the client clock. `null` if never.

    Day:
      type: object
      description: |-
        One day of the timeline — the central object of this API. Used by `GET /day`,
        `GET /day/{date}`, `POST /day/{date}` and `GET /timeline_sync`.

        **On write, send the whole object.** Any field you leave out is cleared. See
        `POST /day/{date}`. The read-only fields below can be left in when you send a day back: they are dropped.

        Three groups of fields:

        - **read-only**, computed by the server: `cycleStartDate`, `cycleDay`, `lastWriteDb`;
        - **common** to both methods: the stamp, `isPeak`, `cycleFirstDay`, `sexUnion`,
          `temperature`, `comment`…;
        - **method-specific**: `freeMucus*` and `freeOther` for the `cervicalMucus` method, `codified*` for
          FertilityCare.

        Sending a field from the other method is not an error, but the app will not display it.
      required: [date]
      properties:

        date:
          type: string
          format: date
          description: |-
            `YYYY-MM-DD`. This is the identifier of the day. On write it is the date of the address
            (`POST /day/{date}`): leave it out of the body, or send the same date (else `date_mismatch`).
          example: "2026-03-10"

        cycleStartDate:
          type: string
          format: date
          nullable: true
          readOnly: true
          description: |-
            **Read-only, computed.** The first day of the cycle this date belongs to: the closest
            day at or before it with `cycleFirstDay: true`. `null` when no cycle has started yet.
          example: "2026-03-10"
        cycleDay:
          type: integer
          nullable: true
          readOnly: true
          description: |-
            **Read-only, computed.** Position of this date inside its cycle, starting at `1`.
            `null` when `cycleStartDate` is `null`.
          example: 1

        cycleFirstDay:
          type: boolean
          default: false
          description: |-
            `true` marks this date as **day 1 of a new cycle**. This single flag is how cycles exist
            in this API — see introduction, section 1. Setting it back to `false` merges the cycle
            into the previous one.
        dayNotObserved:
          type: boolean
          default: false
          description: |-
            The user explicitly recorded **no observation** for this date. Different from a date
            with no data at all: this one says "I looked and I have nothing to note".

        stampColor:
          type: string
          nullable: true
          enum: [Red, Green, Yellow, White]
          description: |-
            The colour of the stamp on the chart. An unknown value is silently dropped.

            Known limit: `"White"` together with `stampBaby: false` cannot be stored. Both "white
            stamp" and "no stamp" use the same empty code in the database, and both read back as
            `null`. This app has never had a distinct code for a plain colourless stamp.
        stampBaby:
          type: boolean
          default: false
          description: A baby picture on top of the stamp, marking a potentially fertile day.

        isPeak:
          type: boolean
          default: false
          description: |-
            Peak day: the last day with the most fertile type of mucus. A cycle **can** have more
            than one, so do not assume it is unique.
        counterStart:
          type: integer
          nullable: true
          description: |-
            Start a visible counter on this day and show it for this many days. A value of `0` or
            less is stored as `null`. Keep it small — the stored range is 0 to 255.
          example: 3

        sexUnion:
          type: boolean
          default: false
          description: Sexual intercourse on this date.
        booleanPregnancyDetected:
          type: boolean
          default: false
          description: A pregnancy was detected on this date. These dates are also listed in `GET /timeline_sync` (`allPregnancyDates`).

        freeMucusSensation:
          type: array
          description: |-
            **Cervical mucus only.** What the user *feels*, as free-text labels, for example `["dry"]`.

            A name that does not exist yet is created for you. A name that already exists under
            `freeMucusObservation` is reused and keeps its original type — names are unique per
            account whatever their type. Names are case-sensitive.

            In the NFP **file** format these labels are an array too; `POST /import` also reads
            the form older files use, one comma-joined string.
          items:
            type: string
            maxLength: 256
          example: [dry, slippery]
        freeMucusObservation:
          type: array
          description: "**Cervical mucus only.** What the user *sees*, as free-text labels. Same rules as `freeMucusSensation`."
          items:
            type: string
            maxLength: 256
          example: [clear and stretchy]
        freeOther:
          type: array
          description: |-
            **Cervical mucus only.** Labels with no type yet. Classify them with `POST /description/{id}`.

            Always present on read, empty when the day has none. On write it is part of the full
            state of the day like the two other lists: leave it out and these labels are unlinked.
          items:
            type: string
            maxLength: 256
          example: []

        temperature:
          type: number
          format: float
          nullable: true
          description: |-
            Basal body temperature. A value of `0` or less is stored as `null`. Stored with 2
            decimals, so the range is 0.00 to 99.99 — the unit is whatever the user records,
            usually °C.
          example: 36.75
        temperatureTime:
          type: string
          nullable: true
          description: |-
            When the temperature was taken, `hh:mm:ss`. **Ignored unless a valid `temperature` is
            sent in the same request.**
          example: "06:45:00"

        codifiedBleedingObservation:
          type: string
          nullable: true
          description: |-
            **FertilityCare only.** One of `VH`, `H`, `M`, `VL`, `B`, with an optional `L` suffix for
            spotting (for example `BL`), or `L` alone for spotting only.
          example: BL
        codifiedMucusSensation:
          type: string
          nullable: true
          description: "**FertilityCare only.** One of `0`, `2`, `2W`, `4`, `6`, `8`, `10`, `10DL`, `10SL`, `10WL`."
          example: "10"
        codifiedMucusObservation:
          type: string
          nullable: true
          description: "**FertilityCare only.** Any combination of `C`, `G`, `K`, `P`, `Y`, `L`."
          example: KL
        codifiedNumberObservations:
          type: string
          nullable: true
          description: "**FertilityCare only.** One of `X1`, `X2`, `X3`, `AD`."
          example: X2
        codifiedPainObservations:
          type: string
          nullable: true
          description: "**FertilityCare only.** One of `AP`, `RAP`, `LAP`."
          example: AP
        codifiedArrow:
          type: string
          nullable: true
          enum: [Up, Down, Right]
          description: "**FertilityCare only.** The arrow drawn on the chart. An unknown value is stored as `null`."

        comment:
          type: string
          maxLength: 256
          default: ""
          description: A free note from the user. Read back as `""` when empty, never `null`.
          example: cramps in the morning

        lastWriteClientUtc:
          type: string
          format: date-time
          nullable: true
          description: |-
            Your own clock, RFC 3339 with a zone (`Z` or an offset, converted to UTC). The server uses its own clock if
            this is absent or outside what it can store; a value that is not a timestamp is refused. It decides which of
            two writes of a day is the latest; `GET /timeline_sync` does not use it.
          example: "2026-03-10T07:12:00Z"
        lastWriteDb:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: |-
            **Read-only.** The server clock at the last write of the day, or of a label it
            carries. `GET /timeline_sync` selects days on this field.
          example: "2026-03-10T07:12:03Z"

    Description:
      type: object
      description: A reusable free-text label, as returned by `GET /description` and `GET /timeline_sync`.
      properties:
        id:
          type: integer
          description: The identifier. Days point at the label by this id, so a rename applies everywhere.
          example: 58
        name:
          type: string
          maxLength: 256
          description: The label text. Unique per account, case-sensitive.
          example: clear and stretchy
        type:
          type: string
          enum: [undefined, observation, sensation]
          description: |-
            `sensation` = what the user feels. `observation` = what the user sees. `undefined` =
            neither was recorded.
        useCount:
          type: integer
          description: How many days are linked to this label right now. `0` means unused, so safe to delete.
          example: 12

    DescriptionWritten:
      type: object
      description: |-
        What `POST /description` and `POST /description/{id}` return. It is the same label as `Description`, but with
        `lastWriteClientUtc` instead of `useCount`. Call `GET /description` when you need the
        counts.
      properties:
        id:
          type: integer
          example: 58
        name:
          type: string
          description: The stored name, with leading and trailing spaces removed.
          example: clear and stretchy
        type:
          type: string
          enum: [undefined, observation, sensation]
        lastWriteClientUtc:
          type: string
          format: date-time
          description: The timestamp that was stored, whether it came from you or from the server.
          example: "2026-03-10T15:30:45Z"

    NfpFile:
      type: object
      description: |-
        The **NFP file format**: a portable JSON file for moving cycle data between NFP apps.
        Produced by `GET /export/nfp`, read and written by `POST /import`.

        It is not the live API shape, and it carries its own version number, independent of the
        app version. Only `schemaVersion` `"1.0"` is supported.

        ### Reading older files

        Three variants of version 1.0 are in circulation. `POST /import` accepts all three;
        `GET /export/nfp` always writes the first.

        | | current | early draft | moncycle.app 14 |
        |---|---|---|---|
        | writing app | `fileInformation` object | flat `source_app`, `source_app_version`, `file_creation_timestamp` | as the draft |
        | user block | `userInformation` object | positional array `[id, email, firstName, lastName, birthDate]` | as the draft |
        | preferred method | `preferredMethod` | `preferedMethod` (one `r`) | `preferedMethod` |
        | day note | `comments` array | `comment` string | `comment` string |
        | empty day | `mucusNotObserved` | `dayNotObserved` | `dayNotObserved` |
        | free-text labels | arrays | arrays | **comma-joined strings** |
        | `sexUnion` | enum string | enum string | **boolean** |
        | flags | real booleans | strings `"true"`/`"false"` | real booleans |

        Older spellings are normalised on the way in, so they never reach the live API.
      required: [schemaVersion, fileInformation, cycles]
      properties:
        schemaVersion:
          type: string
          pattern: '^[0-9]+\.[0-9]+$'
          description: Version of this file format. Must be `"1.0"`.
          example: "1.0"
        fileInformation:
          $ref: '#/components/schemas/NfpFileInformation'
        userInformation:
          $ref: '#/components/schemas/NfpUserInformation'
        userMethodPreferences:
          $ref: '#/components/schemas/NfpUserMethodPreferences'
        cycles:
          type: array
          minItems: 1
          maxItems: 120
          description: The cycles, in order.
          items:
            $ref: '#/components/schemas/NfpCycle'

    NfpFileInformation:
      type: object
      description: Which app wrote the file, and when.
      required: [sourceApp, sourceAppVersion, fileCreationTimestamp]
      properties:
        sourceApp:
          type: string
          maxLength: 255
          description: The app that wrote the file.
          example: moncycle.app
        sourceAppVersion:
          type: string
          maxLength: 64
          description: The version of that app.
          example: "15dev"
        fileCreationTimestamp:
          type: string
          maxLength: 64
          description: |-
            When the file was written, ISO 8601 with a timezone. A bare `YYYY-MM-DD hh:mm:ss`
            (what the early draft used) is also accepted and converted.
          example: "2026-03-31T18:04:22+02:00"

    NfpUserInformation:
      type: object
      description: |-
        Who the data belongs to. Every field is optional.

        **On import this block is read but never applied**: a file cannot rename the account,
        change its address or alter its identity. It is reported in `ignoredFields`.

        On export it is omitted entirely when `anonymous=1`.
      properties:
        identifier:
          type: string
          maxLength: 255
          description: The writing app's own id for the user. moncycle.app writes the account id.
          example: "1042"
        email:
          type: string
          maxLength: 255
          example: jane@example.org
        firstName:
          type: string
          maxLength: 255
          example: Jane
        lastName:
          type: string
          maxLength: 255
        birthDate:
          type: string
          maxLength: 32
          description: |-
            `YYYY-MM-DD`. moncycle.app never writes this field: it only stores a birth *year*
            (`birthYear` on `/account`), and a full date would mean inventing a day and month.
          example: "1995-12-31"
        comment:
          type: string
          maxLength: 1024

    NfpUserMethodPreferences:
      type: object
      description: |-
        The user's method settings. Advisory: it has no effect on whether a file is valid, and
        the per-cycle `method` is what decides how a cycle is read.

        **On import this block is read but never applied** — the account's method is only
        changed from `POST /account`. It is reported in `ignoredFields`.
      properties:
        preferredMethod:
          type: string
          maxLength: 64
          description: "`cervicalMucus`, `fertilityCare`, `symptothermic_fr`, or another app's own value."
          example: cervicalMucus
        twoTenthShift:
          type: boolean
          description: Not recorded by this app.
        oestrogenicalHollow:
          type: boolean
          description: Not recorded by this app.
        irregularitiesSensibility:
          type: boolean
          description: Not recorded by this app.

    NfpCycle:
      type: object
      description: |-
        One cycle. Unlike the live API, the file records the `method` **per cycle**, so a user
        who changed method keeps a correct history.
      required: [method, cycleStartDate, days]
      properties:
        method:
          type: string
          maxLength: 64
          description: |-
            The method used for this cycle: `cervicalMucus`, `fertilityCare` or `symptothermic_fr`
            (case-insensitive), or an app's own value.

            This app records `cervicalMucus` and `fertilityCare`. A cycle of any other method still
            imports — the fields every method shares are kept, and the rest is reported in
            `ignoredFields`.
          example: cervicalMucus
        cycleStartDate:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Day 1 of this cycle. The first entry in `days` is this date.
          example: "2026-03-10"
        days:
          type: array
          maxItems: 400
          description: |-
            The days of the cycle in date order, starting at `cycleStartDate`, so the position
            in the array is the day number. A day with nothing recorded is an empty object
            (`{}`) rather than being left out.

            On import an empty day is a gap: it is not written, and it is not treated as a
            conflict with existing data. The **first** day of a cycle is always written even
            when empty, because it carries the cycle boundary.
          items:
            $ref: '#/components/schemas/NfpFileDay'
        comment:
          type: string
          maxLength: 1024
          description: Not recorded by this app — only per-day comments are. Reported on import.
        cycleParticularCases:
          type: array
          maxItems: 8
          description: Not recorded by this app. Reported on import.
          items:
            type: string
            enum: [FirstEyedCycle, PostPill, Pregnancy, PostPartum]
        currentCyclePlannedPregnancy:
          type: string
          enum: [Yes, No, Undecided]
          description: Not recorded by this app. Reported on import.
        nextMonthsPlannedPregnancy:
          type: string
          enum: [Yes, No, Undecided]
          description: Not recorded by this app. Reported on import.
        endOfCycleFollowUp:
          type: string
          enum: [Pregnancy, Menopause, Disease, Other]
          description: Not recorded by this app. Reported on import.
        temperatureUsualTime:
          type: string
          pattern: '^\d{2}:\d{2}:\d{2}$'
          description: Not recorded by this app. Reported on import.
        temperatureCaptureType:
          type: string
          maxLength: 64
          description: Not recorded by this app. Reported on import.
        temperatureThermometerType:
          type: string
          maxLength: 64
          description: Not recorded by this app. Reported on import.

    NfpFileDay:
      type: object
      description: |-
        One day. **Every field is optional**, and a field with no value is left out entirely
        rather than set to `null` — so `{}` is a day with nothing recorded.

        Flags are real booleans and free-text labels are real arrays (the early draft typed
        them as strings; those are still accepted on import).

        ### What this app stores

        Fields marked *not stored* are read, counted and reported in `ignoredFields`, never
        written. Fields marked *narrowed* are written as something less precise, and reported
        in `mappedFields`.
      properties:
        comments:
          type: array
          maxItems: 32
          description: |-
            The user's free notes. Joined with newlines into the single `comment` of the live
            `Day`, which holds **256 characters** — a longer result rejects the file.

            `GET /export/nfp` also writes the day's labels with no type yet (`freeOther`) here, as one
            last entry joined with `", "`. A name that would take the day past the 256 characters
            is left out of the file, so that an export always imports.
          items:
            type: string
            maxLength: 256
          example: ["cramps in the morning"]
        stampColor:
          type: string
          enum: [Green, Red, Yellow, White]
          description: |-
            *Narrowed for `White` alone.* The stamp is stored as a colour plus an optional baby
            label, and white is the absence of a colour — so `White` without `stampBaby` cannot
            be told from a day with no stamp, and is stored as no stamp.
          example: White
        stampBaby:
          type: boolean
          description: The baby label drawn on top of the stamp colour.
          example: true
        isPeak:
          type: boolean
          description: A cycle can hold more than one peak day.
          example: true
        counterStart:
          type: integer
          minimum: 0
          maximum: 255
          description: Number of days to show a counter for. `0` means none.
          example: 3
        sexUnion:
          type: string
          enum: [Union, ReservedUnion, LastReportedUnion]
          description: |-
            *Narrowed.* This app records only **whether** there was a union, so all three values
            are stored the same way and export always writes `Union`.
          example: Union
        mucusNotObserved:
          type: boolean
          description: |-
            The user recorded nothing that day — the file-format name for `dayNotObserved` on
            the live `Day`.

            The format calls it incompatible with an observation — `codifiedMucusObservation`,
            `codifiedMucusSensation`, `codifiedBleedingObservation`, `codifiedCervixHeight`,
            `codifiedCervixConsistency`, `freeMucusObservation`, `freeMucusSensation`,
            `booleanCervixMucus` or `booleanCervixAperture` on the same day.

            `day_timeline` has no such rule: `day_not_observed` is one column among the rest,
            and a day can carry it next to a stamp or a label, so `GET /export/nfp` writes that
            combination. `POST /import` therefore **accepts** it, keeps both exactly as the
            account had them, and reports the contradiction in `warnings`.
          example: true
        booleanPregnancyDetected:
          type: boolean
          example: false
        temperature:
          type: number
          description: |-
            Basal body temperature, a real number. Stored to two decimals, and must be between
            **30 and 45 °C** — anything else rejects the file.
          example: 36.75
        temperatureTime:
          type: string
          pattern: '^\d{2}:\d{2}:\d{2}$'
          description: When it was taken, `hh:mm:ss`. Ignored without a `temperature`.
          example: "06:45:00"
        freeMucusSensation:
          type: array
          maxItems: 20
          description: |-
            **Cervical mucus.** Free-text sensation labels. Each becomes a `sensation` description on
            the account, reusing an existing one of the same name. Max **256 characters** each.
          items:
            type: string
            maxLength: 256
          example: ["dry", "slippery"]
        freeMucusObservation:
          type: array
          maxItems: 20
          description: "**Cervical mucus.** Free-text observation labels, as above but typed `observation`."
          items:
            type: string
            maxLength: 256
          example: ["clear and stretchy"]
        codifiedBleedingObservation:
          type: string
          maxLength: 32
          description: |-
            **FertilityCare:** `VH`, `H`, `M`, `L`, `VL`, `Br` (stored as `B`).

            **Any other method:** *narrowed.* There is no bleeding field outside FertilityCare
            here, so a value becomes a **Red stamp** when the day has no `stampColor` of its
            own, and is reported otherwise. This is how a `symptothermic_fr`
            `Traces`/`Medium`/`Heavy` is kept.
          example: VH
        codifiedMucusSensation:
          type: string
          maxLength: 32
          description: |-
            **FertilityCare:** `0`, `2`, `2W`, `4`, `6`, `8`, `10`, `10DL`, `10SL`, `10WL`. A number
            (`2`, `10`) is read as the string of the same number.

            *Not stored for other methods*: the same key holds a different vocabulary under
            `symptothermic_fr` (`Dry`/`Humid`/`Wet`/`Lubricated`), which has no equivalent here.
          example: "10DL"
        codifiedMucusObservation:
          type: string
          maxLength: 32
          description: |-
            **FertilityCare:** `C`, `C/K` (stored as `CK`), `K`, `G`, `L`, `P`, `Y`.
            *Not stored for other methods*, as above.
          example: K
        codifiedNumberObservations:
          type: string
          maxLength: 16
          description: |-
            **FertilityCare:** `x1`, `x2`, `x3`, `AD`. Stored and exported uppercase (`X1`).
            The numbers `1`, `2`, `3` are read as `x1`, `x2`, `x3`.
          example: X2
        codifiedPainObservations:
          type: string
          maxLength: 16
          description: "**FertilityCare:** `AP`, `RAP`, `LAP`."
          example: AP
        codifiedArrow:
          type: string
          enum: [Up, Down, Right]
          description: "**FertilityCare.** *Not stored for other methods.*"
          example: Up
        nonUsualBleeding:
          type: boolean
          description: "*Not stored.* This app has no spotting flag of its own."
        booleanCervixMucus:
          type: boolean
          description: "*Not stored.* Cervix observations are not recorded here."
        booleanCervixAperture:
          type: boolean
          description: "*Not stored.* Cervix observations are not recorded here."
        codifiedCervixConsistency:
          type: string
          maxLength: 32
          description: "*Not stored.* Cervix observations are not recorded here."
        codifiedCervixHeight:
          type: string
          maxLength: 32
          description: "*Not stored.* Cervix observations are not recorded here."
        codifiedTemperatureParasitic:
          type: string
          maxLength: 64
          description: "*Not stored.* No temperature-disturbance field is recorded here."
        temperatureCaptureOffset:
          type: integer
          minimum: -12
          maximum: 12
          description: "*Not stored.* Only an absolute `temperatureTime` is recorded here."
        codifiedEvents:
          type: array
          maxItems: 32
          description: "*Not stored.* No pre-defined event list is recorded here."
          items:
            type: string
            maxLength: 128
        babyFeedCount:
          type: integer
          minimum: 0
          maximum: 99
          description: "*Not stored.* No feed count is recorded here."
        codifiedManualFertility:
          type: string
          maxLength: 64
          description: "*Not stored.* Fertility is computed for display, not stored."

    ImportReport:
      type: object
      description: |-
        What `POST /import` did — or, on a dry run, what it would have done: `dryRun=1` reads
        the account to fill the same lists without writing, so one shape describes both and a
        client can render them the same way. Returned inside the usual `data` envelope.

        The three report lists are the point of this answer: **nothing the file carries is
        dropped without appearing in one of them.** Show them to the user.
      properties:
        dryRun:
          type: boolean
          description: True when `dryRun=true` was sent, so nothing was written.
          example: false
        override:
          type: boolean
          description: The `override` value that was applied.
          example: false
        schemaVersion:
          type: string
          description: The version the file declared.
          example: "1.0"
        sourceApp:
          type: string
          description: The app the file says wrote it.
          example: moncycle.app
        cyclesRead:
          type: integer
          description: Cycles found in the file.
          example: 2
        daysRead:
          type: integer
          description: Day entries found, including the empty ones.
          example: 58
        daysToWrite:
          type: integer
          description: |-
            Days the file actually asks to write — `daysRead` minus the gaps. On a dry run this
            is what a real import would attempt.
          example: 54
        daysWritten:
          type: integer
          description: "`daysCreated` + `daysOverwritten`. Absent on a dry run."
          example: 54
        daysCreated:
          type: array
          description: Dates that had no data and were created (or would be, on a dry run).
          items:
            type: string
            format: date
          example: ["2026-03-10", "2026-03-11"]
        daysOverwritten:
          type: array
          description: Dates that already had data and were replaced (`override=1` only).
          items:
            type: string
            format: date
          example: []
        daysSkipped:
          type: array
          description: |-
            Dates left untouched because they already had data and `override` was `0`. Re-send
            with `override=1` to replace them.
          items:
            type: string
            format: date
          example: ["2026-03-09"]
        daysAlreadyInAccount:
          type: array
          description: |-
            Dates of the file the account already held a day on: `daysOverwritten` and
            `daysSkipped` together. It is the one list that does not depend on `override`, which
            is what makes it the one to show next to that choice — `dryRun=1` fills it without
            writing anything.
          items:
            type: string
            format: date
          example: ["2026-03-09"]
        duplicatedDaysInFile:
          type: array
          description: |-
            Dates **the file itself** carries twice, because two of its cycles cover them. The
            file is refused over them, so this is empty in every `200`; it is filled in
            `error.details` on a refused dry run, where it is the list that says what to fix.
          items:
            type: string
            format: date
          example: []
        descriptionsCreated:
          type: integer
          description: |-
            Free-text labels that did not exist on the account yet and were added. On a dry
            run, how many would be — counted over the days that would actually be written, so
            a skipped day contributes none.
          example: 3
        warnings:
          type: array
          description: |-
            Accepted, but worth telling the user — typically a cycle whose `method` differs from
            the account's, a method this app does not record, a `null` read as not set, or a
            wrong value in a field this app does not store (see "A file is read kindly").
          items:
            type: string
          example:
            - "[cycles[0]] the cycle uses 'fertilityCare' while this account is set to 'cervicalMucus'. The data was imported; change the method in the account settings to see it."
        mappedFields:
          type: array
          description: |-
            Stored, but as something narrower than the file said. The cases are: a bleeding
            value outside FertilityCare becoming a Red stamp, a `ReservedUnion` /
            `LastReportedUnion` becoming a plain union, a `White` stamp with no baby label
            becoming no stamp, and a free-text label the file uses under both types keeping
            the single type it has on the account.
          items:
            type: string
          example:
            - "[2007-01-25] codifiedBleedingObservation 'Heavy' stored as a Red stamp (symptothermic_fr records bleeding as a stamp)."
            - "[2007-02-06] sexUnion 'ReservedUnion' stored as a plain union: day_timeline records only whether there was one."
            - "[2024-08-01] 'humide' is recorded as a sensation on this account and stays one: a label carries a single type here."
        ignoredFields:
          type: array
          description: |-
            Carried by the file with nowhere to put it here. Each line reads
            `[where] field: why`.
          items:
            type: string
          example:
            - "[file] userInformation: the account's own identity is never changed by an import."
            - "[2007-01-25] codifiedManualFertility: fertility is computed for display, not stored."

    ValidationIssue:
      type: object
      description: One thing wrong in a request.
      required: [field, code, message]
      properties:
        field:
          type: string
          description: |-
            Where. A body field (`stampColor`, `freeMucusSensation[2]`), `query.<name>` for a query parameter,
            `path.<name>` for a part of the address, `body` for the body as a whole.
          example: stampColor
        code:
          type: string
          description: A stable slug to branch on.
          enum: [unknown_field, read_only_field, missing_field, wrong_type, invalid_value, out_of_range, too_long, too_many, invalid_date, invalid_timestamp, invalid_email, date_mismatch, body_not_allowed, password_required, password_too_short, password_too_long, password_invalid, password_unchanged, email_unchanged, invalid_range, terms_not_accepted]
          example: invalid_value
        message:
          type: string
          description: A sentence in English. It names the field and says what is expected; it never holds the value of a password, a code or a text.
          example: "'stampColor' must be one of Green, Red, Yellow, White, or null."

    ValidationErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum: [validation_failed]
            message:
              type: string
              description: A summary for a human (the first problem, and how many there are).
            details:
              type: object
              required: [issues]
              properties:
                issues:
                  type: array
                  items:
                    $ref: '#/components/schemas/ValidationIssue'

    ServerInfo:
      type: object
      description: What `GET /server_info` says. Fields may be added; none is ever renamed or removed.
      properties:
        app:
          type: string
          example: moncycle.app
        appVersion:
          type: integer
          description: The version of the app the server runs, also the version of its database schema. It rises with each release; the version of the contract is the `v2` of the address.
          example: 15
        maintenanceMode:
          type: boolean
          description: Is the server in maintenance? Every other endpoint then answers `503 maintenance`.
        registrationEnabled:
          type: boolean
          description: Does this instance accept new accounts?
        demoEnabled:
          type: boolean
          description: Are the two public demo accounts on?
        captchaAvailable:
          type: boolean
          description: "`false` when the instance has no `CAPTCHA_SECRET`: register and recover_password answer `503 captcha_unavailable`."
        newsUrl:
          type: string
          format: uri
          nullable: true
          description: |-
            The https page the web app shows as its news banner, in an iframe: the `NEWS_URL` setting of the instance. `null` when it is off,
            and for any value that is not an https URL.
          example: https://www.moncycle.app/actu.html
        termsOfServiceUrl:
          type: string
          format: uri
          nullable: true
          description: |-
            The https page of the terms of service of this instance: the `TERMS_OF_SERVICE_URL` setting. Whoever uses the API accepts them, and
            `POST /register` requires `termsAccepted: true`. A client that signs people up shows this page (or links to it) beside the box to
            tick. `null` when the instance has no page, and for any value that is not an https URL.
          example: https://www.moncycle.app/ToS/term_of_service_fr.html
        limits:
          type: object
          description: The numbers a form can check before it sends anything.
          properties:
            passwordMinBytes:
              type: integer
              example: 10
            passwordMaxBytes:
              type: integer
              example: 72
            accountNicknameMaxChars:
              type: integer
              example: 255
            registerCommentMaxChars:
              type: integer
              example: 255
            notificationEmailsMax:
              type: integer
              example: 5
            birthYearMaxAge:
              type: integer
              description: A birth year is this year or up to this many years back.
              example: 100
            tokenNameMaxChars:
              type: integer
              example: 256
            tokenExpiresInDaysMin:
              type: integer
              example: 1
            tokenExpiresInDaysMax:
              type: integer
              example: 365
            dayCommentMaxChars:
              type: integer
              example: 256
            descriptionNameMaxChars:
              type: integer
              example: 256
            counterStartMax:
              type: integer
              example: 255
            temperatureMin:
              type: number
              example: 0
            temperatureMax:
              type: number
              example: 99.99
            queryDaysMax:
              type: integer
              description: How many dates (`dates`) or days (`from` to `to`) one `GET /day` reads.
              example: 100
            requestBodyMaxBytes:
              type: integer
              description: The biggest request body any endpoint takes.
              example: 262144

    TimelineSync:
      type: object
      properties:
        syncTimestamp:
          type: string
          format: date-time
          description: |-
            The server clock when it started to answer. Send it as `since` next time, once you have merged this answer.
          example: "2026-03-10T15:31:02Z"
        days:
          type: array
          description: |-
            Changed days, in date order, as a flat array. A cleared day is there with every field empty.
          items:
            $ref: '#/components/schemas/Day'
        descriptions:
          type: array
          description: |-
            **Every** label of the account, not only the changed ones. A label that is not in the list does not exist any more.
          items:
            $ref: '#/components/schemas/Description'
        allCyclesFirstDay:
          type: array
          description: |-
            Every date flagged `cycleFirstDay: true`, **newest first**, whole every time. Enough to draw a cycle navigator.
          items:
            type: string
            format: date
          example: ["2026-03-10", "2026-02-11", "2026-01-14"]
        allPregnancyDates:
          type: array
          description: "Every date flagged `booleanPregnancyDetected: true`, newest first, whole every time."
          items:
            type: string
            format: date

    AccountPatch:
      type: object
      description: |-
        Every field is optional. A field that is not in this list is refused (`unknown_field`), and so are the read-only fields
        of `Account` (`userId`, `inscriptionDate`, `oldestDay`, `totpState`).
      properties:
        nickname:
          type: string
          maxLength: 255
          description: A nickname for the user, their initials for instance. Not empty, at most 255 characters.
          example: MB
        password:
          type: string
          format: password
          description: The current account password. Required to change `newPassword`, `notificationEmails` or `loginEmail`; ignored otherwise.
        newPassword:
          type: string
          format: password
          minLength: 10
          description: The new password. 10 characters at least, **72 bytes at most** (bcrypt reads no more, so a longer one is refused instead of being half kept), no null character, different from the current one. Needs `password`.
        logoutOtherDevices:
          type: boolean
          default: false
          description: |-
            With `newPassword` (sending it as `true` without `newPassword` is refused): `true` closes every other session of the
            account (their tokens stop working, each of those devices has to log in again). The calling session stays open.
            The settings, the password change and the sign-out happen together or not at all.
        loginEmail:
          type: string
          format: email
          description: The new login address. Spaces around it are ignored and it is stored in lower case. Needs `password` (and `code` with two-factor authentication). Takes effect when the link mailed to it is used.
          example: marie.new@example.org
        code:
          type: string
          description: The TOTP code. Required with `loginEmail` when two-factor authentication is on; ignored otherwise.
          example: "123456"
        notificationEmails:
          type: string
          description: The addresses that also receive the cycles by email, separated by `;` (5 at most, each valid, 1024 characters in all; lower case, duplicates and empty items dropped). Send `""` to empty the list. Needs `password`.
          example: partner@example.org;mother@example.org
        method:
          type: string
          enum: [cervicalMucus, fertilityCare]
          description: Tracking method. Exactly one of the two values. `temperatureTracking` keeps its value when you do not send it.
        temperatureTracking:
          type: boolean
          description: Does the user also record basal temperature? `method` keeps its value when you do not send it.
        birthYear:
          type: integer
          description: Year of birth, for anonymous statistics. The current year or up to 100 years earlier.
          example: 1994
        timelineAscending:
          type: boolean
          description: |-
            Display preference only: `true` puts today at the top of the table. The API itself
            always returns days in ascending date order, whatever this is set to.
        research:
          type: boolean
          description: Consent to contribute anonymous data to research programs.
        sponsor:
          type: boolean
          description: Marks the account as a financial supporter of the project.
        autoMailExport:
          type: boolean
          description: |-
            Send the export of each finished cycle by email (PDF, CSV and NFP file, to the login
            address and to `notificationEmails`). `true` by default for every account; `false` stops
            these emails.
        lastWriteClientUtc:
          type: string
          format: date-time
          description: Your own clock, RFC 3339 with a zone. The server's clock when absent.
          example: "2026-03-10T15:30:45Z"

    AccountPatchMeta:
      type: object
      properties:
        fieldsUpdated:
          type: array
          description: Names of the settings that were written (`password` when `newPassword` was set). Empty when nothing was. `loginEmail` is never in it, because it changes when the link is used.
          items:
            type: string
            enum: [nickname, notificationEmails, method, birthYear, timelineAscending, research, sponsor, autoMailExport, password]
          example: [method]
        loggedOutDevices:
          type: integer
          description: Number of other sessions closed. Only when `newPassword` was sent; `0` unless `logoutOtherDevices` was `true`.
        loginEmailLinkSent:
          type: boolean
          description: Only when `loginEmail` was sent. `false` means the mail with the link could not be sent.

    TotpConfirmRequest:
      type: object
      required: [code, password]
      properties:
        code:
          type: string
          description: The one-time code of the authenticator app, as a string of digits (a leading zero matters). A number is accepted too.
          example: "091710"
        password:
          type: string
          description: The current password of the account.

    TotpCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: The one-time code of the authenticator app, as a string of digits (a leading zero matters). A number is accepted too.
          example: "091710"

    RevokedTokens:
      type: object
      properties:
        revoked:
          type: integer
          description: How many tokens were revoked.
          example: 3

    DescriptionType:
      type: string
      enum: [undefined, observation, sensation]
      description: "`sensation` = what the user feels. `observation` = what the user sees. `undefined` = not classified yet."
      example: sensation

  securitySchemes:

    HTTPtoken:
      type: http
      scheme: Bearer
      description: |-
        The token from `POST /token`, in the `Authorization` header:

        ```
        Authorization: Bearer <token>
        ```

        Use this for apps, scripts and mobile clients. It wins over the cookie if both are sent, and is then the only credential looked at.
        A token made without `expiresInDays` is purged after 40 days without use, or when it is a year old;
        one made with it dies on that day. `DELETE /token` destroys the one you send.

    HTTPcookie:
      type: apiKey
      in: cookie
      name: MONCYCLEAPP_TOKEN
      description: |-
        The same token, in a cookie. `POST /token` sets it for you when you ask (`cookie: true`; HttpOnly, SameSite=Strict by default, 5 years),
        so a browser client has nothing to store.

        The captcha does not use a cookie (see `POST /captcha`).
