# Installed as conf-enabled/zz-moncycleapp.conf: it sorts AFTER Debian's security.conf, so its
# ServerTokens / ServerSignature win. Prod is the default; dev opts in through dev.env (PHP_CACHE=Off).

ServerTokens Prod
ServerSignature Off

# The host of APP_URL, made by the entrypoint (APP_SERVER_NAME). Only silences AH00558: the app has no virtual host.
ServerName ${APP_SERVER_NAME}

# Hard caps. The body: REQUEST_BODY_MAX_BYTES (config.php, 10 MB by default), which the entrypoint reads at every start and gives to
# Apache and to php.ini as APP_BODY_MAX_BYTES (post_max_size): one setting, three walls. PHP checks it too (lib/http.php). The biggest body the app takes is /api/v2/import's.
# LimitRequestBody refuses a larger one when its body is first read, which is after mod_php has started: PHP
# then logs "POST Content-Length of N bytes exceeds the limit of the setting" (a line no code can stop) and runs
# the endpoint on a body it does not have. So a request is also refused by its Content-Length before any
# handler, in /api/ below. LimitRequestBody stays for a body sent in chunks, which has no Content-Length.
# (measured: past the wall PHP reads a body into memory: the whole body in memory, so a body at the wall must fit memory_limit)
LimitRequestBody ${APP_BODY_MAX_BYTES}
Timeout 30

# CVE-2026-109618: PHP's multipart parser (memory exhausted while parsing) is the way in, and the app has no upload and
# no form: every body is JSON (415 otherwise, lib/http.php). So multipart and urlencoded bodies are refused here, before
# mod_php reads them. mod_rewrite again, for the reason given above; the answer is the API's own envelope
# (the same refusal as http_exit_if_body_refused() in lib/http.php, for a server without this wall).
# Per-directory, not server-level: the virtual host does not inherit a server-level RewriteEngine. /api/ (after it, so that it
# merges over this one) inherits this rule (RewriteOptions Inherit), or its own 413 rule would replace it.
# The headers of a request are capped too (a part with endless headers is the second way in).
<Location "/">
	RewriteEngine On
	RewriteCond %{HTTP:Content-Type} ^[[:space:]]*(multipart/|application/x-www-form-urlencoded) [NC]
	RewriteRule ^ - [R=415,L]
</Location>
ErrorDocument 415 '{"error":{"code":"unsupported_media_type","message":"The request body must be application/json."}}'
Header always set Content-Type "application/json" "expr=%{REQUEST_STATUS} == 415"
LimitRequestFields 50
LimitRequestFieldSize 4096
LimitRequestLine 4096

# The 413 is the API's, in the API's own envelope: PHP is not there to answer it. The text of an
# ErrorDocument is sent as "text/html", so its type is set here. mod_rewrite is used because it is the one
# module that can refuse with a 413 on a header's value: <If> does not drive it, and Redirect does not
# answer in a <Location>.
# CGIPassAuth: Apache keeps the Authorization header out of the environment (so out of PHP's $_SERVER) unless asked, and the API's
# Bearer tokens travel in it (lib/sec_token.php).
<Location "/api/">
	CGIPassAuth On
	RewriteEngine On
	RewriteOptions Inherit
	RewriteCond expr "%{HTTP:Content-Length} -gt ${APP_BODY_MAX_BYTES}"
	RewriteRule ^ - [R=413,L]
	ErrorDocument 413 '{"error":{"code":"file_too_large","message":"The request body is over the limit of ${APP_BODY_MAX_BYTES} bytes. To import a file, split it into fewer cycles."}}'
	Header always set Content-Type "application/json" "expr=%{REQUEST_STATUS} == 413"
</Location>

# The app uses GET, POST, DELETE (and HEAD / OPTIONS for the browser); PUT, PATCH, TRACE... are refused
<Location "/">
	<LimitExcept GET POST DELETE HEAD OPTIONS>
		Require all denied
	</LimitExcept>
</Location>

# prefork: ~21 MB per worker, the default 150 workers could eat 3 GB.
# (recover_password sleeps 1-5 s on purpose and holds a worker: rate-limit it at the edge)
<IfModule mpm_prefork_module>
	StartServers 2
	MinSpareServers 2
	MaxSpareServers 6
	MaxRequestWorkers 30
	MaxConnectionsPerChild 2000
</IfModule>

<Directory /var/www/>
	Options +MultiViews -Indexes
	MultiviewsMatch Any
	AllowOverride None
</Directory>

# script/ (cron, stats, migrations): this machine only. Run cron with
# `docker exec <container> php /var/www/html/script/cron.php`. APP_SCRIPT_ALLOW comes from the environment, defaulted by the entrypoint.
<DirectoryMatch "^/var/www/html/script(/|$)">
	Require ip ${APP_SCRIPT_ALLOW}
</DirectoryMatch>

# Files that are not public. PHP still `require`s them: these rules only concern HTTP.
# FilesMatch / DirectoryMatch rather than LocationMatch: MultiViews resolves /config to config.php
# after the Location match.
<FilesMatch "^(config(\.[a-z]+)?\.php|constants\.php|composer\.(json|lock)|.*\.(sql|md|bak|pw)|.*\.bak\..*)$">
	Require all denied
</FilesMatch>
<DirectoryMatch "^/var/www/html/lib(/|$)">
	Require all denied
</DirectoryMatch>
<DirectoryMatch "^/var/www/html/vendor(/|$)">
	Require all denied
</DirectoryMatch>
# the only vendor paths the pages load (the later section wins)
<DirectoryMatch "^/var/www/html/vendor/(components/jquery|chartjs|swagger-api/swagger-ui/dist)(/|$)">
	Require all granted
</DirectoryMatch>

# Security headers. The CSP is the policy of the pages THIS image serves: no inline script anywhere (the pages
# load js/*.js), so script-src is 'self' alone, and a script injected into the page cannot run. style-src keeps
# 'unsafe-inline' (the pages and tableau.js write style="" attributes); img-src has data: for Swagger UI's icons.
# connect-src is where a script may send a request: this origin and the origin of the news file (NEWS_URL, README), which the entrypoint
# puts in CSP_CONNECT_SRC. frame-src is where a frame may load a page from: the origin of the terms of service page
# (TERMS_OF_SERVICE_URL), in CSP_FRAME_SRC; 'none' when there is none.
# A web app served from ANOTHER origin needs this same policy from its own server, with the API's origin added to
# connect-src (docs/deployment.md); this one only covers the pages of this image.
# No CORS header: the API is same-origin here, and the browser origins that may write to it are the settings
# APP_URL and WEB_APP_ORIGINS (lib/sec.php), not a header.
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "same-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src ${CSP_CONNECT_SRC}; frame-src ${CSP_FRAME_SRC}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
# HTTPS only (the TLS edge sets X-Forwarded-Proto), no preload
Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTP:X-Forwarded-Proto} == 'https' || %{HTTPS} == 'on'"

# Cache policy. The default ETag holds the inode, which differs between containers and rebuilds.
FileETag MTime Size
# no-store on the API: the exports (personal data) stay out of shared-device caches.
# "always" lands in a different header table than the plain "Header set" of the file types below,
# so the plain one is removed or the answer would carry both policies.
<LocationMatch "^/api/">
	Header always set Cache-Control "no-store"
	Header unset Cache-Control
</LocationMatch>
# pages and scripts: always revalidate (cheap 304, never stale)
<FilesMatch "\.(html|js|css)$">
	Header set Cache-Control "no-cache"
</FilesMatch>
<FilesMatch "\.(ttf|woff2?)$">
	Header set Cache-Control "public, max-age=31536000, immutable"
</FilesMatch>
<FilesMatch "\.(png|jpe?g|ico|svg)$">
	Header set Cache-Control "public, max-age=604800"
</FilesMatch>
# dev (PHP_CACHE=Off): no cache at all, whatever the file
<If "%{ENV:PHP_CACHE} =~ /^(0|off|no|false|none)$/i">
	Header always set Cache-Control "no-store"
	Header unset Cache-Control
</If>

# mod_deflate only covers html, css, js, xml and text by default
AddOutputFilterByType DEFLATE application/json application/yaml font/ttf image/svg+xml
